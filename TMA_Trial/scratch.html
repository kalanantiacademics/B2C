<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Inter:wght@400;600;700;800;900&display=swap');
    
    * {
      font-family: 'Inter', sans-serif;
    }

    h1, h2, h3, .nav-btn {
      font-family: 'Fredoka', sans-serif;
    }

    body {
      background-color: #FFFBEB; /* amber-50 */
      background-image: radial-gradient(#FCD34D 1px, transparent 1px);
      background-size: 24px 24px;
      overflow-x: hidden;
    }

    /* Custom Retro Utilities */
    .text-stroke-black {
      -webkit-text-stroke: 3px black;
      text-stroke: 3px black;
      paint-order: stroke fill;
    }

    .animate-spin-slow {
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Custom Scrollbar for Steps */
    .custom-scrollbar::-webkit-scrollbar {
      width: 12px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1; 
      border-radius: 6px;
      border: 2px solid black;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #FCD34D; 
      border-radius: 6px;
      border: 2px solid black;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #FBBF24; 
    }

    /* Transitions */
    .slide-transition {
      transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    .hover-lift {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hover-lift:hover {
      transform: translateY(-8px) rotate(-1deg);
    }

    /* Animations */
    @keyframes subtle-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    .icon-pulse {
      animation: subtle-pulse 2s ease-in-out infinite;
    }

    /* Pattern backgrounds */
    .dots-pattern {
      background-image: radial-gradient(circle, rgba(0,0,0,0.1) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Number badges */
    .number-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-weight: 900;
      font-size: 18px;
    }

    /* Decorative corner */
    .corner-deco {
      position: absolute;
      width: 60px;
      height: 60px;
    }

    /* Side panel accent */
    .side-accent {
      position: absolute;
      width: 12px;
      height: 100%;
      top: 0;
    }
  </style>
</head>

      React.useEffect(() => {
        const handleKeyPress = (e) => {
          const slide = slides[currentSlide];
          
          // Special handling for feedback slide
          if (slide?.type === 'feedback') {
            if (e.key === 'ArrowLeft') {
              e.preventDefault();
              setSelectedEmoji(prev => Math.max(0, prev - 1));
            } else if (e.key === 'ArrowRight') {
              e.preventDefault();
              setSelectedEmoji(prev => Math.min(slide.emojis.length - 1, prev + 1));
            } else if (e.key === 'ArrowUp') {
              e.preventDefault();
              if (currentSlide > 0) setCurrentSlide(currentSlide - 1);
            } else if (e.key === 'ArrowDown') {
              e.preventDefault();
              if (currentSlide < slides.length - 1) setCurrentSlide(currentSlide + 1);
            }
          } else {
            // Normal slide navigation with left/right arrows
            if (e.key === 'ArrowLeft') {
              e.preventDefault();
              if (currentSlide > 0) setCurrentSlide(currentSlide - 1);
            } else if (e.key === 'ArrowRight') {
              e.preventDefault();
              if (currentSlide < slides.length - 1) setCurrentSlide(currentSlide + 1);
            }
          }
        };

        window.addEventListener('keydown', handleKeyPress);
        return () => window.removeEventListener('keydown', handleKeyPress);
      }, [currentSlide]);

          subtitle: "Apa ish yang bisa kita buat di Scratch?",
          content: "Let's explore amazing projects! 🌟\nFrom games to animations and more!",
          icon: <Gamepad2 className="w-20 h-20" />
        },

        // SHOWCASE 1
        {
          type: "showcase",
          theme: "showcase",
          bgColor: "bg-gray-800",
          gridColor: "text-gray-600",
          title: "SHOWCASE 1",
          subtitle: "Amazing Scratch Project!",
          description: "Check out this cool creation...",
          iframeUrl: "https://scratch.mit.edu/projects/1122438928/embed"
        },

        // SHOWCASE 2
        {
          type: "showcase",
          theme: "showcase",
          bgColor: "bg-gray-800",
          gridColor: "text-gray-600",
          title: "SHOWCASE 2",
          subtitle: "Creative Projects!",
          description: "See what's possible with Scratch...",
          iframeUrl: "https://scratch.mit.edu/projects/871825584/embed"
        },

        // SHOWCASE 3
        {
          type: "showcase",
          theme: "showcase",
          bgColor: "bg-gray-800",
          gridColor: "text-gray-600",
          title: "SHOWCASE 3",
          subtitle: "Interactive Art!",
          description: "Explore interactive animations...",
          iframeUrl: "https://scratch.mit.edu/projects/48732236/embed"
        },

        // SHOWCASE 4
        {
          type: "showcase",
          theme: "showcase",
          bgColor: "bg-gray-800",
          gridColor: "text-gray-600",
          title: "SHOWCASE 4",
          subtitle: "More Inspiration!",
          description: "Get inspired by these projects...",
          iframeUrl: "https://scratch.mit.edu/projects/1157963191/embed"
        },

        // CLOSING
        {
          type: "closing",
          theme: "closing",
          bgColor: "bg-blue-600",
          gridColor: "text-blue-400",
          title: "THANK YOU!",
          subtitle: "See you next time! 👋",
          messages: ["Practice makes perfect!", "Happy Coding!"]
        }
      ];

      const nextSlide = () => {
        if (currentSlide < slides.length - 1) setCurrentSlide(currentSlide + 1);
      };

      const prevSlide = () => {
        if (currentSlide > 0) setCurrentSlide(currentSlide - 1);
      };

      const slide = slides[currentSlide];

      return (
        <div className="min-h-screen bg-gray-900 flex items-center justify-center font-sans overflow-hidden p-4">
          
          {/* Main Slide Container */}
          <div 
            className={`relative w-full aspect-video max-w-[1400px] h-[85vh] min-h-[700px] overflow-hidden rounded-[40px] border-[8px] border-black shadow-[20px_20px_0px_rgba(0,0,0,0.5)] ${slide.bgColor} transition-colors duration-500`}
          >
            {/* Grid Background Overlay */}
            <GridBackground color={slide.gridColor} />

            {/* Content Wrapper */}
            <div className="relative w-full h-full p-12 flex flex-col z-10">
              
              {/* Header Logos */}
              <div className="absolute top-8 left-10 z-20">
                 <div className="bg-white px-4 py-2 rounded-xl border-4 border-black shadow-[4px_4px_0px_rgba(0,0,0,0.2)] hover-lift transition-transform cursor-pointer">
                   <img 
                    src="https://images2.imgbox.com/51/6a/xhLlGQcZ_o.png" 
                    alt="Ruangguru Coding" 
                    className="h-12 w-auto"
                   />
                 </div>
              </div>

              <div className="absolute top-8 right-10 z-20 flex gap-4">
                <div className="bg-yellow-400 px-4 py-2 rounded-xl border-4 border-black shadow-[4px_4px_0px_rgba(0,0,0,0.2)] text-black font-bold flex items-center">
                  STEP {currentSlide + 1}/{slides.length}
                </div>
              </div>

              {/* --- RENDERERS BY TYPE --- */}

              {/* 1. TITLE COMPONENT */}
              {slide.type === "title" && (
                <div className="flex-1 flex flex-col justify-center items-center text-center relative">
                  {/* Decorative Elements */}
                  {slide.decorations?.map((deco, i) => (
                    deco.type === "star" ? <Star key={i} className={`absolute text-yellow-300 ${deco.pos}`} color={deco.color} /> :
                    deco.type === "circle" ? <Circle key={i} className={`absolute ${deco.pos}`} color={deco.color} /> :
                    <Wiggle key={i} className={`absolute ${deco.pos}`} color={deco.color} />
                  ))}
                  
                  <RetroCard color="bg-yellow-300" rotate="-3deg" className="mb-8 p-12 max-w-4xl">
                    <h1 className="text-8xl font-black text-black tracking-tighter drop-shadow-sm leading-[0.9]">
                      {slide.title}
                    </h1>
                  </RetroCard>
                  
                  <div className="bg-white border-4 border-black rounded-full px-8 py-3 transform rotate-2 shadow-[8px_8px_0px_rgba(0,0,0,0.2)] mb-8">
                     <h2 className="text-4xl font-bold text-purple-600">{slide.subtitle}</h2>
                  </div>

                  <p className="text-3xl font-bold text-white drop-shadow-md">{slide.description}</p>
                </div>
              )}

              {/* 2. INSTRUCTORS COMPONENT */}
              {slide.type === "instructors" && (
                <div className="flex-1 flex flex-col justify-center items-center">
                  <h1 className="text-7xl font-black text-white mb-16 text-stroke-black drop-shadow-[8px_8px_0px_#000] tracking-tight">
                    {slide.title}
                  </h1>
                  <div className="flex gap-12">
                    {slide.instructors.map((name, i) => (
                      <RetroCard key={i} color={i % 2 === 0 ? "bg-purple-300" : "bg-green-300"} rotate={i % 2 === 0 ? "2deg" : "-2deg"} className="p-10 w-80 text-center hover:scale-105 transition-transform">
                        <div className="w-32 h-32 bg-gray-200 rounded-full border-4 border-black mx-auto mb-6 flex items-center justify-center text-5xl">
                          👾
                        </div>
                        <h3 className="text-3xl font-black text-black leading-tight">{name}</h3>
                        <p className="text-lg font-bold opacity-70 mt-2">Awesome Mentor</p>
                      </RetroCard>
                    ))}
                  </div>
                </div>
              )}

              {/* 3. RULES / CHECK COMPONENT */}
              {(slide.type === "rules" || slide.type === "check") && (
                <div className="flex-1 flex flex-col justify-center items-center">
                   <div className="bg-white border-4 border-black px-12 py-6 rounded-2xl shadow-[10px_10px_0px_rgba(0,0,0,0.2)] mb-12 transform -rotate-1">
                      <h1 className="text-6xl font-black text-black uppercase tracking-tight">{slide.title}</h1>
                   </div>

                   {slide.type === "rules" ? (
                     <div className="grid grid-cols-2 gap-8 w-full max-w-5xl">
                        {slide.rules.map((rule, i) => (
                          <div key={i} className="bg-yellow-100 border-4 border-black p-6 rounded-2xl flex items-center gap-6 shadow-[8px_8px_0px_rgba(0,0,0,1)] hover:-translate-y-2 transition-transform">
                            <div className="bg-pink-400 p-4 rounded-xl border-4 border-black text-white">{rule.icon}</div>
                            <span className="text-3xl font-bold text-black">{rule.text}</span>
                          </div>
                        ))}
                     </div>
                   ) : (
                     <RetroCard color="bg-white" className="p-12 max-w-3xl text-center">
                        <div className="mb-8 flex justify-center text-blue-500">{slide.icon}</div>
                        <p className="text-3xl font-bold text-black whitespace-pre-line leading-relaxed">{slide.content}</p>
                     </RetroCard>
                   )}
                </div>
              )}

              {/* 4. ACTIVITY SLIDE (The Flexible Layout) */}
              {slide.type === "activity" && (
                <div className="flex-1 flex flex-col mt-12">
                  {/* Header */}
                  <div className="flex justify-between items-end mb-8 relative">
                    <div className="bg-white border-4 border-black px-8 py-4 rounded-t-3xl rounded-br-3xl shadow-[8px_8px_0px_rgba(0,0,0,0.3)] z-10 w-2/3">
                      <div className="flex items-center gap-4">
                         <div className="bg-yellow-400 p-2 rounded-lg border-2 border-black">{slide.icon}</div>
                         <div>
                            <h2 className="text-4xl font-black text-black leading-none mb-1">{slide.title}</h2>
                            <p className="text-xl font-bold text-gray-500">{slide.activity}</p>
                         </div>
                      </div>
                    </div>
                    <div className="bg-black text-white px-6 py-3 rounded-xl border-4 border-white transform rotate-3 shadow-lg">
                      <span className="text-2xl font-bold font-mono">{slide.time}</span>
                    </div>
                  </div>

                  {/* Body */}
                  <div className="flex-1 flex gap-8 h-full overflow-hidden pb-4">
                    {/* Steps list */}
                    <div className="w-[35%] flex flex-col gap-4 overflow-y-auto pr-4 custom-scrollbar">
                       {slide.steps.map((step, idx) => (
                         <div key={idx} className="bg-white border-4 border-black p-5 rounded-2xl shadow-[6px_6px_0px_rgba(0,0,0,1)] flex gap-4 items-center group hover:bg-yellow-50 transition-colors">
                           <div className="w-10 h-10 bg-black text-white rounded-lg flex items-center justify-center font-black text-xl border-2 border-white group-hover:bg-yellow-400 group-hover:text-black group-hover:border-black transition-colors">
                             {idx + 1}
                           </div>
                           <p className="text-lg font-bold text-black leading-tight">{step}</p>
                         </div>
                       ))}
                    </div>

                    {/* Visual Guide Area */}
                    <div className="w-[65%] relative">
                      <div className={`absolute inset-0 border-4 border-black rounded-3xl shadow-[12px_12px_0px_rgba(0,0,0,0.4)] overflow-hidden ${slide.guideColor || 'bg-gray-100'} flex items-center justify-center`}>
                         {slide.imageUrl ? (
                           <img src={slide.imageUrl} alt="Visual Guide" className="w-full h-full object-contain" />
                         ) : (
                           <div className="text-center opacity-60">
                             <div className="text-8xl mb-4">🖼️</div>
                             <p className="text-2xl font-black text-black uppercase tracking-widest opacity-50">Visual Guide</p>
                           </div>
                         )}
                         {slide.floatingImage && (
                           <img src={slide.floatingImage} alt="Code Block" className="absolute bottom-4 right-4 w-48 h-auto border-4 border-black rounded-xl shadow-[8px_8px_0px_rgba(0,0,0,0.4)] bg-white" />
                         )}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* 5. DEMO & SHOWCASE */}
              {(slide.type === "demo" || slide.type === "showcase") && (
                <div className="flex-1 flex mt-10 gap-12 items-center">
                   <div className="w-1/3">
                      <h1 className="text-6xl font-black text-white mb-6 text-stroke-black drop-shadow-[5px_5px_0px_#000]">{slide.title}</h1>
                      <RetroCard color="bg-white" rotate="-2deg" className="p-8">
                         <h3 className="text-2xl font-bold text-black mb-4">{slide.subtitle}</h3>
                         <p className="text-xl text-gray-700 leading-relaxed font-medium whitespace-pre-line">{slide.content || slide.description}</p>
                      </RetroCard>
                   </div>
                   <div className="w-2/3 h-full pb-8">
                      <div className="w-full bg-black rounded-3xl p-2 shadow-[12px_12px_0px_rgba(255,255,255,0.3)]" style={{ aspectRatio: '4/3' }}>
                        <iframe
                          src={slide.iframeUrl}
                          width="100%"
                          height="100%"
                          className="rounded-2xl border-none"
                          allowFullScreen
                        ></iframe>
                      </div>
                   </div>
                </div>
              )}

              {/* 6. NEXT LEVEL (Text Boxes Only) */}
              {slide.type === "nextlevel" && (
                <div className="flex-1 flex flex-col justify-center items-center">
                   <div className="bg-white border-4 border-black px-12 py-6 rounded-2xl shadow-[10px_10px_0px_rgba(0,0,0,0.2)] mb-12 transform -rotate-1">
                      <h1 className="text-6xl font-black text-black uppercase tracking-tight">{slide.title}</h1>
                   </div>
                   <RetroCard color="bg-white" className="p-8 max-w-4xl">
                      <h3 className="text-3xl font-bold text-purple-600 mb-6 text-center">{slide.subtitle}</h3>
                      <div className="space-y-4">
                         {slide.items.map((item, i) => (
                           <div key={i} className="bg-gradient-to-r from-yellow-100 to-orange-100 border-4 border-black p-6 rounded-2xl shadow-[6px_6px_0px_rgba(0,0,0,1)] hover:-translate-y-2 transition-transform">
                             <p className="text-2xl font-bold text-black">{item}</p>
                           </div>
                         ))}
                      </div>
                   </RetroCard>
                </div>
              )}

              {/* 7. FEEDBACK (Interactive Emoji Selection) */}
              {slide.type === "feedback" && (
                <div className="flex-1 flex flex-col justify-center items-center">
                   <div className="bg-white border-4 border-black px-12 py-6 rounded-2xl shadow-[10px_10px_0px_rgba(0,0,0,0.2)] mb-8 transform -rotate-1">
                      <h1 className="text-6xl font-black text-black uppercase tracking-tight">{slide.title}</h1>
                   </div>
                   <div className="bg-purple-100 border-4 border-black px-8 py-4 rounded-full shadow-[6px_6px_0px_#000] mb-12">
                      <h2 className="text-3xl font-black text-purple-600">{slide.subtitle}</h2>
                   </div>

                   <div className="flex gap-12 items-center">
                     {slide.emojis.map((emojiData, i) => (
                       <RetroCard 
                         key={i} 
                         color={selectedEmoji === i ? "bg-yellow-200" : "bg-white"} 
                         rotate={i === 1 ? "0deg" : i === 0 ? "-2deg" : "2deg"} 
                         className={`p-8 w-64 text-center transition-all cursor-pointer ${
                           selectedEmoji === i 
                             ? 'scale-110 ring-8 ring-yellow-400 ring-offset-4' 
                             : 'hover:scale-105 opacity-70'
                         }`}
                       >
                         <div className="text-8xl mb-4">{emojiData.emoji}</div>
                         <h3 className="text-3xl font-black text-black">{emojiData.label}</h3>
                       </RetroCard>
                     ))}
                   </div>

                   <div className="mt-12 bg-white border-4 border-black px-6 py-3 rounded-full shadow-[4px_4px_0px_#000]">
                      <p className="text-xl font-bold text-gray-600">Use ← → arrows to select! | ↑ ↓ to navigate slides</p>
                   </div>
                </div>
              )}

              {/* 8. CLOSING / FEEDBACK */}
              {slide.type === "closing" && (
                <div className="flex-1 flex flex-col justify-center items-center text-center">
                  <Star className="absolute top-10 left-20 text-yellow-300 w-32 h-32 animate-spin-slow" color="#FDE047" />
                  <Star className="absolute bottom-10 right-20 text-yellow-300 w-24 h-24 animate-bounce" color="#FDE047" />
                  
                  <h1 className="text-9xl font-black text-white mb-4 drop-shadow-[10px_10px_0px_#000]">{slide.title}</h1>
                  <div className="bg-yellow-400 border-4 border-black px-12 py-4 rounded-full shadow-[8px_8px_0px_#000] mb-12">
                     <h2 className="text-4xl font-black text-black">{slide.subtitle}</h2>
                  </div>

                  <div className="flex gap-8">
                    {slide.messages?.map((msg, i) => (
                      <div key={i} className="bg-white border-4 border-black px-8 py-6 rounded-2xl shadow-[8px_8px_0px_#000] transform hover:scale-110 transition-transform">
                        <p className="text-2xl font-bold text-purple-600">{msg}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </div>

             {/* Navigation Controls */}
              <div className="absolute bottom-8 right-12 flex gap-4 z-50">
                 <button onClick={prevSlide} className={`w-16 h-16 bg-white border-4 border-black rounded-full shadow-[4px_4px_0px_#000] flex items-center justify-center hover:bg-gray-200 active:translate-y-1 active:shadow-[0px_0px_0px_#000] transition-all ${currentSlide === 0 ? 'opacity-50 cursor-not-allowed' : ''}`}>
                    <span className="text-3xl font-black">←</span>
                 </button>
                 <button onClick={nextSlide} className={`w-16 h-16 bg-yellow-400 border-4 border-black rounded-full shadow-[4px_4px_0px_#000] flex items-center justify-center hover:bg-yellow-500 active:translate-y-1 active:shadow-[0px_0px_0px_#000] transition-all ${currentSlide === slides.length - 1 ? 'opacity-50 cursor-not-allowed' : ''}`}>
                    <span className="text-3xl font-black">→</span>
                 </button>
              </div>

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
