<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Aktivitas Kalananti (Slides Edition)</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        .flex { display: flex; }
        .items-center { align-items: center; }
        .gap-3 { gap: 0.75rem; }
        .ml-1 { margin-left: 0.25rem; }
        .ml-2 { margin-left: 0.5rem; }
        .mr-2 { margin-right: 0.5rem; }
        .p-2 { padding: 0.5rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .w-32 { width: 8rem; }
        .rounded { border-radius: 0.25rem; }
        .border { border-width: 1px; border-style: solid; }
        .border-2 { border-width: 2px; border-style: solid; }
        .border-gray-400 { border-color: #9ca3af; }
        .border-gray-500 { border-color: #6b7280; }
        .border-gray-800 { border-color: #1f2937; }
        .border-blue-400 { border-color: #60a5fa; }
        .border-yellow-400 { border-color: #facc15; }
        .border-red-400 { border-color: #f87171; }
        .border-green-500 { border-color: #22c55e; }
        .bg-gray-100 { background: #f3f4f6; }
        .bg-gray-200 { background: #e5e7eb; }
        .bg-blue-100 { background: #dbeafe; }
        .bg-yellow-100 { background: #fef9c3; }
        .bg-red-100 { background: #fee2e2; }
        .bg-green-100 { background: #dcfce7; }
        .hover\:bg-gray-200:hover { background: #e5e7eb; }
        .hover\:bg-gray-300:hover { background: #d1d5db; }
        .hover\:bg-blue-200:hover { background: #bfdbfe; }
        .hover\:bg-yellow-200:hover { background: #fef08a; }
        .hover\:bg-red-200:hover { background: #fecaca; }
        .hover\:bg-green-200:hover { background: #bbf7d0; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .font-bold { font-weight: 700; }
        .italic { font-style: italic; }
        .underline { text-decoration-line: underline; }
        .opacity-60 { opacity: 0.6; }
        .text-gray-500 { color: #6b7280; }
        .text-gray-800 { color: #1f2937; }
        .text-blue-800 { color: #1e40af; }
        .text-yellow-800 { color: #854d0e; }
        .text-red-800 { color: #991b1b; }
        .text-green-800 { color: #166534; }
        .text-kalananti-navy { color: #2A4365; }

        :root {
            --font-display: 'Poppins', sans-serif;
            --font-body: 'Poppins', sans-serif;
            --theme-primary: #2A4365;
            /* Navy */
            --theme-secondary: #F07D49;
            /* Orange */
            --theme-accent: #4CAAE4;
            /* Light Blue */
            --theme-yellow: #F9C846;
        }

        body {
            background-color: #E2E8F0;
            font-family: var(--font-body);
            margin: 0;
            padding-top: 80px;
            padding-bottom: 80px;
        }

        #menu-tools {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999999;
            background: white;
            border-bottom: 4px solid var(--theme-secondary);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* GDocs Style: Container kertas-kertas */
        #editor-canvas {
            width: 19.55cm;
            margin: 0 auto;
            background: transparent;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
        }

        /* Satu lembar kertas A4 */
        .page-sheet {
            width: 19.55cm;
            height: 23.93cm;
            background: white;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.13);
            border-radius: 4px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        /* Area konten dalam kertas */
        .page-content {
            width: 100%;
            height: 100%;
            overflow: hidden;
            box-sizing: border-box;
            padding: 0.8cm 1cm;
            outline: none;
            font-size: 11pt;
        }

        .page-content > * {
            max-width: 100%;
            box-sizing: border-box;
        }

        .page-content img,
        .page-content svg,
        .page-content canvas,
        .page-content table {
            max-width: 100%;
        }

        .page-content ul:not(.list-objective),
        .page-content ol {
            margin: 8px 0 8px 24px;
            padding-left: 18px;
        }

        .page-content ul:not(.list-objective) {
            list-style: disc;
        }

        .page-content ol {
            list-style: decimal;
        }

        .page-content ul:not(.list-objective) li,
        .page-content ol li {
            margin: 4px 0;
        }

        /* Watermark nomor halaman di pojok kanan bawah */
        .page-num {
            position: absolute;
            bottom: 10px;
            right: 16px;
            font-family: var(--font-display);
            font-size: 9pt;
            font-weight: 800;
            color: rgba(42, 67, 101, 0.25);
            pointer-events: none;
            user-select: none;
        }

        .syntax-block {
            background: #EEF2F7;
            border: 1.5px solid #CBD5E1;
            border-radius: 8px;
            color: #1E293B;
            display: block;
            font-family: "Courier New", Courier, monospace;
            font-size: 9.2pt;
            font-weight: 700;
            line-height: 1.35;
            margin: 8px 0;
            overflow-wrap: anywhere;
            padding: 10px 12px;
            white-space: pre-wrap;
        }

        .syntax-block code {
            font-family: inherit;
        }

        /* Gambar dengan resize handle */
        .shot-card,
        .inline-image {
            display: block;
            width: fit-content;
            max-width: 100%;
            max-height: 750px;
            margin: 16px auto;
            padding: 10px;
            background-color: white;
            border: 3px solid var(--theme-accent);
            border-radius: 12px;
            box-shadow: 5px 5px 0 var(--theme-secondary);
            resize: both;
            overflow: hidden;
            min-width: 80px;
            min-height: 60px;
            cursor: se-resize;
        }

        .shot-card img,
        .inline-image img,
        .todo-group-image-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            max-width: 100%;
            min-width: 0;
        }

        .todo-group-image-item {
            display: block;
            width: fit-content;
            margin: 12px auto;
            padding: 6px;
            border: 2px solid var(--theme-accent);
            border-radius: 8px;
            background: white;
            max-width: 100%;
            max-height: 750px;
            resize: both;
            overflow: hidden;
            min-width: 60px;
            min-height: 50px;
            cursor: se-resize;
            position: relative;
        }

        .todo-group,
        .todo-group-body,
        .todo-group-images {
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .todo-group.has-images .check-row {
            margin-bottom: 10px;
        }

        .todo-group-images {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            margin: 12px 0;
            width: 100%;
        }

        .todo-group-images .todo-group-image-item,
        .todo-group-images .shot-card {
            margin: 0;
        }

        /* Top-Right Resize Handle */
        .resize-handle-tr {
            position: absolute;
            top: 0;
            right: 0;
            width: 28px;
            height: 28px;
            background-color: var(--theme-secondary);
            border-bottom-left-radius: 12px;
            cursor: ew-resize;
            z-index: 20;
            opacity: 0.2;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .resize-handle-tr::after {
            content: "⤢";
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .shot-card:hover .resize-handle-tr,
        .inline-image:hover .resize-handle-tr,
        .todo-group-image-item:hover .resize-handle-tr {
            opacity: 0.9;
        }

        /* -------- KOMPONEN DESAIN HYBRID -------- */
        /* Komponen-komponen ini akan di-screenshot sebagai gambar halaman saat export */

        .think-bubble {
            background-color: #F8FAFC;
            border: 3px solid var(--theme-primary);
            border-radius: 16px;
            padding: 34px 24px 22px 24px;
            position: relative;
            margin: 32px 0 20px 0;
            z-index: 1;
            /* Use box-shadow instead of pseudo-elements for screenshot compatibility */
            box-shadow: 6px 6px 0 var(--theme-accent);
        }

        .think-title {
            position: absolute;
            top: -18px;
            left: 20px;
            font-family: var(--font-display);
            font-size: 10pt;
            font-weight: 800;
            background: var(--theme-secondary);
            color: white;
            padding: 6px 20px;
            border-radius: 8px;
            box-shadow: 4px 4px 0 var(--theme-primary);
            transform: rotate(-2deg);
            z-index: 10;
        }

        .bubble-content {
            font-size: 11pt;
            line-height: 1.7;
            font-weight: 500;
        }

        .bubble-content .list-objective,
        .bubble-content p {
            margin-bottom: 0;
        }

        .knowledge-bubble.warm {
            border-color: var(--theme-secondary);
            box-shadow: 6px 6px 0 var(--theme-yellow);
        }

        .knowledge-bubble.warm .think-title {
            background: var(--theme-primary);
            box-shadow: 4px 4px 0 var(--theme-secondary);
        }

        .activity-card {
            background-color: white;
            padding: 34px 20px 16px 20px;
            border: 4px solid var(--theme-primary);
            border-radius: 12px;
            position: relative;
            margin: 35px 0 20px 0;
            z-index: 1;
            box-shadow: 8px 8px 0 var(--theme-yellow);
        }

        .activity-label,
        .challenge-label {
            position: absolute;
            top: -20px;
            left: -5px;
            background-color: var(--theme-yellow);
            color: var(--theme-primary);
            font-family: var(--font-display);
            font-weight: 800;
            padding: 6px 20px;
            border-radius: 8px;
            border: 3px solid var(--theme-primary);
            box-shadow: 4px 4px 0 var(--theme-primary);
            transform: rotate(-3deg);
            z-index: 10;
        }

        .challenge-card {
            background-color: #FFFDF5;
            border: 4px solid var(--theme-secondary);
            border-radius: 12px;
            padding: 34px 20px 16px 20px;
            position: relative;
            margin: 35px 0 20px 0;
            z-index: 1;
            box-shadow: 8px 8px 0 var(--theme-accent);
        }

        .challenge-label {
            background-color: var(--theme-accent);
            color: white;
            border-color: var(--theme-secondary);
            box-shadow: -4px 4px 0 var(--theme-secondary);
            left: auto;
            right: -5px;
            transform: rotate(3deg);
        }

        .step-card {
            background-color: #F8FCFF;
            color: #1E293B;
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 22px 16px 14px 16px;
            margin: 30px 0 15px 0;
            border-radius: 14px;
            position: relative;
            /* Solid border keeps screenshot output stable across renderers */
            border: 4px solid var(--theme-accent);
            box-shadow: 6px 6px 0 #D9EEF9;
            z-index: 1;
        }

        .step-title {
            margin: 0;
            font-size: 16px;
            line-height: 1.25;
            max-width: 100%;
        }

        .step-badge {
            position: absolute;
            top: -20px;
            left: 15px;
            background-color: var(--theme-primary);
            color: white;
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 800;
            padding: 5px 16px;
            border-radius: 10px;
            transform: rotate(2deg);
            z-index: 10;
        }

        .step-card h1,
        .step-card h2,
        .step-card h3,
        .step-card h4,
        .step-card p,
        .step-card div:not(.step-badge),
        .step-card span:not(.step-badge) {
            color: #1E293B;
        }

        .quiz-stack {
            margin: 25px 0;
        }

        .quiz-item {
            background-color: white;
            padding: 20px 18px 14px 18px;
            border: 3px solid var(--theme-primary);
            border-radius: 12px;
            position: relative;
            margin-bottom: 15px;
            z-index: 1;
            box-shadow: 6px 6px 0 var(--theme-secondary);
        }

        .shot-card {
            background-color: white;
            padding: 12px;
            border: 3px solid var(--theme-accent);
            border-radius: 12px;
            margin: 20px auto;
            box-shadow: 5px 5px 0 var(--theme-secondary);
            width: fit-content;
            position: relative;
        }

        .inline-image {
            display: block;
            width: fit-content;
            margin: 15px auto;
            padding: 12px;
            background-color: white;
            border: 3px solid var(--theme-accent);
            border-radius: 12px;
            box-shadow: 5px 5px 0 var(--theme-secondary);
            position: relative;
        }

        /* Typography & Content Layout */
        .text-reading {
            font-size: 11pt;
            color: #1E293B;
            line-height: 1.7;
            margin: 10px 0;
            font-weight: 500;
        }

        .lead-check-text {
            font-size: 11pt;
            color: #1E293B;
            line-height: 1.7;
            font-weight: 600;
        }

        .list-objective {
            list-style: none;
            padding-left: 0;
            margin-top: 10px;
        }

        .list-objective>li {
            font-size: 11pt;
            margin-bottom: 8px;
            font-weight: 600;
            padding-left: 20px;
            position: relative;
            color: #1E293B;
        }

        .list-objective>li::before {
            content: "✦";
            color: var(--theme-secondary);
            position: absolute;
            left: 0;
            font-weight: 900;
        }

        /* Checkbox lists */
        .check-row {
            width: 100%;
            margin-bottom: 8px;
            border-collapse: collapse;
        }

        .check-cell {
            width: 24px;
            vertical-align: top;
            padding-top: 2px;
        }

        .check-box {
            width: 16px;
            height: 16px;
            border: 2px solid var(--theme-primary);
            border-radius: 4px;
            box-shadow: 2px 2px 0 var(--theme-accent);
            background: white;
        }

        .check-content {
            vertical-align: top;
            font-size: 10.5pt;
            font-weight: 600;
            color: #333;
            line-height: 1.5;
        }

        /* Quiz elements */
        .quiz-question {
            display: flex;
            font-size: 10pt;
            font-weight: 800;
            color: #1F2937;
            margin-bottom: 10px;
        }

        .quiz-number {
            color: var(--theme-primary);
            min-width: 15px;
        }

        .quiz-options {
            margin-left: 15px;
        }

        .quiz-option {
            display: flex;
            font-size: 9.5pt;
            font-weight: 700;
            color: #374151;
            margin-bottom: 6px;
            align-items: center;
        }

        .quiz-option-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--theme-accent);
            color: white;
            font-size: 8pt;
            font-weight: 900;
            margin-right: 8px;
        }

        /* ===== SESSION HEADER (REDESIGNED) ===== */
        .session-divider {
            margin-top: 40px;
            margin-bottom: 24px;
        }

        /* Outer frame - navy bg + orange bottom shadow */
        .scd-hero {
            background: var(--theme-primary);
            border-radius: 18px;
            box-shadow: 0 8px 0 var(--theme-secondary);
            padding: 0;
            overflow: hidden;
            position: relative;
        }

        /* Top rainbow stripe (seperti di template Slides) */
        .scd-stripe {
            height: 8px;
            background: linear-gradient(90deg, #F07D49 0%, #F9C846 35%, #4CAAE4 70%, #2A4365 100%);
        }

        /* Main content area inside hero */
        .scd-body {
            padding: 20px 28px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .scd-body-left {
            flex: 1;
        }

        /* Badge pill kecil di atas */
        .scd-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(240, 125, 73, 0.18);
            border: 2px solid var(--theme-secondary);
            color: var(--theme-yellow);
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 10pt;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 14px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .scd-pill-dot {
            width: 7px;
            height: 7px;
            background: var(--theme-secondary);
            border-radius: 50%;
            display: inline-block;
        }

        /* Judul kelas besar */
        .scd-course-title {
            font-family: var(--font-display);
            font-weight: 900;
            font-size:22pt;
            color: white;
            margin: 0 0 8px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        /* Baris topik */
        .scd-topic-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .scd-topic-label {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 9pt;
            color: var(--theme-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scd-topic {
            font-family: var(--font-display);
            font-weight: 800;
            font-size:12pt;
            color: white;
        }

        /* Logo area di kanan */
        .scd-icons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .scd-icon-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
        }

        .scd-icon-img.small {
            width: 44px;
            height: 44px;
        }

        .btn-primary {
            background: var(--theme-primary);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .btn-primary:hover {
            background: #1a2a40;
        }

        .btn-secondary {
            background: var(--theme-secondary);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .btn-secondary:hover {
            background: #d06334;
        }
    </style>
</head>

<body>
    <div id="menu-tools">
        <div>
            <select id="course-select" class="border-2 border-gray-800 rounded p-2 mr-2 font-bold text-kalananti-navy">
                <option value="roblox">Roblox Studio</option>
                <option value="scratch">Scratch</option>
                <option value="python">Python</option>
            </select>
            <select id="level-input" class="border-2 border-gray-800 rounded p-2 w-32 font-bold text-kalananti-navy">
                <option value="1">Level 1</option>
                <option value="2">Level 2</option>
                <option value="3">Level 3</option>
                <option value="4">Level 4</option>
            </select>
            <button onclick="fetchBook()" class="btn-primary ml-2">Muat Konten</button>
        </div>
        <div class="flex gap-3 items-center">
            <span id="save-status" class="text-sm font-bold text-gray-500 mr-2">Status: Menunggu</span>
            <select id="style-select" onchange="applyBlockFormat(this.value); this.value='';"
                class="bg-gray-100 px-2 py-1 rounded font-bold border border-gray-400 text-sm">
                <option value="">Style</option>
                <option value="P">Normal</option>
                <option value="H2">Judul Besar</option>
                <option value="H3">Judul</option>
                <option value="H4">Subjudul</option>
            </select>
            <select id="font-size-select" onchange="applyFontSize(this.value); this.value='';"
                class="bg-gray-100 px-2 py-1 rounded font-bold border border-gray-400 text-sm">
                <option value="">Size</option>
                <option value="9pt">9</option>
                <option value="10pt">10</option>
                <option value="11pt">11</option>
                <option value="12pt">12</option>
                <option value="14pt">14</option>
                <option value="18pt">18</option>
                <option value="24pt">24</option>
            </select>
            <button onclick="applyCommand('bold')"
                class="bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded font-bold border border-gray-400">B</button>
            <button onclick="applyCommand('italic')"
                class="bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded italic border border-gray-400">I</button>
            <button onclick="applyCommand('underline')"
                class="bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded underline border border-gray-400">U</button>
            <button onclick="applyCommand('insertUnorderedList')" title="Bullet list"
                class="bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded font-bold border border-gray-400">•</button>
            <button onclick="applyCommand('insertOrderedList')" title="Numbered list"
                class="bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded font-bold border border-gray-400">1.</button>
            <button onclick="applyCommand('outdent')" title="Kurangi indent"
                class="bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded font-bold border border-gray-400">‹</button>
            <button onclick="applyCommand('indent')" title="Tambah indent"
                class="bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded font-bold border border-gray-400">›</button>
            <button onclick="applyCommand('justifyLeft')" title="Rata kiri"
                class="bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded font-bold border border-gray-400">L</button>
            <button onclick="applyCommand('justifyCenter')" title="Rata tengah"
                class="bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded font-bold border border-gray-400">C</button>
            <button onclick="applyCommand('justifyRight')" title="Rata kanan"
                class="bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded font-bold border border-gray-400">R</button>
            <button onclick="manualRepaginate()"
                class="bg-blue-100 hover:bg-blue-200 px-3 py-1 rounded font-bold border border-blue-400 text-blue-800 ml-2">⟳
                Susun Ulang</button>
            <button id="btn-undo" onclick="undoLast()"
                class="bg-yellow-100 hover:bg-yellow-200 px-3 py-1 rounded font-bold border border-yellow-400 text-yellow-800 ml-1"
                disabled title="Ctrl+Z">↩ Undo <span id="undo-count" class="text-xs opacity-60"></span></button>
            <button onclick="resetToDefault()"
                class="bg-red-100 hover:bg-red-200 px-3 py-1 rounded font-bold border border-red-400 text-red-800 ml-1">🗑️
                Reset ke Awal</button>
            <button onclick="saveDraftNow()"
                class="bg-green-100 hover:bg-green-200 px-3 py-1 rounded font-bold border border-green-500 text-green-800 ml-1">Save Draft</button>
            <button onclick="openLatestDraft()"
                class="bg-green-100 hover:bg-green-200 px-3 py-1 rounded font-bold border border-green-500 text-green-800 ml-1">Open Last</button>
            <a href="/saved" target="_blank"
                class="bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded font-bold border border-gray-500 text-gray-800 ml-1">Saved</a>
            <button onclick="exportToSlides()" class="btn-secondary ml-2">🚀 Export to Slides</button>
        </div>
    </div>

    <div id="editor-canvas">
        <div class="page-sheet" id="page-1">
            <div class="page-content">
                <div style="text-align:center;color:#aaa;padding-top:60px;font-family:var(--font-display);font-weight:700;font-size:13pt;"
                    contenteditable="false">
                    Pilih Course &amp; Level, lalu klik <strong>"Muat Konten"</strong>.<br>
                    <span style="font-size: 10pt;font-weight:500;">Tiap kotak putih = 1 halaman Slides (19.55 &times;
                        23.93 cm).</span>
                </div>
            </div>
            <div class="page-num">1</div>
        </div>
    </div>

    <script>
        const editorCanvas = document.getElementById('editor-canvas');
        const saveStatus = document.getElementById('save-status');
        let saveTimeout;
        let draftSaveTimeout;
        let currentLoadedParams = "";
        let _availableLevelsByCourse = {};
        let _lastDraftSignature = "";
        let _savedSelectionRange = null;
        let _lastEditorSelectionAt = 0;

        function isEditorNode(node) {
            if (!node) return false;
            const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
            return Boolean(el && el.closest && el.closest('.page-content'));
        }

        function saveCurrentSelection() {
            const selection = window.getSelection();
            if (!selection || selection.rangeCount === 0) return false;
            const range = selection.getRangeAt(0);
            if (!isEditorNode(range.commonAncestorContainer)) return false;
            _savedSelectionRange = range.cloneRange();
            _lastEditorSelectionAt = Date.now();
            return true;
        }

        function hasLiveEditorSelection() {
            const selection = window.getSelection();
            if (!selection || selection.rangeCount === 0) return false;
            return isEditorNode(selection.getRangeAt(0).commonAncestorContainer);
        }

        function restoreEditorSelection() {
            const selection = window.getSelection();
            if (!selection) return false;
            if (!_savedSelectionRange || !document.body.contains(_savedSelectionRange.commonAncestorContainer)) {
                return false;
            }
            const focusEl = _savedSelectionRange.commonAncestorContainer.nodeType === Node.ELEMENT_NODE
                ? _savedSelectionRange.commonAncestorContainer
                : _savedSelectionRange.commonAncestorContainer.parentElement;
            const page = focusEl && focusEl.closest ? focusEl.closest('.page-content') : null;
            if (page) page.focus({ preventScroll: true });

            selection.removeAllRanges();
            selection.addRange(_savedSelectionRange);
            return true;
        }

        function prepareEditorSelection() {
            if (hasLiveEditorSelection()) {
                saveCurrentSelection();
                return true;
            }
            return restoreEditorSelection();
        }

        function getPreparedRange() {
            if (hasLiveEditorSelection()) {
                saveCurrentSelection();
                return window.getSelection().getRangeAt(0);
            }
            if (!restoreEditorSelection()) return null;
            const selection = window.getSelection();
            if (selection && selection.rangeCount > 0 && !selection.isCollapsed) {
                return selection.getRangeAt(0);
            }
            if (_savedSelectionRange && !_savedSelectionRange.collapsed) {
                return _savedSelectionRange;
            }
            return null;
        }

        function applyCommand(command, value = null) {
            if (!prepareEditorSelection()) {
                saveStatus.textContent = 'Pilih teks dulu di editor';
                return;
            }
            const didRun = document.execCommand(command, false, value);
            saveCurrentSelection();
            if (didRun) onEdit();
        }

        const EDITOR_BLOCK_TAGS = new Set(['P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'LI']);
        const EXPORT_IMAGE_SCALE = 3;

        function closestEditableBlock(node) {
            const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
            if (!el) return null;
            return el.closest('p,h1,h2,h3,h4,h5,h6,li');
        }

        function replaceBlockTag(block, tagName) {
            if (!block || block.tagName === tagName) return block;
            const replacement = document.createElement(tagName.toLowerCase());

            [...block.attributes].forEach(attr => {
                replacement.setAttribute(attr.name, attr.value);
            });

            if (tagName === 'P') {
                replacement.classList.remove('text-2xl', 'text-xl', 'text-5xl');
                replacement.style.fontSize = '';
                replacement.style.fontWeight = '';
                replacement.style.lineHeight = '';
            }

            while (block.firstChild) {
                replacement.appendChild(block.firstChild);
            }
            if (tagName === 'P') {
                replacement.querySelectorAll('span[style*="font-size"]').forEach(child => {
                    child.style.fontSize = '';
                    if (!child.getAttribute('style')) child.replaceWith(...child.childNodes);
                });
            }
            block.replaceWith(replacement);
            return replacement;
        }

        function applyManualBlockFormat(range, tagName) {
            const startBlock = closestEditableBlock(range.startContainer);
            const endBlock = closestEditableBlock(range.endContainer);
            if (!startBlock || !isEditorNode(startBlock)) return false;

            const page = startBlock.closest('.page-content');
            const allBlocks = [...page.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li')];
            const startIndex = allBlocks.indexOf(startBlock);
            const endIndex = endBlock ? allBlocks.indexOf(endBlock) : startIndex;
            if (startIndex < 0) return false;

            const from = Math.min(startIndex, endIndex >= 0 ? endIndex : startIndex);
            const to = Math.max(startIndex, endIndex >= 0 ? endIndex : startIndex);
            const changedBlocks = allBlocks
                .slice(from, to + 1)
                .filter(block => isEditorNode(block) && EDITOR_BLOCK_TAGS.has(block.tagName))
                .map(block => replaceBlockTag(block, tagName));

            if (changedBlocks.length === 0) return false;

            const selection = window.getSelection();
            selection.removeAllRanges();
            const newRange = document.createRange();
            newRange.selectNodeContents(changedBlocks[0]);
            selection.addRange(newRange);
            saveCurrentSelection();
            return true;
        }

        function applyBlockFormat(tagName) {
            if (!tagName) return;
            const range = getPreparedRange();
            if (!range) {
                saveStatus.textContent = 'Pilih teks dulu di editor';
                return;
            }
            if (applyManualBlockFormat(range, tagName)) {
                onEdit();
                return;
            }
            const didRun = document.execCommand('formatBlock', false, `<${tagName}>`) || document.execCommand('formatBlock', false, tagName);
            saveCurrentSelection();
            if (didRun) onEdit();
        }

        function collapseRedundantFontSizeWrapper(span) {
            let current = span;
            while (
                current.parentElement &&
                current.parentElement.tagName === 'SPAN' &&
                current.parentElement.style.fontSize &&
                current.parentElement.childNodes.length === 1
            ) {
                const parent = current.parentElement;
                parent.replaceWith(current);
            }
            return current;
        }

        function applyFontSize(size) {
            if (!size) return;
            const range = getPreparedRange();
            if (!range) {
                saveStatus.textContent = 'Pilih teks dulu di editor';
                return;
            }
            const selectedText = String(window.getSelection()).trim();
            const block = closestEditableBlock(range.commonAncestorContainer);
            if (block && selectedText && block.textContent.trim() === selectedText) {
                block.querySelectorAll('span[style*="font-size"]').forEach(child => {
                    child.style.fontSize = '';
                    if (!child.getAttribute('style')) child.replaceWith(...child.childNodes);
                });
                block.style.fontSize = size;
                saveCurrentSelection();
                onEdit();
                return;
            }
            const span = document.createElement('span');
            span.style.fontSize = size;
            span.appendChild(range.extractContents());
            range.insertNode(span);
            const finalSpan = collapseRedundantFontSizeWrapper(span);
            const selection = window.getSelection();
            selection.removeAllRanges();
            const newRange = document.createRange();
            newRange.selectNodeContents(finalSpan);
            selection.addRange(newRange);
            saveCurrentSelection();
            onEdit();
        }

        editorCanvas.addEventListener('mouseup', saveCurrentSelection);
        editorCanvas.addEventListener('keyup', saveCurrentSelection);
        editorCanvas.addEventListener('input', saveCurrentSelection);
        document.addEventListener('selectionchange', () => {
            if (hasLiveEditorSelection()) saveCurrentSelection();
        });

        document.getElementById('menu-tools').addEventListener('pointerdown', () => {
            saveCurrentSelection();
        }, true);

        document.getElementById('menu-tools').addEventListener('mousedown', (e) => {
            saveCurrentSelection();
            if (e.target.closest('select')) {
                return;
            }
            if (e.target.closest('button')) {
                e.preventDefault();
            }
        });

        // --- UNDO SYSTEM ---
        const UNDO_MAX = 30;
        let _undoStack = [];

        function pushUndoSnapshot() {
            const els = editorCanvas.querySelectorAll('.page-content > *');
            if (els.length === 0) return;
            const snapshot = [...els].map(el => el.outerHTML).join('<!--ELBREAK-->');
            // Jangan push kalau sama persis dengan snapshot terakhir
            if (_undoStack.length > 0 && _undoStack[_undoStack.length - 1] === snapshot) return;
            _undoStack.push(snapshot);
            if (_undoStack.length > UNDO_MAX) _undoStack.shift();
            updateUndoButton();
        }

        function undoLast() {
            if (_undoStack.length === 0) return;
            const snapshot = _undoStack.pop();
            updateUndoButton();

            _isRepaginating = true;
            const anchor = findScrollAnchor();

            // Rebuild elements dari snapshot
            const chunks = snapshot.split('<!--ELBREAK-->');
            const flatElements = [];
            chunks.forEach(html => {
                if (!html.trim()) return;
                const wrapper = document.createElement('div');
                wrapper.innerHTML = html.trim();
                const child = wrapper.firstElementChild;
                if (child) flatElements.push(child);
            });

            if (flatElements.length === 0) { _isRepaginating = false; return; }
            repaginate(flatElements);
            requestAnimationFrame(() => {
                attachResizeObservers();
                restoreScrollAnchor(anchor);
                _isRepaginating = false;
                saveToLocal();
            });
            saveStatus.textContent = '↩ Undo berhasil';
        }

        function updateUndoButton() {
            const btn = document.getElementById('btn-undo');
            const count = document.getElementById('undo-count');
            btn.disabled = _undoStack.length === 0;
            count.textContent = _undoStack.length > 0 ? `(${_undoStack.length})` : '';
        }

        // Ctrl+Z shortcut
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
                e.preventDefault();
                undoLast();
            }
        });

        // Helper: ukur tinggi halaman dalam px
        function getPageHeightPx() {
            // Gunakan angka tetap jika deteksi probe gagal (A4 pada 96 DPI ~ 904px)
            const CM_TO_PX = 37.795;
            return 23.93 * CM_TO_PX;
        }

        // Buat satu lembar halaman baru
        function createPageSheet(num) {
            const sheet = document.createElement('div');
            sheet.className = 'page-sheet';
            sheet.id = `page-${num}`;
            const content = document.createElement('div');
            content.className = 'page-content';
            content.contentEditable = 'true';
            content.addEventListener('input', onEdit);
            sheet.appendChild(content);
            const pageNum = document.createElement('div');
            pageNum.className = 'page-num';
            pageNum.textContent = num;
            sheet.appendChild(pageNum);
            return { sheet, content };
        }

        // Kelas yang HARUS tetap satu blok (tidak boleh di-split)
        const ATOMIC_CLASSES = [
            'session-divider', 'activity-card', 'challenge-card',
            'step-card', 'think-bubble', 'knowledge-bubble',
            'quiz-item', 'quiz-stack', 'quiz-wrapper',
            'shot-card', 'inline-image', 'todo-group',
            'cover-page', 'blank-page', 'copyright-page', 'ownership-notice-page', 'book-guide-page', 'toc-page', 'back-cover-page',
            'step-headpack', 'check-row', 'lead-check-text'
        ];

        // Cek apakah element harus tetap utuh (atomic)
        function isAtomic(el) {
            if (!el.classList) return true;
            // Element kecil tanpa children = atomic
            if (el.children.length === 0) return true;
            // Cek class list
            for (const cls of ATOMIC_CLASSES) {
                if (el.classList.contains(cls)) return true;
            }
            // Hanya DIV yang boleh di-flatten (P, H1-H6, SPAN, dll TIDAK boleh)
            if (el.tagName !== 'DIV') return true;
            // DIV dengan text nodes langsung = atomic (mixed content, text bisa hilang)
            for (const node of el.childNodes) {
                if (node.nodeType === Node.TEXT_NODE && node.textContent.trim().length > 0) {
                    return true;
                }
            }
            return false;
        }

        // Flatten compound containers menjadi elemen-elemen kecil yg bisa mengalir antar halaman
        function deepFlatten(elements) {
            const result = [];
            for (const el of elements) {
                if (isAtomic(el)) {
                    result.push(el);
                } else {
                    // Unwrap: ambil children-nya sebagai elemen independen
                    const children = [...el.children];
                    if (children.length === 0) {
                        result.push(el);
                    } else {
                        // Recursively flatten children juga
                        for (const child of children) {
                            if (isAtomic(child)) {
                                result.push(child);
                            } else {
                                result.push(...deepFlatten([child]));
                            }
                        }
                    }
                }
            }
            return result;
        }

        function createMeasurePage() {
            const sheet = document.createElement('div');
            sheet.className = 'page-sheet';
            sheet.style.position = 'absolute';
            sheet.style.left = '-99999px';
            sheet.style.top = '0';
            sheet.style.visibility = 'hidden';
            sheet.style.pointerEvents = 'none';
            sheet.style.zIndex = '-1';

            const content = document.createElement('div');
            content.className = 'page-content';
            sheet.appendChild(content);
            document.body.appendChild(sheet);

            return { sheet, content };
        }

        function measureElementHeight(el, measureContent) {
            measureContent.innerHTML = '';
            const clone = el.cloneNode(true);
            measureContent.appendChild(clone);
            return Math.ceil(clone.getBoundingClientRect().height);
        }

        function clearAutoFitScale(el) {
            if (!(el instanceof HTMLElement)) return;
            if (el.dataset && el.dataset.autoFitScale) {
                delete el.dataset.autoFitScale;
            }
            if (el.dataset && el.dataset.autoFitOverflow === 'true') {
                delete el.dataset.autoFitOverflow;
            }
            el.style.zoom = '';
        }

        function fitOversizedElementToPage(el, content) {
            if (!(el instanceof HTMLElement) || !content) return false;

            clearAutoFitScale(el);
            el.style.maxWidth = '100%';
            el.style.boxSizing = 'border-box';

            const contentWidth = Math.max(content.clientWidth - 2, 1);
            const contentHeight = Math.max(content.clientHeight - 2, 1);
            const rect = el.getBoundingClientRect();
            const elementWidth = Math.max(el.scrollWidth, rect.width, 1);
            const elementHeight = Math.max(el.scrollHeight, rect.height, 1);
            const scale = Math.min(contentWidth / elementWidth, contentHeight / elementHeight, 1);

            if (scale >= 0.995) {
                return false;
            }

            const fitScale = Math.max(scale * 0.985, 0.35);
            el.style.zoom = fitScale.toFixed(3);
            el.dataset.autoFitScale = fitScale.toFixed(3);
            return true;
        }

        function fitSinglePageElementIfNeeded(content) {
            if (!content || content.children.length !== 1) return false;
            const el = content.children[0];
            const overflowsHeight = content.scrollHeight > content.clientHeight;
            const overflowsWidth = el instanceof HTMLElement && el.scrollWidth > content.clientWidth;

            if (!overflowsHeight && !overflowsWidth) {
                clearAutoFitScale(el);
                return false;
            }

            const fitted = fitOversizedElementToPage(el, content);
            if (content.scrollHeight > content.clientHeight || (el instanceof HTMLElement && el.scrollWidth > content.clientWidth)) {
                el.dataset.autoFitOverflow = 'true';
            }
            return fitted;
        }

        function singlePageElementVisuallyOverflows(content) {
            if (!content || content.children.length !== 1) return false;
            const el = content.children[0];
            if (!(el instanceof HTMLElement)) return false;

            const contentRect = content.getBoundingClientRect();
            const elRect = el.getBoundingClientRect();
            const tolerance = 2;

            return (
                elRect.bottom > contentRect.bottom + tolerance ||
                elRect.right > contentRect.right + tolerance ||
                elRect.top < contentRect.top - tolerance ||
                elRect.left < contentRect.left - tolerance
            );
        }

        function getBubbleContentLineUnits(contentEl) {
            const units = [];
            let currentNodes = [];

            function pushCurrent() {
                if (!currentNodes.length) return;
                const wrapper = document.createElement('div');
                currentNodes.forEach(node => wrapper.appendChild(node));
                const html = wrapper.innerHTML.trim();
                if (html) units.push(html);
                currentNodes = [];
            }

            [...contentEl.childNodes].forEach(node => {
                const isBreak = node.nodeType === Node.ELEMENT_NODE && node.tagName === 'BR';
                const isInlineImage = node.nodeType === Node.ELEMENT_NODE && node.classList.contains('inline-image');
                const isBlockNode = node.nodeType === Node.ELEMENT_NODE && ['P', 'UL', 'OL', 'TABLE', 'DIV'].includes(node.tagName);

                if (isInlineImage || isBlockNode) {
                    pushCurrent();
                    const wrapper = document.createElement('div');
                    wrapper.appendChild(node.cloneNode(true));
                    units.push(wrapper.innerHTML.trim());
                    return;
                }

                currentNodes.push(node.cloneNode(true));

                if (isBreak) {
                    pushCurrent();
                }
            });

            pushCurrent();
            return units;
        }

        function getBubbleNumberedSectionUnits(contentEl) {
            const html = (contentEl.innerHTML || '').trim();
            if (!html) return [];

            const markerRegex = /<strong>\s*\d+[\)\.\:]\s*<\/strong>/gi;
            const matches = [...html.matchAll(markerRegex)];
            if (matches.length < 2) return [];

            const sections = [];
            const prefix = html.slice(0, matches[0].index).trim();

            for (let i = 0; i < matches.length; i++) {
                const start = matches[i].index;
                const end = i + 1 < matches.length ? matches[i + 1].index : html.length;
                let sectionHtml = html.slice(start, end).trim();
                if (i === 0 && prefix) {
                    sectionHtml = `${prefix}${sectionHtml}`;
                }
                if (sectionHtml) sections.push(sectionHtml);
            }

            return sections;
        }

        function getBubbleContentUnits(contentEl) {
            const numberedSections = getBubbleNumberedSectionUnits(contentEl);
            if (numberedSections.length > 0) {
                return numberedSections;
            }

            const lineUnits = getBubbleContentLineUnits(contentEl);
            if (lineUnits.length <= 1) return lineUnits;

            const sectionUnits = [];
            let currentSection = [];

            function pushSection() {
                if (!currentSection.length) return;
                const html = currentSection.join('').trim();
                if (html) sectionUnits.push(html);
                currentSection = [];
            }

            lineUnits.forEach(unitHtml => {
                const probe = document.createElement('div');
                probe.innerHTML = unitHtml;
                const text = (probe.textContent || '').replace(/\u00a0/g, ' ').trim();
                const hasMedia = Boolean(probe.querySelector('.inline-image, img'));
                const startsNumberedItem = /^\d+[\).\:]/.test(text);

                if (startsNumberedItem && currentSection.length) {
                    pushSection();
                }

                currentSection.push(unitHtml);

                // Jika ada media di unit ini, tetap tempel di section yang sama
                // agar gambar/kode tidak gampang "terlepas" ke halaman lain.
                if (!text && !hasMedia) {
                    return;
                }
            });

            pushSection();
            return sectionUnits.length > 1 ? sectionUnits : lineUnits;
        }

        function cloneKnowledgeBubble(el, contentHtml, isContinuation) {
            const clone = el.cloneNode(true);
            const content = clone.querySelector('.bubble-content');
            const title = clone.querySelector('.think-title');
            if (content) content.innerHTML = contentHtml;
            if (title) {
                const baseTitle = title.textContent.replace(/\s+\(Lanjutan\)$/i, '');
                title.textContent = isContinuation ? `${baseTitle} (Lanjutan)` : baseTitle;
            }
            return clone;
        }

        function buildKnowledgeBubbleChunkUnitGroups(el, maxHeight, measureContent) {
            const contentEl = el.querySelector('.bubble-content');
            if (!contentEl) return [[]];

            const units = getBubbleContentUnits(contentEl);
            if (units.length <= 1) return [units];

            const chunkUnits = [];
            let cursor = 0;

            while (cursor < units.length) {
                let currentUnits = [];
                let fittedCount = 0;

                for (let i = cursor; i < units.length; i++) {
                    const candidateUnits = currentUnits.concat(units[i]);
                    const candidateBubble = cloneKnowledgeBubble(el, candidateUnits.join(''), chunkUnits.length > 0);
                    const candidateHeight = measureElementHeight(candidateBubble, measureContent);

                    if (candidateHeight <= maxHeight || fittedCount === 0) {
                        currentUnits = candidateUnits;
                        fittedCount++;
                    } else {
                        break;
                    }
                }

                chunkUnits.push(currentUnits);
                cursor += fittedCount;
            }

            return chunkUnits;
        }

        function rebalanceKnowledgeBubbleChunkUnits(el, chunkUnits, maxHeight, measureContent) {
            if (chunkUnits.length < 2) return chunkUnits;

            const minFillRatio = 0.45;
            const balanced = chunkUnits.map(group => group.slice());

            function chunkHeight(units, continuation) {
                const bubble = cloneKnowledgeBubble(el, units.join(''), continuation);
                return measureElementHeight(bubble, measureContent);
            }

            for (let i = 0; i < balanced.length - 1; i++) {
                let current = balanced[i];
                let next = balanced[i + 1];
                let nextHeight = chunkHeight(next, true);

                while (current.length > 1 && nextHeight < maxHeight * minFillRatio) {
                    const movedUnit = current[current.length - 1];
                    const candidateCurrent = current.slice(0, -1);
                    const candidateNext = [movedUnit].concat(next);
                    const candidateCurrentHeight = chunkHeight(candidateCurrent, i > 0);
                    const candidateNextHeight = chunkHeight(candidateNext, true);

                    if (candidateCurrentHeight <= maxHeight && candidateNextHeight <= maxHeight) {
                        current = candidateCurrent;
                        next = candidateNext;
                        nextHeight = candidateNextHeight;
                        balanced[i] = current;
                        balanced[i + 1] = next;
                    } else {
                        break;
                    }
                }
            }

            return balanced.filter(group => group.length > 0);
        }

        function buildKnowledgeBubbleChunks(el, maxHeight, measureContent) {
            const contentEl = el.querySelector('.bubble-content');
            if (!contentEl) return [el];

            const units = getBubbleContentUnits(contentEl);
            if (units.length <= 1) return [el];

            let chunkUnits = buildKnowledgeBubbleChunkUnitGroups(el, maxHeight, measureContent);
            chunkUnits = rebalanceKnowledgeBubbleChunkUnits(el, chunkUnits, maxHeight, measureContent);

            const chunks = chunkUnits.map((unitGroup, index) =>
                cloneKnowledgeBubble(el, unitGroup.join(''), index > 0)
            );

            return chunks;
        }

        function splitOversizedKnowledgeBubbles(elements) {
            const measure = createMeasurePage();
            const maxHeight = measure.content.clientHeight;
            const result = [];

            try {
                elements.forEach(el => {
                    if (!(el instanceof HTMLElement) || !el.classList.contains('think-bubble') || !el.classList.contains('knowledge-bubble')) {
                        result.push(el);
                        return;
                    }

                    const originalHeight = measureElementHeight(el, measure.content);
                    if (originalHeight <= maxHeight) {
                        result.push(el);
                        return;
                    }

                    const contentEl = el.querySelector('.bubble-content');
                    if (!contentEl) {
                        result.push(el);
                        return;
                    }

                    result.push(...buildKnowledgeBubbleChunks(el, maxHeight, measure.content));
                });
            } finally {
                measure.sheet.remove();
            }

            return result;
        }

        function cloneCard(el, units, isContinuation) {
            const clone = el.cloneNode(true);
            const label = clone.querySelector('.activity-label, .challenge-label');
            if (label && isContinuation) {
                const baseText = label.textContent.replace(/\s+\(Lanjutan\)$/i, '');
                label.textContent = `${baseText} (Lanjutan)`;
            }

            const contentWrappers = [...clone.children].filter(child => !child.classList.contains('activity-label') && !child.classList.contains('challenge-label'));
            if (contentWrappers.length > 0) {
                const wrapper = contentWrappers[0];
                wrapper.innerHTML = '';
                units.forEach(u => wrapper.appendChild(u.cloneNode(true)));
            }
            return clone;
        }

        function buildCardChunks(el, maxHeight, measureContent) {
            const contentWrappers = [...el.children].filter(child => !child.classList.contains('activity-label') && !child.classList.contains('challenge-label'));
            if (contentWrappers.length === 0) return [el];

            const wrapper = contentWrappers[0];
            const units = [...wrapper.children];
            if (units.length <= 1) return [el];

            const chunks = [];
            let currentUnits = [];

            for (let i = 0; i < units.length; i++) {
                currentUnits.push(units[i]);
                const candidateCard = cloneCard(el, currentUnits, chunks.length > 0);
                const candidateHeight = measureElementHeight(candidateCard, measureContent);

                if (candidateHeight > maxHeight && currentUnits.length > 1) {
                    currentUnits.pop();
                    chunks.push(cloneCard(el, currentUnits, chunks.length > 0));
                    currentUnits = [units[i]];
                }
            }

            if (currentUnits.length > 0) {
                chunks.push(cloneCard(el, currentUnits, chunks.length > 0));
            }

            return chunks;
        }

        function splitOversizedCards(elements) {
            const measure = createMeasurePage();
            const maxHeight = measure.content.clientHeight - 20;
            const result = [];

            try {
                elements.forEach(el => {
                    if (!(el instanceof HTMLElement) || (!el.classList.contains('activity-card') && !el.classList.contains('challenge-card'))) {
                        result.push(el);
                        return;
                    }

                    const originalHeight = measureElementHeight(el, measure.content);
                    if (originalHeight <= maxHeight) {
                        result.push(el);
                        return;
                    }

                    result.push(...buildCardChunks(el, maxHeight, measure.content));
                });
            } finally {
                measure.sheet.remove();
            }

            return result;
        }

        function cloneQuizElement(el, questionBlocks, isContinuation) {
            const clone = el.cloneNode(true);
            const quizItem = clone.classList.contains('quiz-item') ? clone : clone.querySelector('.quiz-item');
            if (!quizItem) return clone;

            const header = quizItem.querySelector(':scope > .quiz-header');
            if (header && isContinuation) {
                const baseText = header.textContent.replace(/\s+\(Lanjutan\)$/i, '').trim();
                header.textContent = `${baseText} (Lanjutan)`;
            }

            quizItem.querySelectorAll(':scope > .quiz-question-block').forEach(block => block.remove());
            questionBlocks.forEach(block => quizItem.appendChild(block.cloneNode(true)));
            return clone;
        }

        function buildQuizChunks(el, maxHeight, measureContent) {
            const quizItem = el.classList.contains('quiz-item') ? el : el.querySelector('.quiz-item');
            if (!quizItem) return [el];

            const questionBlocks = [...quizItem.querySelectorAll(':scope > .quiz-question-block')];
            if (questionBlocks.length <= 1) return [el];

            const chunks = [];
            let currentBlocks = [];

            for (let i = 0; i < questionBlocks.length; i++) {
                currentBlocks.push(questionBlocks[i]);
                const candidate = cloneQuizElement(el, currentBlocks, chunks.length > 0);
                const candidateHeight = measureElementHeight(candidate, measureContent);

                if (candidateHeight > maxHeight && currentBlocks.length > 1) {
                    currentBlocks.pop();
                    chunks.push(cloneQuizElement(el, currentBlocks, chunks.length > 0));
                    currentBlocks = [questionBlocks[i]];
                }
            }

            if (currentBlocks.length > 0) {
                chunks.push(cloneQuizElement(el, currentBlocks, chunks.length > 0));
            }

            return chunks;
        }

        function splitOversizedQuizzes(elements) {
            const measure = createMeasurePage();
            const maxHeight = measure.content.clientHeight - 20;
            const result = [];

            try {
                elements.forEach(el => {
                    const isQuizElement = el instanceof HTMLElement && (
                        el.classList.contains('quiz-wrapper') ||
                        el.classList.contains('quiz-item') ||
                        !!el.querySelector('.quiz-item')
                    );

                    if (!isQuizElement) {
                        result.push(el);
                        return;
                    }

                    const originalHeight = measureElementHeight(el, measure.content);
                    if (originalHeight <= maxHeight) {
                        result.push(el);
                        return;
                    }

                    result.push(...buildQuizChunks(el, maxHeight, measure.content));
                });
            } finally {
                measure.sheet.remove();
            }

            return result;
        }

        function toRoman(num) {
            const lookup = { m: 1000, cm: 900, d: 500, cd: 400, c: 100, xc: 90, l: 50, xl: 40, x: 10, ix: 9, v: 5, iv: 4, i: 1 };
            let roman = '';
            for (let i in lookup) {
                while (num >= lookup[i]) {
                    roman += i;
                    num -= lookup[i];
                }
            }
            return roman;
        }

        const TOC_ITEMS_PER_PAGE = 12;

        function formatLevelText(value) {
            const clean = normalizeLevelLabel(value);
            return clean ? `Level ${clean}` : 'Level';
        }

        function formatSessionText(value) {
            const clean = String(value || '').replace(/session/ig, '').trim();
            return clean ? `Sesi ${clean}` : 'Sesi';

        function renderTocItems(list, chunk, pageIndex) {

                        <div style="width:21px;height:21px;flex:0 0 auto;border-radius:999px;background:#E7F4FF;border:1.4px solid #4CAAE4;color:#2A4365;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:8.8pt;font-weight:900;line-height:1;">${moduleNo}</div>

                                <div style="height:1px;flex:1;border-bottom:1.2px dotted #AFC0D5;transform:translateY(-2px);"></div>
