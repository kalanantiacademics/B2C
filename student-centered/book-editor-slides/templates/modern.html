                            </div>
                            <div style="margin-top:2px;font-size:7.8pt;color:#64748B;font-weight:800;line-height:1.05;">${escapeHtml(levelSession)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function refreshPageNumbersAndToc() {
            let romanCount = 1;
            let arabicCount = 1;
            const tocData = [];

            [...editorCanvas.querySelectorAll('.page-sheet')].forEach((sheet) => {
                const pageNumEl = sheet.querySelector('.page-num');
                if (!pageNumEl) return;

                const content = sheet.querySelector('.page-content');

                const isCover = !!content.querySelector('.cover-page');
                const isBlank = !!content.querySelector('.blank-page');
                const isCopyright = !!content.querySelector('.copyright-page');
                const isOwnershipNotice = !!content.querySelector('.ownership-notice-page');
                const isGuide = !!content.querySelector('.book-guide-page');
                const isToc = !!content.querySelector('.toc-page');
                const isBackCover = !!content.querySelector('.back-cover-page');

                if (isCover || isBlank || isBackCover) {
                    sheet.removeAttribute('data-page-number');
                    pageNumEl.style.display = 'none';
                } else if (isCopyright || isOwnershipNotice || isGuide || isToc) {
                    sheet.removeAttribute('data-page-number');
                    pageNumEl.style.display = 'block';
                    pageNumEl.style.fontStyle = 'italic';
                    pageNumEl.textContent = toRoman(romanCount);
                    romanCount++;
                } else {
                    pageNumEl.style.display = 'block';
                    pageNumEl.style.fontStyle = 'normal';
                    pageNumEl.textContent = arabicCount;
                    sheet.setAttribute('data-page-number', arabicCount);

                    const dividers = content.querySelectorAll('.session-divider');
                    dividers.forEach(divider => {
                        const pill = divider.querySelector('.scd-pill');
                        const courseTitleEl = divider.querySelector('.scd-course-title');
                        const topicEl = divider.querySelector('.scd-topic');
                        if (pill && courseTitleEl) {
                            const pillParts = (pill.textContent || '').split('•').map(part => part.trim()).filter(Boolean);
                            tocData.push({
                                moduleNo: Number(divider.dataset.moduleNo) || tocData.length + 1,
                                levelLabel: pillParts[0] || divider.dataset.levelLabel || '',
                                sessionLabel: pillParts[1] || divider.dataset.sessionLabel || '',
                                topic: topicEl?.textContent.trim() || divider.dataset.topic || '',
                                courseTitle: courseTitleEl.textContent.trim(),
                                pageNum: arabicCount
                            });
                        }
                    });

                    arabicCount++;
                }
            });

            const tocLists = editorCanvas.querySelectorAll('.toc-page .toc-list');
            if (tocLists.length > 0 && tocData.length > 0) {
                tocLists.forEach((list, i) => {
                    const chunk = tocData.slice(i * TOC_ITEMS_PER_PAGE, (i + 1) * TOC_ITEMS_PER_PAGE);
                    renderTocItems(list, chunk, i);
                });
            }
        }

        function rebalancePages() {
            const pages = [...editorCanvas.querySelectorAll('.page-sheet')];
            if (pages.length < 2) {
                refreshPageNumbersAndToc();
                return;
            }

            for (let i = 0; i < pages.length - 1; i++) {
                const currentContent = pages[i].querySelector('.page-content');
                const nextContent = pages[i + 1].querySelector('.page-content');
                if (!currentContent || !nextContent) continue;

                let movedAny = false;
                while (nextContent.firstElementChild) {
                    const candidate = nextContent.firstElementChild;
                    if (candidate.classList && candidate.classList.contains('session-divider')) {
                        break;
                    }

                    currentContent.appendChild(candidate);

                    if (currentContent.scrollHeight <= currentContent.clientHeight) {
                        movedAny = true;
                        continue;
                    }

                    currentContent.removeChild(candidate);
                    nextContent.insertBefore(candidate, nextContent.firstChild);
                    break;
                }

                if (movedAny && nextContent.children.length === 0) {
                    pages[i + 1].remove();
                }
            }

            refreshPageNumbersAndToc();
        }

        function mergeContinuations(elements) {
            const result = [];
            for (let i = 0; i < elements.length; i++) {
                const el = elements[i];

                if (result.length > 0 && el instanceof HTMLElement) {
                    const prev = result[result.length - 1];

                    if (prev instanceof HTMLElement) {
                        const isCard = (el.classList.contains('activity-card') && prev.classList.contains('activity-card')) ||
                            (el.classList.contains('challenge-card') && prev.classList.contains('challenge-card'));

                        if (isCard) {
                            const label = el.querySelector('.activity-label, .challenge-label');
                            if (label && label.textContent.includes('(Lanjutan)')) {
                                const prevWrapper = [...prev.children].find(c => !c.classList.contains('activity-label') && !c.classList.contains('challenge-label'));
                                const elWrapper = [...el.children].find(c => !c.classList.contains('activity-label') && !c.classList.contains('challenge-label'));

                                if (prevWrapper && elWrapper) {
                                    while (elWrapper.firstChild) {
                                        prevWrapper.appendChild(elWrapper.firstChild);
                                    }
                                    continue;
                                }
                            }
                        }

                        const isBubble = el.classList.contains('think-bubble') && prev.classList.contains('think-bubble');
                        if (isBubble) {
                            const title = el.querySelector('.think-title');
                            if (title && title.textContent.includes('(Lanjutan)')) {
                                const prevContent = prev.querySelector('.bubble-content');
                                const elContent = el.querySelector('.bubble-content');
                                if (prevContent && elContent) {
                                    while (elContent.firstChild) {
                                        prevContent.appendChild(elContent.firstChild);
                                    }
                                    continue;
                                }
                            }
                        }
                    }
                }

                result.push(el);
            }
            return result;
        }

        // Distribusikan elemen-elemen HTML ke halaman-halaman (Google Docs style)
        function repaginate(rawElements) {
            // Step 1: Flatten compound containers agar bisa mengalir antar halaman
            let flatElements = deepFlatten(rawElements);
            flatElements = mergeContinuations(flatElements);
            let preparedElements = splitOversizedKnowledgeBubbles(flatElements);
            preparedElements = splitOversizedCards(preparedElements);
            preparedElements = splitOversizedQuizzes(preparedElements);
            console.log("Repaginating", rawElements.length, "→", flatElements.length, "flattened elements →", preparedElements.length, "prepared elements");

            editorCanvas.innerHTML = '';

            if (preparedElements.length === 0) {
                editorCanvas.innerHTML = '<div class="page-sheet"><div class="page-content" style="padding:40px;color:#ccc;">Tidak ada data untuk level ini.</div></div>';
                return;
            }

            let pageNum = 1;
            let { sheet, content } = createPageSheet(pageNum);
            editorCanvas.appendChild(sheet);

            for (let i = 0; i < preparedElements.length; i++) {
                let el = preparedElements[i];
                clearAutoFitScale(el);
                const mustStartNewPage = el instanceof HTMLElement && el.classList.contains('session-divider');

                if (mustStartNewPage && content.children.length > 0) {
                    pageNum++;
                    const next = createPageSheet(pageNum);
                    editorCanvas.appendChild(next.sheet);
                    content = next.content;
                }

                content.appendChild(el);
                fitSinglePageElementIfNeeded(content);

                // Deteksi overflow REAL dari DOM (bukan manual math)
                // scrollHeight = total tinggi konten, clientHeight = tinggi container yg terlihat
                if (content.scrollHeight > content.clientHeight && content.children.length > 1) {
                    // Element ini bikin overflow → pindahkan ke halaman baru
                    content.removeChild(el);
                    pageNum++;
                    const next = createPageSheet(pageNum);
                    editorCanvas.appendChild(next.sheet);
                    content = next.content;
                    content.appendChild(el);
                    fitSinglePageElementIfNeeded(content);

                    // Cek kalau element sendiri lebih besar dari halaman (rare: gambar super besar)
                    if (singlePageElementVisuallyOverflows(content)) {
                        console.warn("Element terlalu besar untuk 1 halaman:", el.className || el.tagName);
                    }
                }
            }

            // --- WIDOW PREVENTION: step-headpack tidak boleh floating sendirian ---
            // Setelah semua elemen ditempatkan, cek setiap halaman:
            // jika step-headpack adalah elemen TERAKHIR di halaman tsb, tarik ke halaman berikutnya
            // bersama elemen pertama halaman berikutnya (step-content-item).
            {
                const allPages = [...editorCanvas.querySelectorAll('.page-sheet')];
                for (let p = 0; p < allPages.length - 1; p++) {
                    const thisContent = allPages[p].querySelector('.page-content');
                    const nextContent = allPages[p + 1].querySelector('.page-content');
                    if (!thisContent || !nextContent) continue;

                    const lastEl = thisContent.lastElementChild;
                    if (!lastEl || !lastEl.classList.contains('step-headpack')) continue;

                    // step-headpack sendirian di akhir → pindahkan ke halaman berikutnya
                    const firstOfNext = nextContent.firstElementChild;
                    const nextIsContent = firstOfNext && firstOfNext.classList.contains('step-content-item');

                    // Pindahkan headpack ke awal halaman berikutnya
                    thisContent.removeChild(lastEl);
                    nextContent.insertBefore(lastEl, nextContent.firstChild);

                    // Kalau halaman sebelumnya jadi kosong, hapus
                    if (thisContent.children.length === 0) {
                        allPages[p].remove();
                    }

                    console.log("Widow fix: step-headpack dipindah ke halaman", p + 2);
                }
            }

            rebalancePages();
            console.log("Done. Total pages:", pageNum);
        }

        // --- LOGIKA REFLOW SEPERTI GOOGLE DOCS ---
        let repaginateTimeout;
        let _isRepaginating = false; // guard agar ResizeObserver tidak loop
        let _isExporting = false; // guard agar DOM tidak berubah saat Chromium memotret

        // Cari elemen terdekat yg sedang terlihat di viewport (untuk anchor scroll)
        function findScrollAnchor() {
            const currentScrollY = window.scrollY;
            const viewportTop = currentScrollY + 90; // offset toolbar
            const allEls = editorCanvas.querySelectorAll('.page-content > *');
            let bestEl = null;
            let bestDist = Infinity;
            for (const el of allEls) {
                const rect = el.getBoundingClientRect();
                const elTop = rect.top + currentScrollY;
                const dist = Math.abs(elTop - viewportTop);
                if (dist < bestDist) {
                    bestDist = dist;
                    bestEl = el;
                }
            }
            if (!bestEl) return { fallbackScroll: currentScrollY };
            // Beri data-attribute unik untuk tracking
            const anchorId = 'scroll-anchor-' + Date.now();
            bestEl.setAttribute('data-scroll-anchor', anchorId);
            const offsetInEl = viewportTop - (bestEl.getBoundingClientRect().top + currentScrollY);
            return { anchorId, offsetInEl, fallbackScroll: currentScrollY };
        }

        // Restore scroll ke elemen anchor setelah DOM rebuild
        function restoreScrollAnchor(anchor) {
            if (!anchor) return;
            let restored = false;
            if (anchor.anchorId) {
                const el = editorCanvas.querySelector(`[data-scroll-anchor="${anchor.anchorId}"]`);
                if (el) {
                    const newTop = el.getBoundingClientRect().top + window.scrollY;
                    window.scrollTo({ top: newTop - 90 + anchor.offsetInEl, behavior: 'instant' });
                    el.removeAttribute('data-scroll-anchor');
                    restored = true;
                }
            }
            if (!restored && anchor.fallbackScroll !== undefined) {
                window.scrollTo({ top: anchor.fallbackScroll, behavior: 'instant' });
            }
        }

        function triggerAutoRepaginate() {
            if (_isRepaginating || _isExporting) return;
            saveStatus.textContent = 'Menyusun ulang...';

            // Simpan snapshot SEBELUM repaginate untuk undo
            pushUndoSnapshot();

            clearTimeout(repaginateTimeout);
            repaginateTimeout = setTimeout(() => {
                // Jangan repaginate kalau user sedang sorot teks atau pakai toolbar (agar format/fokus tidak hilang)
                const sel = window.getSelection();
                const isHighlighting = sel && sel.rangeCount > 0 && !sel.isCollapsed && isEditorNode(sel.getRangeAt(0).commonAncestorContainer);
                const isUsingToolbar = document.activeElement && document.activeElement.closest('#menu-tools');
                
                if (isHighlighting || isUsingToolbar) {
                    setTimeout(triggerAutoRepaginate, 1500);
                    return;
                }

                _isRepaginating = true;

                // Cari anchor element sebelum DOM dihancurkan
                const anchor = findScrollAnchor();

                const allEls = [];
                editorCanvas.querySelectorAll('.page-content > *').forEach(el => {
                    // Salin ukuran resize manual ke clone
                    const clone = el.cloneNode(true);
                    if (el.style.width) clone.style.width = el.style.width;
                    if (el.style.height) clone.style.height = el.style.height;
                    // Juga salin dari child resizable elements
                    el.querySelectorAll('.shot-card, .inline-image, .todo-group-image-item').forEach((resEl, idx) => {
                        const cloneRes = clone.querySelectorAll('.shot-card, .inline-image, .todo-group-image-item')[idx];
                        if (cloneRes && resEl) {
                            if (resEl.style.width) cloneRes.style.width = resEl.style.width;
                            if (resEl.style.height) cloneRes.style.height = resEl.style.height;
                        }
                    });
                    allEls.push(clone);
                });

                repaginate(allEls);

                // Re-attach observers SETELAH jeda — agar initial-fire tidak trigger loop
                requestAnimationFrame(() => {
                    attachResizeObservers();
                    // Restore scroll ke anchor
                    restoreScrollAnchor(anchor);
                    _isRepaginating = false;
                    saveToLocal(); // auto-save setelah repaginate
                    saveStatus.textContent = 'Status: OK';
                });
            }, 500);
        }

        let _isCustomResizing = false;
        let activeResizeEl = null;
        let startX, startY, startW, startH;

        document.addEventListener('mousedown', (e) => {
            const handle = e.target.closest('.resize-handle-tr');
            if (handle) {
                e.preventDefault();
                e.stopPropagation();
                activeResizeEl = handle.closest('.shot-card, .inline-image, .todo-group-image-item');
                if (!activeResizeEl) return;

                _isCustomResizing = true;
                const rect = activeResizeEl.getBoundingClientRect();
                startW = rect.width;
                startH = rect.height;
                startX = e.clientX;
                startY = e.clientY;
                document.body.style.userSelect = 'none';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (_isCustomResizing && activeResizeEl) {
                const dx = e.clientX - startX;
                let newW = Math.max(60, startW + dx);
                let newH = Math.max(50, startH * (newW / startW)); // Proportional

                activeResizeEl.style.width = newW + 'px';
                activeResizeEl.style.height = newH + 'px';
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (_isCustomResizing) {
                document.body.style.userSelect = '';
                _isCustomResizing = false;
                activeResizeEl = null;
                if (!_isRepaginating && !_isExporting) {
                    triggerAutoRepaginate();
                }
            }
        });

        // Pasang ResizeObserver pada semua elemen resizable
        function attachResizeObservers() {
            // Kita hapus ResizeObserver karena sering menyebabkan infinite loop.
            // Repaginasi saat resize sudah dihandle oleh event mouseup di canvas.
            const resizables = editorCanvas.querySelectorAll('.shot-card, .inline-image, .todo-group-image-item');
            resizables.forEach(el => {
                if (!el.querySelector('.resize-handle-tr')) {
                    const handle = document.createElement('div');
                    handle.className = 'resize-handle-tr';
                    handle.contentEditable = 'false';
                    el.appendChild(handle);
                }
            });
        }

        // Fallback: mouseup di canvas → trigger reflow jika user baru resize gambar
        editorCanvas.addEventListener('mouseup', (e) => {
            const target = e.target.closest('.shot-card, .inline-image, .todo-group-image-item');
            if (target && !_isRepaginating && !_isExporting) {
                triggerAutoRepaginate();
            }
        });

        function onEdit() {
            if (_isExporting) return;
            saveStatus.textContent = 'Mengetik...';
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveToLocal();
                triggerAutoRepaginate();
            }, 1500);
        }

        const CACHE_VERSION = 3; // Increment ini kalau ada perubahan format data

        function collectDraftElements() {
            return [...editorCanvas.querySelectorAll('.page-content > *')].map((el, index) => ({
                index,
                html: el.outerHTML
            }));
        }

        function getCurrentCourseLevel() {
            const course = document.getElementById('course-select').value;
            const level = document.getElementById('level-input').value.trim() || 'all';
            return { course, level };
        }

        async function saveDraftToServer({ silent = true } = {}) {
            if (!currentLoadedParams) return false;
            const { course, level } = getCurrentCourseLevel();
            const elements = collectDraftElements();
            if (!elements.length) return false;

            const signature = JSON.stringify({
                course,
                level,
                elements: elements.map(item => item.html)
            });
            if (silent && signature === _lastDraftSignature) return true;

            const payload = {
                course,
                level,
                title: document.title,
                elements,
                pageCount: editorCanvas.querySelectorAll('.page-sheet').length,
                scrollY: window.scrollY
            };

            try {
                if (!silent) saveStatus.textContent = 'Menyimpan draft...';
                const res = await fetch('/api/draft', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Gagal menyimpan draft');
                }
                _lastDraftSignature = signature;
                saveStatus.textContent = `Draft tersimpan ${new Date().toLocaleTimeString('id-ID')}`;
                return true;
            } catch (err) {
                console.warn('Gagal save draft server:', err);
                if (!silent) alert('Gagal menyimpan draft: ' + err.message);

        function parseLegacyQuizOptionItems(text) {
            const cleanText = String(text || '').trim();
            if (!cleanText) return [];

            const markerPattern = /(^|[\s|;])([A-Z])(?:[.):]|\s+)/g;
            const matches = [];
            let match;
            while ((match = markerPattern.exec(cleanText)) !== null) {
                matches.push({
                    letter: match[2],
                    start: markerPattern.lastIndex,
                    markerStart: match.index + match[1].length
                });
            }

            return matches.map((item, index) => {
                const end = index + 1 < matches.length ? matches[index + 1].markerStart : cleanText.length;
                const desc = cleanText.slice(item.start, end).replace(/^[\s|;:-]+|[\s|;:-]+$/g, '').trim();
                return desc ? { letter: item.letter, desc } : null;
            }).filter(Boolean);
        }

        function normalizeRestoredCodeFences(root) {
            const containers = [root, ...root.querySelectorAll('.step-headpack, .step-content-item, .bubble-content, .activity-card, .challenge-card, .quiz-wrapper')];
            containers.forEach(container => {
                const children = [...container.children];
                for (let i = 0; i < children.length; i++) {
                    const first = children[i];
                    if (first.tagName === 'PRE') continue;

                    const getRawText = (el) => {
                        const temp = document.createElement('div');
                        temp.innerHTML = el.innerHTML.replace(/<br\s*\/?>/gi, '\n');
                        return temp.textContent || '';
                    };

                    const firstText = getRawText(first).trim();
                    // Match ``` optionally followed by language tag, then OPTIONAL whitespace/newline
                    const openMatch = firstText.match(/^```([a-zA-Z0-9_.+-]*)(?:[\s\n]+)?([\s\S]*)$/);
                    if (!openMatch) continue;

                    const codeParts = [];
                    if (openMatch[2] && openMatch[2].trim()) codeParts.push(openMatch[2].trim());

                    const removeNodes = [first];
                    let closed = false;
                    let endIndex = i;
                    for (let j = i + 1; j < children.length; j++) {
                        const node = children[j];
                        const text = getRawText(node);
                        const closeIndex = text.indexOf('```');
                        removeNodes.push(node);
                        endIndex = j;

                        if (closeIndex >= 0) {
                            const beforeClose = text.slice(0, closeIndex).trim();
                            if (beforeClose) codeParts.push(beforeClose);
                            closed = true;
                            break;
                        }
                        codeParts.push(text.trim());
                    }

                    if (!closed || !codeParts.join('').trim()) continue;

                    const pre = document.createElement('pre');
                    pre.className = 'syntax-block';
                    const code = document.createElement('code');
                    code.textContent = codeParts.join('\n\n').trim();
                    pre.appendChild(code);
                    container.insertBefore(pre, first);
                    removeNodes.forEach(node => node.remove());
                    i = endIndex;
                }
            });
        }

        function normalizeRestoredHtmlElement(root) {
            if (!(root instanceof HTMLElement)) return root;

            normalizeRestoredCodeFences(root);

            root.querySelectorAll('.quiz-options').forEach(optionsEl => {
                const optionRows = [...optionsEl.querySelectorAll(':scope > .quiz-option')];
                if (optionRows.length !== 1 || !optionRows[0].querySelector('.quiz-bullet')) return;

                const textSpan = optionRows[0].querySelector('span:last-child');
                const items = parseLegacyQuizOptionItems(textSpan ? textSpan.textContent : optionRows[0].textContent);
                if (!items.length) return;

                optionsEl.innerHTML = items.map(item => (
                    `<p class="quiz-option"><span class="quiz-option-badge">${escapeHtml(item.letter)}</span><span>${escapeHtml(item.desc)}</span></p>`
                )).join('');
            });

            return root.parentElement ? root : null;
        }

        function restoreElementsFromHtmlList(htmlList) {
            const flatElements = [];
            htmlList.forEach(html => {
                if (!html || !html.trim()) return;
                const wrapper = document.createElement('div');
                wrapper.innerHTML = html.trim();
                const child = normalizeRestoredHtmlElement(wrapper.firstElementChild);
                if (child) {
                    child.querySelectorAll('[data-saved-w]').forEach(el => {
                        el.style.width = el.getAttribute('data-saved-w');
                        el.style.height = el.getAttribute('data-saved-h') || '';
                    });
                    if (child.hasAttribute('data-saved-w')) {
                        child.style.width = child.getAttribute('data-saved-w');
                        child.style.height = child.getAttribute('data-saved-h') || '';
                    }
                    flatElements.push(child);
                }
            });
            return flatElements;
        }

        function htmlToFirstElement(html) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = String(html || '').trim();
            return wrapper.firstElementChild;
        }

        function ensureRequiredFrontMatter(flatElements) {
            function isRole(el, role) {
                if (!el || !el.matches) return false;
                return el.matches(`[data-page-role="${role}"]`) || !!el.querySelector(`[data-page-role="${role}"]`);
            }

            const coverIndex = flatElements.findIndex(el => isRole(el, 'cover'));
            if (coverIndex < 0) return flatElements;

            function hasRoleAt(index, role) {
                if (index < 0 || index >= flatElements.length) return false;
                return isRole(flatElements[index], role);
            }

            let insertAt = coverIndex + 1;
            if (!hasRoleAt(insertAt, 'blank')) {
                flatElements.splice(insertAt, 0, htmlToFirstElement(buildBlankPageHtml()));
            }
            insertAt++;

            if (!hasRoleAt(insertAt, 'copyright')) {
                flatElements.splice(insertAt, 0, htmlToFirstElement(buildCopyrightPageHtml()));
            }
            insertAt++;

            if (!hasRoleAt(insertAt, 'ownership_notice')) {
                flatElements.splice(insertAt, 0, htmlToFirstElement(buildOwnershipNoticePageHtml()));
            }

            const backCoverIndex = flatElements.findIndex(el => isRole(el, 'back-cover'));
            if (backCoverIndex < 0) {
                flatElements.push(htmlToFirstElement(buildBackCoverPageHtml()));
            } else if (backCoverIndex !== flatElements.length - 1) {
                const backCoverEl = flatElements.splice(backCoverIndex, 1)[0];
                flatElements.push(backCoverEl);
            }

            return flatElements;
        }

            document.getElementById('course-select').value = course;

            document.getElementById('level-input').value = level;

            const htmlList = payload.elements.map(item => typeof item === 'string' ? item : item.html);
            const flatElements = ensureRequiredFrontMatter(restoreElementsFromHtmlList(htmlList));
            if (!flatElements.length) return false;

            repaginate(flatElements);
            attachResizeObservers();
            _lastDraftSignature = JSON.stringify({
                course,

        function getPageCaptureSpec(pageContent, role) {
            // Export harus sama persis dengan halaman editor. Jangan crop isi:

            return { captureRatio: { x: 0, y: 0, width: 1, height: 1 } };

        function buildExportHeadHtml() {
            return [...document.head.querySelectorAll('link[rel="stylesheet"], style')]
                .map(node => node.outerHTML)
                .join('\n');
        }

        async function waitForExportFonts() {
            if (!document.fonts) return;
            const fontLoads = [
                '400 14pt "Poppins"',
                '500 14pt "Poppins"',
                '600 14pt "Poppins"',
                '700 14pt "Poppins"',
                '800 14pt "Poppins"',
                '900 14pt "Poppins"'
            ].map(font => document.fonts.load(font).catch(() => []));

            await Promise.all(fontLoads);
            if (document.fonts.ready) {
                await document.fonts.ready.catch(() => {});
            }
        }

        async function renderPageImageOnServer(pageSheet) {
            const rect = pageSheet.getBoundingClientRect();
            const res = await fetch('/api/render_page_image', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    html: pageSheet.outerHTML,
                    headHtml: buildExportHeadHtml(),
                    widthPx: Math.ceil(rect.width || pageSheet.offsetWidth),
                    heightPx: Math.ceil(rect.height || pageSheet.offsetHeight),
                    scale: EXPORT_IMAGE_SCALE,
                    imageType: 'png'
                })
            });
            const data = await res.json();
            if (!res.ok || !data.success) {
                throw new Error(data.error || 'Gagal membuat screenshot native.');
            }
            return data;
        }

        async function renderPageImagesOnServer(pageItems) {
            // Paksa browser menunggu font sebelum lanjut agar tidak bocor menjadi Arial
            try {
                await waitForExportFonts();
            } catch(e) { console.warn("Font pre-load error", e); }
            
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 120000);
            let res;
            let data;
            try {
                res = await fetch('/api/render_page_images', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    signal: controller.signal,
                    body: JSON.stringify({
                        headHtml: buildExportHeadHtml(),
                        scale: EXPORT_IMAGE_SCALE,
                        imageType: 'png',
                        pages: pageItems
                    })
                });
                data = await res.json();
            } catch (err) {
                if (err && err.name === 'AbortError') {
                    throw new Error('Render screenshot berhenti karena batch terlalu lama. Coba export ulang; halaman/gambar yang lambat sekarang akan dibatasi timeout.');
                }
                throw err;
            } finally {
                clearTimeout(timeoutId);
            }
            if (!res.ok || !data.success) {
                throw new Error(data.error || 'Gagal membuat screenshot native.');
            }
            return data.images || [];
        }

        async function waitForExactCaptureAssets(root) {
            if (document.fonts && document.fonts.ready) {
                try { await document.fonts.ready; } catch (e) { /* lanjut export */ }
            }

            const imgs = [...root.querySelectorAll('img')];
            await Promise.all(imgs.map(async (img) => {
                try {
                    if (!img.complete || img.naturalWidth === 0) {
                        await new Promise((resolve) => {
                            img.addEventListener('load', resolve, { once: true });
                            img.addEventListener('error', resolve, { once: true });
                        });
                    }
                    if (img.decode) {
                        await img.decode().catch(() => {});
                    }
                } catch (e) {
                    // Gambar yang gagal decode tetap diexport apa adanya agar proses tidak berhenti total.
                }
            }));
        }

        function freezeResizableImageBoxes(root) {
            const frozen = [];
            root.querySelectorAll('.shot-card, .inline-image, .todo-group-image-item').forEach(el => {
                const rect = el.getBoundingClientRect();
                frozen.push({
                    el,
                    width: el.style.width,
                    height: el.style.height,
                    resize: el.style.resize
                });
                if (!el.style.width) el.style.width = `${Math.ceil(rect.width)}px`;
                if (!el.style.height) el.style.height = `${Math.ceil(rect.height)}px`;
                el.style.resize = 'none';
            });
            return () => {
                frozen.forEach(item => {
                    item.el.style.width = item.width;
                    item.el.style.height = item.height;
                    item.el.style.resize = item.resize;
                });
            };
        }

        // --- EXPORT PIPELINE (CHROMIUM SCREENSHOT + JSON) ---
        async function exportToSlides() {
            if (_isRepaginating) {
                alert("Tunggu sampai proses susun ulang selesai!");
                return;
            }

            // Tampilkan Overlay Loading
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(255,255,255,0.8);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;backdrop-filter:blur(3px);';
            overlay.innerHTML = '<h2 style="font-size:24px;font-weight:bold;color:#2A4365;">Mempersiapkan Export...</h2><p style="color:#666;margin-top:10px;">Proses ini mungkin memakan waktu beberapa menit (mengubah puluhan konten menjadi gambar beresolusi tinggi).</p><p id="export-progress" style="font-weight:bold;font-size:18px;margin-top:20px;color:#F07D49;">0%</p>';
            document.body.appendChild(overlay);

            _isExporting = true;
            saveStatus.textContent = 'Menyiapkan export...';
            try {
                await waitForExportFonts();
            } catch(e) {}
            
            const exportData = {
                course: document.getElementById('course-select').value,
                level: document.getElementById('level-input').value,
                pages: [],
                elements: []
            };

            const originalScrollY = window.scrollY;
            const originalScrollX = window.scrollX;

            refreshPageNumbersAndToc();

            const pageSheets = [...editorCanvas.querySelectorAll('.page-sheet')];
            const totalPages = pageSheets.length;
            const capturePages = [];
            const pageMetas = [];
            const exportCourseTitles = {
                scratch: 'Scratch Creator Play',
                python: 'Python Creator Play',
                roblox: 'Roblox Studio Play'
            };
            let currentSessionHeaderText = exportCourseTitles[exportData.course] || exportCourseTitles.roblox;

            function buildSessionHeaderText(sessionDivider) {
                if (!sessionDivider) return currentSessionHeaderText;
                const levelLabel = (sessionDivider.dataset.levelLabel || '').trim();
                const sessionLabel = (sessionDivider.dataset.sessionLabel || '').trim();
                const topic = (sessionDivider.dataset.topic || sessionDivider.querySelector('.scd-topic')?.innerText || '').trim();
                const lineOne = [levelLabel, sessionLabel]
                    .filter(Boolean)
                    .map(text => text.toUpperCase())
                    .join('  •  ');
                return [lineOne, topic].filter(Boolean).join('\n') || currentSessionHeaderText;
            }

            for (let pageIndex = 0; pageIndex < pageSheets.length; pageIndex++) {
                const pageSheet = pageSheets[pageIndex];
                const pageContent = pageSheet.querySelector('.page-content');
                if (!pageContent) continue;

                // Membawa halaman ke viewport agar ukuran layout final sudah stabil sebelum screenshot native
                pageSheet.scrollIntoView({ behavior: 'instant', block: 'start' });
                // Jeda sedikit agar browser sempat me-render elemen di layar
                await new Promise(r => setTimeout(r, 50));

                const progressEl = document.getElementById('export-progress');
                if (progressEl) progressEl.innerText = `Render halaman ${pageIndex + 1} dari ${pageSheets.length}`;

                const hasSessionDivider = !!pageContent.querySelector('.session-divider');
                const coverEl  = pageContent.querySelector('[data-page-role="cover"]');
                const blankEl  = pageContent.querySelector('[data-page-role="blank"]');
                const copyrightEl = pageContent.querySelector('[data-page-role="copyright"]');
                const ownershipNoticeEl = pageContent.querySelector('[data-page-role="ownership_notice"]');
                const guideEl  = pageContent.querySelector('[data-page-role="guide"]');
                const tocEl    = pageContent.querySelector('[data-page-role="toc"]');
                const pageRole = coverEl  ? 'cover'
                               : blankEl  ? 'blank'
                               : copyrightEl ? 'copyright'
                               : ownershipNoticeEl ? 'ownership_notice'
                               : guideEl  ? 'guide'
                               : tocEl    ? 'toc'
                               : hasSessionDivider ? 'session_open'
                               : 'content';
                const captureSpec = getPageCaptureSpec(pageContent, pageRole);

                await waitForExactCaptureAssets(pageContent);
                const unfreezeResizableBoxes = freezeResizableImageBoxes(pageContent);

                try {
                    const captureEl = pageRole === 'cover' ? pageSheet : pageContent;
                    const captureRect = captureEl.getBoundingClientRect();
                    capturePages.push({
                        html: captureEl.outerHTML,
                        widthPx: Math.ceil(captureRect.width || captureEl.offsetWidth),
                        heightPx: Math.ceil(captureRect.height || captureEl.offsetHeight)
                    });
                } catch (err) {
                    console.error('Gagal menyiapkan halaman export:', pageIndex + 1, err);
                    alert(`Gagal menyiapkan halaman ${pageIndex + 1}: ${err && err.message ? err.message : err}`);
                    saveStatus.textContent = "Export gagal";
                    window.scrollTo(originalScrollX, originalScrollY);
                    _isExporting = false;
                    attachResizeObservers();
                    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                    return;
                } finally {
                    unfreezeResizableBoxes();
                }

                const sessionHeaderEl = pageContent.querySelector('.session-divider');
                if (sessionHeaderEl) {
                    currentSessionHeaderText = buildSessionHeaderText(sessionHeaderEl);
                }
                const headerText = currentSessionHeaderText;

                pageMetas.push({
                    index: pageIndex,
                    role: pageRole,
                    originalRole: pageRole,
                    title: pageSheet.querySelector('.page-num')?.innerText.trim() || `Page ${pageIndex + 1}`,
                    pageNumber: pageRole === 'cover'
                        ? ''
                        : (pageSheet.dataset.pageNumber || pageSheet.querySelector('.page-num')?.innerText.trim() || ''),
                    headerText: headerText || 'Kalananti',
                    captureRatio: captureSpec.captureRatio
                });
            }

            const RENDER_BATCH_SIZE = 10;
            for (let renderStart = 0; renderStart < capturePages.length; renderStart += RENDER_BATCH_SIZE) {
                const renderEnd = Math.min(renderStart + RENDER_BATCH_SIZE, capturePages.length);
                const progressEl = document.getElementById('export-progress');
                if (progressEl) progressEl.innerText = `Render gambar ${renderStart + 1}-${renderEnd} dari ${capturePages.length}`;

                let images;
                try {
                    images = await renderPageImagesOnServer(capturePages.slice(renderStart, renderEnd));
                } catch (err) {
                    console.error('Gagal render batch export:', renderStart + 1, err);
                    alert(`Gagal render gambar ${renderStart + 1}-${renderEnd}: ${err && err.message ? err.message : err}`);
                    saveStatus.textContent = "Export gagal";
                    window.scrollTo(originalScrollX, originalScrollY);
                    _isExporting = false;
                    attachResizeObservers();
                    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                    return;
                }

                images.forEach((encoded, imageIndex) => {
                    const meta = pageMetas[renderStart + imageIndex];
                    let effectivePageNumber = meta.pageNumber;

                    exportData.pages.push({
                        ...meta,
                        pageNumber: effectivePageNumber,
                        imageWidthPx: encoded.width,
                        imageHeightPx: encoded.height,
                        imageBase64: encoded.imageBase64
                    });
                });
            }

            // Kembalikan scroll position
            window.scrollTo(originalScrollX, originalScrollY);

            console.log("Export Payload:", exportData);

            let uploadFailed = false;
            try {
                const BATCH_SIZE = 3;
                const totalBatches = Math.max(1, Math.ceil(exportData.pages.length / BATCH_SIZE));
                let result = null;
                let presentationId = null;

                for (let batchIndex = 0; batchIndex < totalBatches; batchIndex++) {
                    const start = batchIndex * BATCH_SIZE;
                    const end = start + BATCH_SIZE;
                    const pagesBatch = exportData.pages.slice(start, end);
                    const batchPayload = {
                        course: exportData.course,
                        level: exportData.level,
                        presentationId,
                        pageNumberStart: start + 1,
                        finalizeExport: batchIndex === totalBatches - 1,
                        pages: pagesBatch,
                        elements: []
                    };

                    const progressEl = document.getElementById('export-progress');
                    if (progressEl) {
                        progressEl.innerText = `Upload batch ${batchIndex + 1}/${totalBatches} • halaman ${start + 1}-${Math.min(end, exportData.pages.length)}`;
                    }
                    saveStatus.textContent = `Mengirim batch ${batchIndex + 1}/${totalBatches} ke Apps Script...`;

                    const res = await fetch('/api/export_slides', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(batchPayload)
                    });
                    result = await res.json();
                    if (!res.ok || !result.success) {
                        throw new Error(result.error || `Batch ${batchIndex + 1} gagal diproses.`);
                    }

                    presentationId = result.appsScriptResponse?.presentationId || result.appsScriptResponse?.id || presentationId;
                    if (batchIndex < totalBatches - 1) {
                        await new Promise(resolve => setTimeout(resolve, 800));
                    }
                }

                if (result.success) {
                    if (result.slidesUrl) {
                        window.open(result.slidesUrl, '_blank', 'noopener');
                        alert("Berhasil! Google Slides baru sudah dibuat dari template.");
                    } else {
                        alert("Payload tersimpan, tapi link Google Slides belum dikembalikan server.");
                    }
                } else {
                    alert("Gagal export: " + result.error);
                }
            } catch (e) {
                uploadFailed = true;
                alert("Error koneksi: " + e);
            }
            saveStatus.textContent = uploadFailed ? "Export gagal" : "Export Selesai ✔";
            _isExporting = false;
            attachResizeObservers();
            if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }

        // --- AUTO-RESTORE & EMERGENCY SAVE ---
        // Saat page load, coba restore layout terakhir
        window.addEventListener('DOMContentLoaded', async () => {
            const courseSelect = document.getElementById('course-select');
            if (courseSelect) {
                courseSelect.addEventListener('change', () => {
                    loadLevelOptionsForCourse();
                });
            }
            await loadLevelOptionsForCourse();
            const params = new URLSearchParams(window.location.search);
            const draftName = params.get('draft');
            let restored = false;
            if (draftName) {
                restored = await loadDraftByFilename(draftName);
            } else {
                restored = await openLatestDraft(true);
            }
            if (!restored) {
                loadFromLocal();
            }
        });

        // Emergency save sebelum tab ditutup / refresh
        window.addEventListener('beforeunload', () => {
            saveToLocal();
        });
    </script>
</body>

</html>
