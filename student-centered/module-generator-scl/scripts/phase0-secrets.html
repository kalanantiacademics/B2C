<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phase 0 Secret Setup</title>
    <style>
      body { max-width: 720px; margin: 48px auto; padding: 0 20px; color: #17203b; font-family: system-ui, sans-serif; }
      section { padding: 28px; border: 1px solid #dbe2ef; border-radius: 20px; box-shadow: 0 18px 60px #17203b14; }
      label { display: block; margin: 18px 0 7px; font-weight: 700; }
      input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; }
      button { margin-top: 18px; padding: 12px 18px; border: 0; border-radius: 10px; color: white; background: #2864dc; font-weight: 800; }
      .output { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
      .output button { margin: 0; background: #17203b; }
      small, p { color: #667085; line-height: 1.55; }
    </style>
  </head>
  <body>
    <section>
      <h1>Phase 0 Secret Setup</h1>
      <p>Tool lokal ini tidak mengirim nilai ke server dan tidak menulis ke console. Tutup halaman setelah semua nilai ditempel ke Script Properties.</p>
      <label for="passcode">Team passcode baru</label>
      <input id="passcode" type="password" autocomplete="new-password">
      <button id="generate" type="button">Generate values</button>
      <div id="outputs" hidden>
        <div class="output"><label>SCL_PASSWORD_SALT<input id="salt" readonly></label><button data-copy="salt">Copy</button></div>
        <div class="output"><label>SCL_PASSWORD_HASH<input id="hash" readonly></label><button data-copy="hash">Copy</button></div>
        <div class="output"><label>SCL_SESSION_SIGNING_SECRET<input id="signing" readonly></label><button data-copy="signing">Copy</button></div>
      </div>
      <small>Jangan screenshot, commit, atau menaruh hasilnya di chat/worklog.</small>
    </section>
    <script>
      const encoder = new TextEncoder();
      const encode = (bytes) => btoa(String.fromCharCode(...bytes)).replaceAll('+', '-').replaceAll('/', '_').replace(/=+$/, '');
      document.getElementById('generate').addEventListener('click', async () => {
        const passcode = document.getElementById('passcode').value;
        if (!passcode) return;
        const salt = encode(crypto.getRandomValues(new Uint8Array(24)));
        const signing = encode(crypto.getRandomValues(new Uint8Array(32)));
        const key = await crypto.subtle.importKey('raw', encoder.encode(salt), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
        const signature = await crypto.subtle.sign('HMAC', key, encoder.encode(`scl-passcode-v1\0${passcode}`));
        document.getElementById('salt').value = salt;
        document.getElementById('hash').value = encode(new Uint8Array(signature));
        document.getElementById('signing').value = signing;
        document.getElementById('passcode').value = '';
        document.getElementById('outputs').hidden = false;
      });
      document.querySelectorAll('[data-copy]').forEach((button) => button.addEventListener('click', async () => {
        await navigator.clipboard.writeText(document.getElementById(button.dataset.copy).value);
        button.textContent = 'Copied';
      }));
    </script>
  </body>
</html>
