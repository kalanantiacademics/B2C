    function refreshActiveSessionData() {
      var activeSessionNumber = state.activeSession.session;
      return callLoadLevelProject(
        state.session.token,
        state.activeProject.course.key,
        state.activeProject.level
      ).then(unwrapEnvelope).then(function (project) {
        state.activeProject = project;
        var latest = project.sessions.filter(function (session) {
          return session.session === activeSessionNumber;
        })[0];
        state.activeSession = latest;
        state.currentRevision = latest.sourceRevision;
        elements.sessionTopicInput.value = latest.fields['Session-topic'].text;
        SclVisualEditor.load(latest.fields || {}, latest.tables || [], latest.layouts || []);
        state.dirty = false;
        state.pendingSaveRequest = null;
        setEditorReadOnly(!state.lease);
        hideConflictBanner();
        return loadActiveHistory();
      });
    }

    function reloadLatestSource() {
      if (!state.activeSession) {
        return;
      }
      elements.reloadLatestButton.disabled = true;
      setLoading(true, 'Memuat source terbaru…');
      refreshActiveSessionData()
        .then(function () {
          showRecoveryDraftIfPresent();
          notifySuccess_('source-reload', 'Source terbaru dimuat', 'Editor sudah disinkronkan dengan revision terbaru.');
        })
        .catch(function (error) { showConflict(error.message, true); })
        .finally(function () {
          elements.reloadLatestButton.disabled = false;
          setLoading(false);
        });
    }

    function copyLocalChanges() {
      var fields = SclVisualEditor.serialize();
      var value = ['Session topic: ' + elements.sessionTopicInput.value].concat(
        Object.keys(fields).map(function (field) { return field + ':\n' + fields[field].text; })
      ).join('\n\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value)
          .then(function () { notifySuccess_('copy-changes', 'Perubahan disalin', 'Salinan lokal siap ditempel ke dokumen aman.'); })
          .catch(function () { notifyError_('copy-changes', 'Gagal menyalin', 'Browser menolak akses clipboard. Salin isi editor secara manual.'); });
      } else {
        notifyError_('copy-changes', 'Clipboard tidak tersedia', 'Salin isi editor secara manual sebelum memuat source terbaru.');
      }
    }

    function handleSessionExpiry(message) {
      persistRecoveryDraft();
      sessionStorage.removeItem(SESSION_STORAGE_KEY);
      clearStoredEditAccess_();
      loseLease(message);
      state.session = null;
      elements.appView.hidden = true;
      elements.ssotIframeView.hidden = true;
      elements.activityView.hidden = true;
      elements.publishedView.hidden = true;
      elements.settingsView.hidden = true;
      elements.loginView.hidden = false;
      elements.userProfilePill.hidden = true;
      elements.newModuleButton.hidden = true;
      elements.logoutButton.hidden = true;
      showFormMessage(message);
    }

    function leaseMatchesSession_(session) {
      return Boolean(state.lease && state.lease.rowKey === session.rowKey);
    }

    function draftStorageKey_() {
      return DRAFT_STORAGE_PREFIX + [
        state.activeProject.course.key,
        state.activeProject.level,
        state.activeSession.session
      ].join('.');
    }

    function plainRichTextModel_(value) {
      return {
        text: value,
        runs: value ? [{
          start: 0,
          end: value.length,
          bold: false,
          italic: false,
          underline: false,
          strikethrough: false,
          link: ''
        }] : []
      };
    }

    function createRequestId_() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return String(Date.now()) + '-' + Math.random().toString(16).slice(2);
    }

    function formatTimestamp(value) {
      var timestamp = Date.parse(String(value || ''));
      return Number.isFinite(timestamp)
        ? new Date(timestamp).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' })
        : 'tidak diketahui';
    }

    function setEditorReadOnly(readOnly) {
      elements.sessionTopicInput.readOnly = readOnly;
      SclVisualEditor.setReadOnly(readOnly);
    }

    function setLeaseStatus(message, tone) {
      setStatusBadge(elements.leaseStatus, message, tone);
    }

    function setSaveStatus(message, tone) {
      setStatusBadge(elements.saveStatus, message, tone);
    }

    function setStatusBadge(element, message, tone) {
      element.textContent = message;
      element.classList.remove('active', 'warning', 'error');
      if (tone) {
        element.classList.add(tone);
      }
    }

    function showConflict(message, offerActions) {
      elements.conflictMessage.textContent = message;
      elements.conflictBanner.hidden = false;
      elements.copyChangesButton.hidden = !offerActions;
      elements.reloadLatestButton.hidden = !offerActions;
      if (offerActions) {
        setEditorReadOnly(true);
      }
      notifyError_('action-error', offerActions ? 'Tindakan diperlukan' : 'Operasi backend gagal', message);
    }

    function hideConflictBanner() {
      elements.conflictBanner.hidden = true;
      elements.conflictMessage.textContent = '';
    }

    function loadActivity_() {
      if (!state.session || elements.refreshActivityButton.disabled) { return Promise.resolve(); }
      elements.refreshActivityButton.disabled = true;
      elements.refreshActivityButton.textContent = 'Memuat…';
      renderRecordLoading_(elements.activityList, 'Memuat aktivitas terbaru…');
      return callListActivity(state.session.token, { cursor: 0, limit: 50 })
        .then(unwrapEnvelope)
        .then(function (page) {
          state.activityPage = page;
          renderActivityList_(page.items || []);
        })
        .catch(function (error) {
          renderRecordEmpty_(elements.activityList, error.message || 'Activity Log belum dapat dimuat.');
          notifyWarning_('activity-load', 'Activity Log belum tersedia', error.message || 'Coba refresh kembali.');
        })
        .finally(function () {
          elements.refreshActivityButton.disabled = false;
          elements.refreshActivityButton.textContent = 'Refresh Activity';
        });
    }

    function renderActivityList_(items) {
      elements.activityList.replaceChildren();
      if (!items.length) {
        renderRecordEmpty_(elements.activityList, 'Belum ada aktivitas yang dapat ditampilkan.');
        return;
      }
      var labels = {
        login_failed: 'Percobaan masuk gagal',
        login_success: 'Masuk ke aplikasi', session_resume: 'Melanjutkan sesi', logout: 'Keluar dari aplikasi',
        project_open: 'Membuka project', compose: 'Compose modul', lock_acquire: 'Mulai mengedit session',
        lock_stale_acquire: 'Mengaktifkan edit session', lock_release: 'Menutup session', autosave: 'Menyimpan perubahan',
        restore: 'Memulihkan revision', publish_reserved: 'Menyiapkan publish',
        publish_completed: 'Publish selesai', publish_failed: 'Publish gagal'
      };
      items.forEach(function (item) {
        var row = document.createElement('article');
        row.className = 'record-item';
        var copy = document.createElement('div');
        copy.className = 'record-item-copy';
        var title = document.createElement('div');
        title.className = 'record-item-title';
        var strong = document.createElement('strong');
        strong.textContent = item.editorLabel + ' · ' + (labels[item.eventType] || item.eventType);
        var badge = document.createElement('span');
        badge.className = 'record-badge ' + (item.status === 'SUCCESS' ? 'success' : 'failed');
        badge.textContent = item.status || 'UNKNOWN';
        title.append(strong, badge);
        var detail = document.createElement('p');
        var context = [item.courseKey, item.level ? 'Level ' + item.level : '', item.session ? 'Session ' + item.session : '']
          .filter(Boolean).join(' · ');
        detail.textContent = formatTimestamp(item.createdAt) + (context ? ' · ' + context : '') +
          (item.identityType === 'self-declared' ? ' · identitas input mandiri' : '') +
          (item.eventType === 'login_failed'
            ? ' · ' + String(item.attemptCount || 1) + ' percobaan dalam jendela agregasi'
            : '');
        copy.append(title, detail);
        row.appendChild(copy);
        elements.activityList.appendChild(row);
      });
    }

    function loadPublishedModules_() {
      if (!state.session || elements.refreshPublishedButton.disabled) { return Promise.resolve(); }
      elements.refreshPublishedButton.disabled = true;
      elements.refreshPublishedButton.textContent = 'Memuat…';
      renderRecordLoading_(elements.publishedList, 'Memuat published modules…');
      return callListPublishedModules(state.session.token, { cursor: 0, limit: 50 })
        .then(unwrapEnvelope)
        .then(function (page) {
          state.publishedPage = page;
          renderPublishedList_(page.items || []);
        })
        .catch(function (error) {
          renderRecordEmpty_(elements.publishedList, error.message || 'Published Modules belum dapat dimuat.');
          notifyWarning_('published-load', 'Publish history belum tersedia', error.message || 'Coba refresh kembali.');
        })
        .finally(function () {
          elements.refreshPublishedButton.disabled = false;
          elements.refreshPublishedButton.textContent = 'Refresh History';
        });
    }

    function renderPublishedList_(items) {
      elements.publishedList.replaceChildren();
      if (!items.length) {
        renderRecordEmpty_(elements.publishedList, 'Belum ada modul yang dipublikasikan. Compose tidak membuat file; hasil akan muncul setelah Publish ke Drive tersedia pada phase berikutnya.');
        return;
      }
      items.forEach(function (item) {
        var row = document.createElement('article');
        row.className = 'record-item';
        var copy = document.createElement('div');
        copy.className = 'record-item-copy';
        var title = document.createElement('div');
        title.className = 'record-item-title';
        var strong = document.createElement('strong');
        strong.textContent = courseLabel_(item.courseKey) + ' · Level ' + item.level + ' · v' + String(item.version).padStart(3, '0');
        title.appendChild(strong);
        if (item.isLatest) {
          var latest = document.createElement('span');
          latest.className = 'record-badge latest';
          latest.textContent = 'Latest';
          title.appendChild(latest);
        }
        var status = document.createElement('span');
        status.className = 'record-badge ' + (item.status === 'PUBLISHED' ? 'success' : (item.status === 'FAILED' ? 'failed' : 'pending'));
        status.textContent = item.status;
        title.appendChild(status);
        var detail = document.createElement('p');
        detail.textContent = item.publishedBy + ' · ' + formatTimestamp(item.completedAt || item.createdAt) +
          (item.pageCount ? ' · ' + item.pageCount + ' halaman' : '');
        copy.append(title, detail);
        row.appendChild(copy);
        if (item.openUrl) {
          var link = document.createElement('a');
          link.className = 'record-open-link';
          link.href = item.openUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'Buka di Drive ↗';
          row.appendChild(link);
        }
        elements.publishedList.appendChild(row);
      });
    }

    function loadDriveCapability_() {
      if (!state.session) { return Promise.resolve(); }
      elements.driveCapabilityBadge.textContent = 'Memeriksa Drive…';
      return callGetDrivePublishingCapability(state.session.token)
        .then(unwrapEnvelope)
        .then(function (capability) {
          state.driveCapability = capability;
          elements.driveCapabilityBadge.textContent = !capability.configured
            ? 'Drive belum dikonfigurasi'
            : (capability.canAddChildren ? 'Drive siap' : 'Izin Drive perlu diperiksa');
          elements.driveCapabilityBadge.classList.toggle('error', !capability.canAddChildren);
        })
        .catch(function () {
          elements.driveCapabilityBadge.textContent = 'Drive belum tersedia';
          elements.driveCapabilityBadge.classList.add('error');
        });
    }

    function renderRecordLoading_(container, message) {
      renderRecordEmpty_(container, message);
    }

    function renderRecordEmpty_(container, message) {
      container.replaceChildren();
      var empty = document.createElement('div');
      empty.className = 'record-empty';
      empty.textContent = message;
      container.appendChild(empty);
    }

    function courseLabel_(courseKey) {
      var courses = state.catalog && state.catalog.courses || [];
      var course = courses.filter(function (candidate) { return candidate.key === courseKey; })[0];
      return course ? course.label : String(courseKey || 'Course');
    }

    function handleNewModule_() {
      prepareNavigation().then(function () {
        state.activeCourse = null;
        state.activeProject = null;
        state.publisherResult = null;
        elements.levelPanel.hidden = true;
        elements.projectPanel.hidden = true;
        elements.sessionEditorPanel.hidden = true;
        elements.publisherPanel.hidden = true;
        switchNavView('dashboard');
        elements.courseGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    function handleLogout() {
      var token = state.session && state.session.token;
      setLoading(true, 'Keluar dari aplikasi…', true);
      closeActiveSession(true).finally(function () {
        state.session = null;
        state.catalog = null;
        state.activeCourse = null;
        state.activeProject = null;
        sessionStorage.removeItem(SESSION_STORAGE_KEY);
        clearStoredEditAccess_();
        sessionStorage.removeItem(ROUTE_STORAGE_KEY);
        elements.appView.hidden = true;
        elements.loginView.hidden = false;
        elements.levelPanel.hidden = true;
        elements.projectPanel.hidden = true;
        elements.ssotIframeView.hidden = true;
        elements.activityView.hidden = true;
        elements.publishedView.hidden = true;
        elements.settingsView.hidden = true;
        elements.userProfilePill.hidden = true;
        elements.newModuleButton.hidden = true;
        elements.logoutButton.hidden = true;
        if (token) {
          callLogoutEditor(token).catch(function () {});
        }
        setLoading(false);
      });
    }

    function togglePasscodeVisibility() {
      var reveal = elements.passcode.type === 'password';
      elements.passcode.type = reveal ? 'text' : 'password';
      elements.togglePasscode.textContent = reveal ? 'Sembunyikan' : 'Lihat';
      elements.togglePasscode.setAttribute('aria-label', reveal ? 'Sembunyikan passcode' : 'Tampilkan passcode');
    }

    function setConfigurationStatus(ready, overrideMessage) {
      state.configurationReady = Boolean(ready);
      elements.cardHeading.classList.toggle('ready', ready);
      elements.cardHeading.classList.toggle('error', !ready);
      elements.configurationStatus.textContent = overrideMessage || (ready
        ? 'Konfigurasi server siap'
        : 'Setup maintainer diperlukan');
      updateLoginButtonState_();
    }

    function updateLoginButtonState_() {
      elements.loginButton.disabled = !state.configurationReady ||
        !elements.passcode.value || !elements.editorLabel.value.trim();
    }

    function showFormMessage(message) {
      elements.formMessage.textContent = message || 'Terjadi kesalahan. Silakan coba kembali.';
      elements.formMessage.hidden = false;
      notifyError_('form-error', 'Belum dapat melanjutkan', elements.formMessage.textContent);
    }

    function hideFormMessage() {
      elements.formMessage.textContent = '';
      elements.formMessage.hidden = true;
    }

    function showWorkspaceMessage(message) {
      elements.workspaceMessage.textContent = message || 'Data level tidak dapat dimuat.';
      elements.workspaceMessage.hidden = false;
      notifyError_('workspace-error', 'Data belum dapat dimuat', elements.workspaceMessage.textContent);
    }

    function hideWorkspaceMessage() {
      elements.workspaceMessage.textContent = '';
      elements.workspaceMessage.hidden = true;
    }

    function showNotification_(options) {
      if (!elements.notificationCenter) { return ''; }
      var settings = options || {};
      var id = String(settings.id || ('notice-' + (++notificationSequence_)));
      var selector = '[data-notification-id="' + id.replace(/"/g, '') + '"]';
      var notice = elements.notificationCenter.querySelector(selector);
      if (!notice) {
        // Prevent notification stacking towers by trimming oldest transient notices
        var children = elements.notificationCenter.querySelectorAll('[data-notification-id]');
        if (children.length >= 2) {
          var removed = false;
          for (var i = 0; i < children.length; i += 1) {
            if (!children[i].classList.contains('loading')) {
              closeNotification_(children[i].dataset.notificationId);
              removed = true;
              break;
            }
          }
          if (!removed && children.length >= 2) {
            closeNotification_(children[0].dataset.notificationId);
          }
        }

        notice = document.createElement('section');
        notice.dataset.notificationId = id;
        var icon = document.createElement('span');
        icon.className = 'soft-notification-icon';
        icon.setAttribute('aria-hidden', 'true');
        var copy = document.createElement('span');
        copy.className = 'soft-notification-copy';
        var title = document.createElement('strong');
        var message = document.createElement('span');
        copy.append(title, message);
        var close = document.createElement('button');
        close.type = 'button';
        close.className = 'soft-notification-close';
        close.setAttribute('aria-label', 'Tutup notifikasi');
        close.textContent = '×';
        close.addEventListener('click', function () { closeNotification_(id); });
        notice.append(icon, copy, close);
        elements.notificationCenter.appendChild(notice);
      }

      if (notificationTimers_[id]) {
        clearTimeout(notificationTimers_[id]);
        delete notificationTimers_[id];
      }
      var tone = settings.tone || 'info';
      notice.className = 'soft-notification ' + tone;
      notice.setAttribute('role', tone === 'error' ? 'alert' : 'status');
      var iconNode = notice.querySelector('.soft-notification-icon');
      iconNode.replaceChildren();
      if (tone === 'loading') {
        var spinner = document.createElement('span');
        spinner.className = 'mini-spinner';
        iconNode.appendChild(spinner);
      } else {
        iconNode.textContent = tone === 'success' ? '✓' : (tone === 'error' ? '!' : (tone === 'warning' ? '!' : 'i'));
      }
      notice.querySelector('.soft-notification-copy strong').textContent = settings.title || 'Status aplikasi';
      var messageNode = notice.querySelector('.soft-notification-copy span');
      messageNode.textContent = settings.message || '';
      messageNode.hidden = !settings.message;
      notice.querySelector('.soft-notification-close').hidden = settings.closable === false;

      if (settings.autoCloseMs) {
        notificationTimers_[id] = setTimeout(function () {
          closeNotification_(id);
        }, settings.autoCloseMs);
      }
      return id;
    }

    function closeNotification_(id) {
      if (notificationTimers_[id]) {
        clearTimeout(notificationTimers_[id]);
        delete notificationTimers_[id];
      }
      if (!elements.notificationCenter) { return; }
      var notices = elements.notificationCenter.querySelectorAll('[data-notification-id]');
      Array.prototype.forEach.call(notices, function (notice) {
        if (notice.dataset.notificationId === String(id)) { notice.remove(); }
      });
    }

    function notifyLoading_(id, title, message) {
      return showNotification_({ id: id, tone: 'loading', title: title, message: message });
    }

    function notifySuccess_(id, title, message) {
      return showNotification_({ id: id, tone: 'success', title: title, message: message, autoCloseMs: 4200 });
    }

    function notifyWarning_(id, title, message) {
      return showNotification_({ id: id, tone: 'warning', title: title, message: message, autoCloseMs: 9000 });
    }

    function notifyError_(id, title, message, autoCloseMs) {
      return showNotification_({
        id: id,
        tone: 'error',
        title: title,
        message: message,
        autoCloseMs: typeof autoCloseMs === 'number' ? autoCloseMs : 8000
      });
    }

    function setLoading(loading, message, forceBlocking) {
      var shouldBlock = Boolean(forceBlocking || !state.session || elements.appView.hidden);
      if (loading && shouldBlock) {
        elements.loadingOverlayMessage.textContent = message || 'Menyiapkan aplikasi…';
        elements.loadingOverlay.hidden = false;
        return;
      }
      elements.loadingOverlay.hidden = true;
      if (loading) {
        notifyLoading_('background-operation', message || 'Memproses permintaan…', 'Aplikasi tetap terbuka selama server bekerja.');
      } else {
        closeNotification_('background-operation');
      }
    }

    function unwrapEnvelope(envelope) {
      if (envelope && envelope.ok) {
        return envelope.data;
      }
      var error = new Error(envelope && envelope.error ? envelope.error.message : 'Server tidak merespons.');
      error.code = envelope && envelope.error ? envelope.error.code : 'INTERNAL_ERROR';
      error.details = envelope && envelope.error ? (envelope.error.details || {}) : {};
      throw error;
    }

    function callGetAppBootstrap() {
      return appsScriptCall(function (runner) { runner.getAppBootstrap(); });
    }

    function callAuthenticateEditor(passcode, editorLabel) {
      return appsScriptCall(function (runner) { runner.authenticateEditor(passcode, editorLabel); });
    }

    function callResumeEditorSession(token) {
      return appsScriptCall(function (runner) { runner.resumeEditorSession(token); });
    }

    function callLogoutEditor(token) {
      return appsScriptCall(function (runner) { runner.logoutEditor(token); });
    }

    function callListCoursesAndLevels(token) {
      return appsScriptCall(function (runner) { runner.listCoursesAndLevels(token); });
    }

    function callLoadLevelProject(token, courseKey, level) {
      return appsScriptCall(function (runner) { runner.loadLevelProject(token, courseKey, level); }, 60000);
    }

    function callListActivity(token, request) {
      return appsScriptCall(function (runner) { runner.listActivity(token, request); });
    }

    function callRecordComposeAttempt(token, courseKey, level, result) {
      return appsScriptCall(function (runner) { runner.recordComposeAttempt(token, courseKey, level, result); });
    }

    function callListPublishedModules(token, request) {
      return appsScriptCall(function (runner) { runner.listPublishedModules(token, request); });
    }

    function callGetDrivePublishingCapability(token) {
      return appsScriptCall(function (runner) { runner.getDrivePublishingCapability(token); });
    }

    function callPreflightImages(token, urls) {
      return appsScriptCall(function (runner) { runner.preflightImages(token, urls); });
    }

    function callAcquireSessionLease(token, courseKey, level, session) {
      return appsScriptCall(function (runner) {
        runner.acquireSessionLease(token, courseKey, level, session);
      });
    }

    function callResumeSessionLease(token, leaseToken, editSessionId, courseKey, level, session) {
      return appsScriptCall(function (runner) {
        runner.resumeSessionLease(token, leaseToken, editSessionId, courseKey, level, session);
      });
    }

    function callHeartbeatSessionLease(token, leaseToken, courseKey, level, session) {
      return appsScriptCall(function (runner) {
        runner.heartbeatSessionLease(token, leaseToken, courseKey, level, session);
      }, 20000);
    }

    function callReleaseSessionLease(token, leaseToken, courseKey, level, session) {
      return appsScriptCall(function (runner) {
        runner.releaseSessionLease(token, leaseToken, courseKey, level, session);
      }, 15000);
    }

    function callSaveSessionPatch(token, leaseToken, request) {
      return appsScriptCall(function (runner) { runner.saveSessionPatch(token, leaseToken, request); });
    }

    function callGetSessionHistory(token, courseKey, level, session) {
      return appsScriptCall(function (runner) {
        runner.getSessionHistory(token, courseKey, level, session);
      });
    }

    function callRestoreSessionRevision(token, leaseToken, request) {
      return appsScriptCall(function (runner) {
        runner.restoreSessionRevision(token, leaseToken, request);
      });
    }

    function appsScriptCall(invoke, timeoutMs) {
      return new Promise(function (resolve, reject) {
        var settled = false;
        var timeout = setTimeout(function () {
          if (settled) { return; }
          settled = true;
          var error = new Error('Server belum merespons. Draft lokal tetap aman; silakan coba kembali.');
          error.code = 'CLIENT_TIMEOUT';
          error.retryable = true;
          reject(error);
        }, Math.max(5000, Number(timeoutMs) || RPC_TIMEOUT_MS));
        var finish = function (callback, value) {
          if (settled) { return; }
          settled = true;
          clearTimeout(timeout);
          callback(value);
        };
        var runner = google.script.run
          .withSuccessHandler(function (value) { finish(resolve, value); })
          .withFailureHandler(function () {
            var error = new Error('Koneksi ke server gagal. Draft lokal tetap aman; silakan coba kembali.');
            error.code = 'CONNECTION_FAILED';
            error.retryable = true;
            finish(reject, error);
          });
        try {
          invoke(runner);
        } catch (error) {
          finish(reject, error);
        }
      });
    }
  })();
</script>
