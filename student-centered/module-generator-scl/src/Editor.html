<script>
  (function () {
    'use strict';

    var PAGE_BREAK_SENTINEL = '[[SCL_PAGE_BREAK]]';
    var IMAGE_WIDTH_PREFIX = '#scl-width=';
    var DEFAULT_IMAGE_WIDTH_PERCENT = 69;
    var FIELD_DEFINITIONS = [
      { key: 'objectives', label: 'Objectives', icon: '◎' },
      { key: 'materials', label: 'Materials', icon: '✦' },
      { key: 'must_do', label: 'MUST DO', icon: '●' },
      { key: 'should_do', label: 'SHOULD DO', icon: '★' },
      { key: 'aspire_to_do', label: 'ASPIRE TO DO', icon: '🚀' },
      { key: 'self-check', label: 'SELF-CHECK', icon: '✓' },
      { key: 'kamus_coder', label: 'Tutor Says', icon: 'K' },
      { key: 'for_your_knowledge', label: 'Did You Know', icon: 'i' },
      { key: 'quiz_questions', label: 'Quiz', icon: '?' },
      { key: 'quiz_options', label: 'Quiz Options', icon: 'A' }
    ];
    var state = {
      fields: {}, tables: [], activeField: 'materials', readOnly: true, undo: [], redo: [],
      changeHandler: function () {}, selectionBlock: null, snapshotTimer: null,
      restoringView: false, rendering: false
    };
    var elements = {};

    function initialize(options) {
      state.changeHandler = options.onChange;
      elements.tabs = document.getElementById('editorFieldTabs');
      elements.blocks = document.getElementById('blockEditor');
      elements.preview = document.getElementById('componentPreview');
      elements.diagnostics = document.getElementById('editorDiagnostics');
      elements.fieldLabel = document.getElementById('activeEditorFieldLabel');
      elements.fieldTitle = document.getElementById('activeEditorFieldTitle');
      elements.undo = document.getElementById('undoEditorButton');
      elements.redo = document.getElementById('redoEditorButton');
      renderTabs_();
      document.querySelectorAll('[data-editor-command]').forEach(function (button) {
        button.addEventListener('mousedown', function (event) { event.preventDefault(); });
        button.addEventListener('click', function () { applyFormat_(button.dataset.editorCommand); });
      });
      elements.undo.addEventListener('click', undo_);
      elements.redo.addEventListener('click', redo_);
      document.getElementById('addTextBlockButton').addEventListener('click', function () {
        addBlock_({ type: 'text', model: plainModel_('') });
      });
      document.getElementById('addImageBlockButton').addEventListener('click', addImage_);
      var addTableButton = document.getElementById('addTableButton');
      if (addTableButton) { addTableButton.addEventListener('click', addTable_); }
      document.getElementById('addPageBreakButton').addEventListener('click', function () {
        addBlock_({ type: 'page-break', model: plainModel_(PAGE_BREAK_SENTINEL) });
      });
    }

    function load(fields, tables, layouts) {
      state.fields = {};
      state.tables = JSON.parse(JSON.stringify(tables || []));
      FIELD_DEFINITIONS.forEach(function (definition) {
        state.fields[definition.key] = splitModelIntoBlocks_(fields[definition.key] || plainModel_(''), definition.key);
      });
      applyLayouts_(layouts || []);
      state.undo = [];
      state.redo = [];
      state.activeField = 'materials';
      renderAll_();
    }

    function serializeTables() {
      return state.tables.map(function (entry) {
        return {
          tableId: entry.tableId,
          field: 'materials',
          orderIndex: entry.orderIndex,
          anchorHash: entry.anchorHash,
          table: JSON.parse(JSON.stringify(entry.table))
        };
      });
    }

    function splitModelIntoBlocks_(model, field) {
      var text = String(model.text || '');
      var blocks = [];
      var offset = 0;
      text.split('\n').forEach(function (line, lineIndex) {
        var start = offset;
        var end = start + line.length;
        var runs = (model.runs || []).map(function (run) {
          return Object.assign({}, run, {
            start: Math.max(start, run.start) - start,
            end: Math.min(end, run.end) - start
          });
        }).filter(function (run) { return run.end > run.start; });
        var lineModel = { text: line, runs: runs.length ? runs : (line ? plainModel_(line).runs : []) };
        var heading = markdownHeadingModel_(lineModel);
        if (heading) {
          lineModel = heading.model;
        }
        lineModel = markdownRichModel_(lineModel);
        var imageUrl = standaloneImageUrl_(lineModel.text);
        var image = Boolean(imageUrl);
        var imageWidth = image ? imageWidthFromModel_(lineModel) : 100;
        if (image && imageUrl !== line) {
          lineModel = {
            text: imageUrl,
            runs: [Object.assign(plainRun_(0, imageUrl.length), {
              link: imageMetadataLink_(imageUrl, imageWidth)
            })]
          };
        }
        blocks.push({
          id: field + ':line-' + lineIndex,
          sourceOrder: lineIndex,
          type: line === PAGE_BREAK_SENTINEL ? 'page-break' : (image ? 'image' : 'text'),
          model: lineModel,
          width: imageWidth,
          textStyle: heading ? heading.style : 'normal'
        });
        offset = end + 1;
      });
      return blocks.length ? blocks : [{ id: field + ':line-0', sourceOrder: 0, type: 'text', model: plainModel_(''), textStyle: 'normal' }];
    }

    function applyLayouts_(layouts) {
      var byKey = {}; layouts.forEach(function (layout) { byKey[layout.blockKey] = layout; });
      Object.keys(state.fields).forEach(function (field) {
        state.fields[field].forEach(function (block, index) {
          var layout = byKey[block.id]; block.layoutOrder = layout ? layout.orderIndex : index;
          if (layout && block.type === 'image' && layout.imageWidthPercent !== undefined) { block.width = layout.imageWidthPercent; }
          block.textStyle = layout && layout.attributes && layout.attributes.textStyle || block.textStyle || 'normal';
          block.keepTogether = Boolean(layout && layout.attributes && layout.attributes.keepTogether);
        });
        state.fields[field].sort(function (left, right) { return left.layoutOrder - right.layoutOrder; });
      });
    }

    function serializeLayouts() {
      var output = [];
      Object.keys(state.fields).forEach(function (field) {
        var blocks = state.fields[field];
        var canonicalKeys = new Map();
        blocks.slice().sort(function (left, right) { return left.sourceOrder - right.sourceOrder; }).forEach(function (block, sourceIndex) {
          canonicalKeys.set(block, field + ':line-' + sourceIndex);
        });
        blocks.forEach(function (block, index) {
          var attributes = {};
          if (block.keepTogether) { attributes.keepTogether = true; }
          if (block.type === 'text' && block.textStyle && block.textStyle !== 'normal') { attributes.textStyle = block.textStyle; }
          var layout = { schemaVersion: 'scl-layout/v1', blockKey: canonicalKeys.get(block), orderIndex: index, manualBreak: block.type === 'page-break', attributes: attributes };
          if (block.type === 'image') { layout.imageWidthPercent = block.width; }
          output.push(layout);
        });
      });
      return output;
    }

    function serialize() {
      var output = {};
      FIELD_DEFINITIONS.forEach(function (definition) {
        var text = '';
        var runs = [];
        (state.fields[definition.key] || []).slice().sort(function (left, right) {
          return left.sourceOrder - right.sourceOrder;
        }).forEach(function (block, index) {
          var model = block.model;
          if (index) { text += '\n'; }
          var offset = text.length;
          text += model.text;
          (model.runs || []).forEach(function (run) {
            var next = Object.assign({}, run, { start: run.start + offset, end: run.end + offset });
            if (block.type === 'image') {
              next.link = imageMetadataLink_(model.text, block.width);
            }
            runs.push(next);
          });
        });
        output[definition.key] = { text: text, runs: runs };
      });
      return output;
    }

    function renderTabs_() {
      elements.tabs.replaceChildren();
      FIELD_DEFINITIONS.forEach(function (definition) {
        var button = document.createElement('button');
        button.type = 'button';
        button.dataset.field = definition.key;
        button.innerHTML = '<span aria-hidden="true">' + definition.icon + '</span><span>' + definition.label + '</span>';
        button.addEventListener('click', function () {
          captureVisibleBlocks_();
          state.activeField = definition.key;
          renderAll_();
        });
        elements.tabs.appendChild(button);
      });
    }

    function renderAll_() {
      var viewAnchor = captureViewAnchor_();
      Array.prototype.forEach.call(elements.tabs.children, function (tab) {
        tab.classList.toggle('active', tab.dataset.field === state.activeField);
        tab.disabled = false;
      });
      var definition = FIELD_DEFINITIONS.filter(function (item) { return item.key === state.activeField; })[0];
      elements.fieldLabel.textContent = definition.label;
      elements.fieldTitle.textContent = definition.key === 'materials' ? 'Continuous Document' : 'Continuous Field';
      state.rendering = true;
      renderBlocks_();
      state.rendering = false;
      renderPreview_();
      updateControls_();
      restoreViewAnchor_(viewAnchor);
    }

    function captureViewAnchor_() {
      var editable = documentFlow_();
      var selection = window.getSelection();
      var selectionNode = selection && selection.rangeCount ? selection.getRangeAt(0).startContainer : null;
      var active = closestElement_(selectionNode, '[data-block-id]');
      var editingFlow = Boolean(editable && selectionNode && editable.contains(selectionNode));
      var scroller = elements.blocks.closest('.paged-authoring-frame');
      return {
        blockId: active ? active.dataset.blockId : '',
        blockTop: active ? active.getBoundingClientRect().top : null,
        selection: editingFlow ? captureSelectionOffsets_(editable) : null,
        editingFlow: editingFlow,
        windowY: window.scrollY,
        editorY: scroller ? scroller.scrollTop : 0,
        previewY: document.getElementById('sessionA4Preview')
          ? document.getElementById('sessionA4Preview').scrollTop
          : 0
      };
    }

    function restoreViewAnchor_(anchor) {
      if (!anchor) { return; }
      var preview = document.getElementById('sessionA4Preview');
      if (preview) { preview.scrollTop = anchor.previewY; }
      var scroller = elements.blocks.closest('.paged-authoring-frame');
      if (scroller) { scroller.scrollTop = anchor.editorY; }
      if (!anchor.editingFlow || state.readOnly) { return; }
      var editable = documentFlow_();
      if (!editable) { return; }
      state.restoringView = true;
      editable.focus({ preventScroll: true });
      restoreSelectionOffsets_(editable, anchor.selection);
      state.restoringView = false;
      var restoredBlock = anchor.blockId
        ? elements.blocks.querySelector('[data-block-id="' + anchor.blockId + '"]')
        : null;
      if (anchor.blockTop !== null && restoredBlock) {
        window.scrollBy(0, restoredBlock.getBoundingClientRect().top - anchor.blockTop);
      } else {
        window.scrollTo(0, anchor.windowY);
      }
    }

    function captureSelectionOffsets_(root) {
      var selection = window.getSelection();
      if (!selection.rangeCount) { return null; }
      var range = selection.getRangeAt(0);
      if (!root.contains(range.startContainer) || !root.contains(range.endContainer)) { return null; }
      var start = range.cloneRange();
      start.selectNodeContents(root); start.setEnd(range.startContainer, range.startOffset);
      var end = range.cloneRange();
      end.selectNodeContents(root); end.setEnd(range.endContainer, range.endOffset);
      return { start: start.toString().length, end: end.toString().length };
    }

    function textPositionAtOffset_(root, offset) {
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      var remaining = Math.max(0, Number(offset) || 0);
      var node = walker.nextNode();
      while (node) {
        if (remaining <= node.nodeValue.length) { return { node: node, offset: remaining }; }
        remaining -= node.nodeValue.length;
        node = walker.nextNode();
      }
      return { node: root, offset: root.childNodes.length };
    }

    function restoreSelectionOffsets_(root, offsets) {
      var total = root.textContent.length;
      offsets = offsets || { start: total, end: total };
      var start = textPositionAtOffset_(root, Math.min(total, offsets.start));
      var end = textPositionAtOffset_(root, Math.min(total, offsets.end));
      var range = document.createRange();
      range.setStart(start.node, start.offset); range.setEnd(end.node, end.offset);
      var selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
    }

    function renderBlocks_() {
      elements.blocks.replaceChildren();
      var flow = document.createElement('div');
      flow.className = 'document-flow-editor';
      flow.contentEditable = state.readOnly ? 'false' : 'true';
      flow.spellcheck = true;
      flow.dataset.placeholder = 'Mulai tulis dokumen…';
      flow.addEventListener('focus', function () { if (!state.restoringView) { pushSnapshot_(); } });
      flow.addEventListener('input', scheduleCapture_);
      flow.addEventListener('keydown', handleDocumentKeydown_);
      flow.addEventListener('blur', function (event) {
        if (!state.rendering && (!event.relatedTarget || !flow.contains(event.relatedTarget))) { captureVisibleBlocks_(); }
      });
      flow.addEventListener('paste', sanitizeDocumentPaste_);
      (state.fields[state.activeField] || []).forEach(function (block, index) {
        if (block.type === 'page-break') {
          var removeBreak = blockButton_('×', 'Hapus page break', function () { removeBlock_(index); });
          var divider = document.createElement('div');
          divider.className = 'document-atom document-page-break';
          divider.dataset.blockId = block.id;
          divider.dataset.blockType = 'page-break';
          divider.contentEditable = 'false';
          var rule = document.createElement('span'); rule.textContent = 'Manual page break';
          divider.append(rule, removeBreak);
          flow.appendChild(divider);
        } else if (block.type === 'image') {
          var figure = document.createElement('figure');
          figure.className = 'document-atom document-image-atom';
          figure.dataset.blockId = block.id;
          figure.dataset.blockType = 'image';
          figure.dataset.imageUrl = block.model.text;
          figure.contentEditable = 'false';
          figure.appendChild(renderImageControls_(block));
          flow.appendChild(figure);
        } else {
          var markdownHeading = markdownHeadingModel_(block.model);
          var textStyle = block.textStyle && block.textStyle !== 'normal'
            ? block.textStyle
            : (markdownHeading ? markdownHeading.style : 'normal');
          var renderModel = markdownHeading ? markdownHeading.model : block.model;
          var paragraph;
          var richTextRoot;
          if (textStyle === 'heading1' || textStyle === 'heading2' || textStyle === 'heading3') {
            paragraph = document.createElement(textStyle === 'heading1' ? 'h2' : (textStyle === 'heading2' ? 'h3' : 'h4'));
            paragraph.className = 'document-paragraph document-' + (textStyle === 'heading1' ? 'heading-1' : (textStyle === 'heading2' ? 'heading-2' : 'heading-3'));
            richTextRoot = paragraph;
          } else if (textStyle === 'bullet' || textStyle === 'numbered') {
            paragraph = document.createElement(textStyle === 'bullet' ? 'ul' : 'ol');
            paragraph.className = 'document-paragraph document-list document-list-' + textStyle;
            if (textStyle === 'numbered') {
              paragraph.start = listOrdinal_(state.fields[state.activeField], index, textStyle);
              paragraph.style.setProperty('--scl-list-offset', String(paragraph.start - 1));
            }
            richTextRoot = document.createElement('li');
            paragraph.appendChild(richTextRoot);
          } else {
            paragraph = document.createElement('p');
            paragraph.className = 'document-paragraph';
            richTextRoot = paragraph;
          }
          paragraph.dataset.blockId = block.id;
          paragraph.dataset.blockType = 'text';
          paragraph.dataset.textStyle = textStyle;
          paragraph.dataset.placeholder = 'Tulis konten…';
          renderRichText_(richTextRoot, renderModel);
          flow.appendChild(paragraph);
        }
      });
      elements.blocks.appendChild(flow);
      if (state.activeField === 'materials') {
        state.tables.forEach(function (entry) { elements.blocks.appendChild(renderTableEditor_(entry)); });
      }
    }

    function renderTableEditor_(entry) {
      var card = document.createElement('article');
      card.className = 'content-block table-editor-block' + (entry.anchorStatus === 'STALE' ? ' table-anchor-stale' : '');
      card.dataset.tableId = entry.tableId;
      var chrome = document.createElement('div'); chrome.className = 'block-chrome';
      var label = document.createElement('span');
      label.textContent = entry.anchorStatus === 'STALE' ? 'Table · anchor stale' : 'Semantic table';
      var actions = document.createElement('div');
      actions.append(
        blockButton_('+ Row', 'Tambah row tabel', function () { mutateTable_(entry, function () { entry.table.rows.push(entry.table.headers.map(function () { return ''; })); }); }),
        blockButton_('+ Col', 'Tambah kolom tabel', function () { mutateTable_(entry, function () { entry.table.headers.push('Header'); entry.table.alignments.push('left'); entry.table.rows.forEach(function (row) { row.push(''); }); }); }),
        blockButton_('Re-anchor', 'Tempatkan ulang tabel', function () { reanchorTable_(entry); }),
        blockButton_('×', 'Hapus tabel', function () { removeTable_(entry.tableId); })
      );
      chrome.append(label, actions); card.appendChild(chrome);
      var caption = document.createElement('input'); caption.type = 'text'; caption.value = entry.table.caption || '';
      caption.placeholder = 'Caption tabel (opsional)'; caption.disabled = state.readOnly;
      caption.setAttribute('aria-label', 'Caption tabel');
      caption.addEventListener('input', function () { entry.table.caption = sanitizeCell_(caption.value); notifyChange_(); renderPreview_(); });
      card.appendChild(caption);
      var wrapper = document.createElement('div'); wrapper.className = 'semantic-table-scroll';
      wrapper.appendChild(buildSemanticTable_(entry, true)); card.appendChild(wrapper);
      if (entry.anchorStatus === 'STALE') {
        var warning = document.createElement('p'); warning.className = 'table-warning';
        warning.textContent = 'TABLE_ANCHOR_STALE — pilih Re-anchor sebelum menyimpan atau mencetak.'; card.appendChild(warning);
      }
      return card;
    }

    function buildSemanticTable_(entry, editable) {
      var table = document.createElement('table'); table.className = 'semantic-table';
      if (entry.table.caption) { var caption = document.createElement('caption'); caption.textContent = entry.table.caption; table.appendChild(caption); }
      var thead = document.createElement('thead'); var headerRow = document.createElement('tr');
      entry.table.headers.forEach(function (value, columnIndex) {
        var th = document.createElement('th'); th.style.textAlign = entry.table.alignments[columnIndex] || 'left';
        if (editable) { th.appendChild(tableCellInput_(entry, value, function (next) { entry.table.headers[columnIndex] = next; })); } else { th.textContent = value; }
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow); table.appendChild(thead);
      var tbody = document.createElement('tbody');
      entry.table.rows.forEach(function (row, rowIndex) {
        var tr = document.createElement('tr');
        row.forEach(function (value, columnIndex) {
          var td = document.createElement('td'); td.style.textAlign = entry.table.alignments[columnIndex] || 'left';
          if (editable) { td.appendChild(tableCellInput_(entry, value, function (next) { entry.table.rows[rowIndex][columnIndex] = next; })); } else { td.textContent = value; }
          tr.appendChild(td);
        });
        if (editable) { var remove = document.createElement('button'); remove.type = 'button'; remove.textContent = '×'; remove.disabled = state.readOnly; remove.setAttribute('aria-label', 'Hapus row ' + (rowIndex + 1)); remove.addEventListener('click', function () { mutateTable_(entry, function () { entry.table.rows.splice(rowIndex, 1); }); }); tr.lastChild.appendChild(remove); }
        tbody.appendChild(tr);
      });
      table.appendChild(tbody); return table;
    }

    function tableCellInput_(entry, value, setter) {
      var input = document.createElement('input'); input.type = 'text'; input.value = value; input.disabled = state.readOnly;
      input.addEventListener('input', function () { setter(sanitizeCell_(input.value)); notifyChange_(); renderPreview_(); });
      return input;
    }

    function renderImageControls_(block) {
      var wrapper = document.createElement('div');
      wrapper.className = 'image-block-controls';
      wrapper.tabIndex = 0;
      wrapper.dataset.imageBlockId = block.id;
      var image = document.createElement('img');
      image.src = block.model.text;
      image.alt = 'Preview gambar URL';
      image.style.width = block.width + '%';
      image.addEventListener('error', function () { wrapper.classList.add('image-error'); });
      var range = document.createElement('input');
      range.type = 'range'; range.min = '25'; range.max = '100'; range.step = '1'; range.value = String(block.width);
      range.disabled = state.readOnly;
      range.setAttribute('aria-label', 'Lebar gambar persen');
      var value = document.createElement('span');
      value.textContent = block.width + '%';
      var decrease = imageActionButton_('−', 'Perkecil gambar', function () {
        resizeImageBlock_(block, block.width - 5, image, range, value);
      });
      decrease.classList.add('image-resize-handle');
      var increase = imageActionButton_('+', 'Perbesar gambar', function () {
        resizeImageBlock_(block, block.width + 5, image, range, value);
      });
      increase.classList.add('image-resize-handle');
      var replace = imageActionButton_('Replace', 'Ganti URL gambar', function () { replaceImageBlock_(block); });
      replace.dataset.imageAction = 'replace';
      var remove = imageActionButton_('Delete', 'Hapus gambar', function () {
        var blocks = state.fields[state.activeField] || [];
        var index = blocks.findIndex(function (item) { return item.id === block.id; });
        if (index >= 0) { removeBlock_(index); }
      });
      remove.dataset.imageAction = 'delete';
      range.addEventListener('input', function () {
        resizeImageBlock_(block, Number(range.value), image, range, value);
      });
      wrapper.addEventListener('click', function () { wrapper.classList.add('selected'); });
      wrapper.addEventListener('blur', function () { wrapper.classList.remove('selected'); });
      var actions = document.createElement('div'); actions.className = 'image-block-actions';
      actions.append(decrease, range, value, increase, replace, remove);
      wrapper.append(image, actions);
      return wrapper;
    }

    function imageActionButton_(label, ariaLabel, handler) {
      var button = document.createElement('button'); button.type = 'button'; button.textContent = label;
      button.setAttribute('aria-label', ariaLabel); button.disabled = state.readOnly;
      button.addEventListener('click', handler); return button;
    }

    function resizeImageBlock_(block, width, image, range, value) {
      block.width = Math.max(25, Math.min(100, Number(width) || 100));
      image.style.width = block.width + '%'; range.value = String(block.width); value.textContent = block.width + '%';
      block.model.runs = [Object.assign(plainRun_(0, block.model.text.length), {
        link: imageMetadataLink_(block.model.text, block.width)
      })];
      notifyChange_(); renderPreview_();
    }

    function replaceImageBlock_(block) {
      if (state.readOnly) { return; }
      var url = window.prompt('Ganti URL image HTTPS:', block.model.text);
      if (url === null) { return; }
      url = url.trim();
      if (!isSupportedImageUrl_(url)) {
        elements.diagnostics.hidden = false;
        elements.diagnostics.textContent = 'Image ditolak: gunakan URL HTTPS PNG/JPG/JPEG/WebP.';
        elements.diagnostics.classList.add('error'); return;
      }
      pushSnapshot_(); block.model = {
        text: url,
        runs: [Object.assign(plainRun_(0, url.length), { link: imageMetadataLink_(url, block.width) })]
      };
      renderAll_(); notifyChange_();
    }

    function renderPreview_() {
      elements.preview.replaceChildren();
      var blocks = state.fields[state.activeField] || [];
      blocks.forEach(function (block) {
        var component = document.createElement(block.type === 'page-break' ? 'div' : 'article');
        component.className = previewClass_(state.activeField, block);
        if (block.type === 'page-break') {
          component.textContent = 'Page break';
        } else if (block.type === 'image') {
          var img = document.createElement('img'); img.src = block.model.text; img.alt = ''; img.style.width = block.width + '%'; component.appendChild(img);
        } else {
          renderRichText_(component, block.model);
        }
        elements.preview.appendChild(component);
      });
      if (state.activeField === 'materials') {
        state.tables.forEach(function (entry) {
          paginateTableRows_(entry.table, entry.table.rows.map(function () { return 44; }), 220, 52).pages.forEach(function (rows, pageIndex) {
            var page = document.createElement('section'); page.className = 'table-preview-page';
            if (pageIndex) { page.dataset.continuation = 'true'; }
            var pageEntry = { table: Object.assign({}, entry.table, { rows: rows }) };
            page.appendChild(buildSemanticTable_(pageEntry, false)); elements.preview.appendChild(page);
          });
        });
      }
      var diagnostics = validate_();
      elements.diagnostics.textContent = diagnostics.length ? diagnostics.join(' · ') : '';
      elements.diagnostics.hidden = diagnostics.length === 0;
      elements.diagnostics.classList.toggle('error', diagnostics.length > 0);
    }

    function validate_() {
      var messages = [];
      (state.fields[state.activeField] || []).forEach(function (block) {
        if (block.type === 'image' && !isSupportedImageUrl_(block.model.text)) {
          messages.push('Image harus URL HTTPS PNG/JPG/JPEG/WebP');
        }
      });
      if (state.tables.some(function (entry) { return entry.anchorStatus === 'STALE'; })) {
        messages.push('TABLE_ANCHOR_STALE: Re-anchor tabel sebelum save/print');
      }
      return messages;
    }

    function captureVisibleBlocks_() {
      var flow = documentFlow_();
      if (!flow || !state.fields[state.activeField]) { return; }
      var previous = {};
      state.fields[state.activeField].forEach(function (block) { previous[block.id] = block; });
      var claimedIds = {};
      var blocks = [];
      Array.prototype.forEach.call(flow.childNodes, function (node) {
        if (node.nodeType === Node.TEXT_NODE && !String(node.nodeValue || '').trim()) { return; }
