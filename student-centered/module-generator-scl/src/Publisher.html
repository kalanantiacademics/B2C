<script>
  (function () {
    'use strict';

    var DEFAULT_MAX_ITERATIONS = 5;
    var TOPIC_SOFT_LIMIT = 80;
    var TOC_ITEMS_PER_PAGE = 12;
    var DEFAULT_IMAGE_TIMEOUT_MS = 10000;
    var DEFAULT_IMAGE_WIDTH_PERCENT = 69;
    var IMAGE_DECODE_CONCURRENCY = 6;
    var IMAGE_DECODE_RETRIES = 2;
    var IMAGE_RENDER_MAX_HEIGHT_PX = 610;
    var A4_CONTENT_INNER_WIDTH_PX = (18.38 - 0.5) * 96 / 2.54;
    var INS_URL = 'https://www.kalananti.id/scl-student';
    var COORDINATE_REGISTRY = Object.freeze({
      coverTitle: { xCm: 0.72, yCm: 10.31, widthCm: 19.57, heightCm: 2.46 },
      coverSubtitle: { xCm: 0.72, yCm: 12.77, widthCm: 19.57, heightCm: 1.82 },
      contentViewport: { xCm: 1.38, yCm: 3.22, widthCm: 18.38, heightCm: 23.86, paddingCm: 0.25 },
      sessionHeader: { xCm: 1.5, yCm: 1.28, widthCm: 8.2, heightCm: 1.22 },
      openerCopy: { xCm: 2.12, yCm: 2.05, widthCm: 16.8, heightCm: 24.6 },
      pageNumberLeft: { xCm: 0.99, yCm: 28, widthCm: 1.19, heightCm: 0.9 },
      pageNumberRight: { xCm: 18.93, yCm: 28.01, widthCm: 1.17, heightCm: 0.9 }
    });
    var lastResult = null;
    var assetInstance = 0;
    var imageDimensionCache = Object.create(null);
    var previewRenderToken = 0;
    var FIELD_ORDER = [
      ['objectives', 'Learning Objectives', 'objectives'],
      ['materials', 'Materials', 'materials'],
      ['must_do', 'MUST DO', 'must-do'],
      ['should_do', 'SHOULD DO', 'should-do'],
      ['aspire_to_do', 'ASPIRE TO DO', 'aspire'],
      ['self-check', 'SELF-CHECK', 'self-check'],
      ['kamus_coder', 'Tutor Says', 'tutor-says'],
      ['for_your_knowledge', 'Did You Know?', 'did-you-know'],
      ['quiz_questions', 'Quiz', 'quiz'],
      ['quiz_options', 'Pilihan Jawaban', 'quiz-options']
    ];

    function render(project, options) {
      options = options || {};
      var canvas = options.canvas || document.getElementById('publisherCanvas');
      var diagnosticsRoot = options.diagnostics || document.getElementById('publisherDiagnostics');
      var maxIterations = clampInteger_(options.maxIterations, 1, 10, DEFAULT_MAX_ITERATIONS);
      var diagnostics = [];
      assetInstance = 0;
      appendProjectDiagnostics_(project, diagnostics);
      var previousSignature = '';
      var stable = false;
      var result;

      for (var iteration = 1; iteration <= maxIterations; iteration += 1) {
        result = compose_(project, canvas, diagnostics);
        var signature = JSON.stringify({ tocPages: result.tocPages, anchors: result.anchors });
        if (options.forceTocInstability) { signature += ':' + iteration; }
        if (signature === previousSignature) { stable = true; result.iterations = iteration; break; }
        previousSignature = signature;
      }
      if (!stable) {
        diagnostics.push(blocking_('TOC_STABILIZATION_LIMIT', 'TOC belum stabil setelah ' + maxIterations + ' iterasi.'));
        result.iterations = maxIterations;
      }

      scanOverflow_(canvas, diagnostics);
      result.diagnostics = dedupeDiagnostics_(diagnostics);
      result.stable = stable;
      result.blocking = result.diagnostics.some(function (item) { return item.blocking; });
      renderDiagnostics_(diagnosticsRoot, result);
      canvas.dataset.paginationStable = String(stable);
      canvas.dataset.pageCount = String(result.pageCount);
      canvas.dataset.iterations = String(result.iterations);
      canvas.dataset.printReady = 'false';
      lastResult = result;
      return result;
    }

    function compose_(project, canvas, diagnostics) {
      canvas.replaceChildren();
      var pages = [];
      var anchors = {};
      var readySessions = (project.sessions || []).filter(function (session) {
        return session.rowKey && (session.status === 'Ready' || session.status === 'Locked');
      }).sort(function (left, right) { return Number(left.session) - Number(right.session); });
      if (readySessions.length < 12) {
        diagnostics.push(warning_('READY_SESSION_COUNT', 'Hanya ' + readySessions.length + ' session Ready yang masuk output.'));
      }

      pages.push(createPage_('cover', '', '', project, 1));
      pages.push(createPage_('blank', '', '', project, 2));
      pages.push(createPage_('copyright', '', '', project, 3));
      pages.push(createPage_('warning', '', '', project, 4));
      pages.push(createPage_('guide', '', '', project, 5, { guidePage: 1 }));
      pages.push(createPage_('guide', '', '', project, 6, { guidePage: 2 }));
      var tocPlan = buildTocPlan_(readySessions);
      var estimatedTocPages = tocPlan.length;
      for (var tocIndex = 0; tocIndex < estimatedTocPages; tocIndex += 1) {
        pages.push(createPage_('toc', '', '', project, pages.length + 1, { tocPage: tocIndex + 1, tocPages: estimatedTocPages }));
      }

      readySessions.forEach(function (session) {
        if (nextSide_(pages.length + 1) === 'right') {
          var previous = pages.length ? previousSessionHeader_(pages) : '';
          pages.push(createPage_('filler', previous || 'Kalananti SCL Module', '', project, pages.length + 1));
          if (!previous) { diagnostics.push(warning_('PRE_SESSION_1_FILLER', 'Filler sebelum Session 1 memerlukan visual QA.')); }
        }
        var opener = createPage_('opener', 'Session ' + session.session, fullTopic_(session), project, pages.length + 1);
        decorateOpener_(opener, session, project);
        opener.dataset.session = String(session.session);
        pages.push(opener);
        canvas.appendChild(opener);
        fitOpenerTitle_(opener.querySelector('.a4-opener-topic'));
        anchors[String(session.session)] = pages.length;
        if (fullTopic_(session).length > TOPIC_SOFT_LIMIT) {
          diagnostics.push(warning_('SESSION_TOPIC_TOO_LONG', 'Session ' + session.session + ' topic lebih dari 80 karakter; source dipertahankan utuh.'));
          opener.querySelector('.a4-opener-topic').classList.add('long-topic');
        }
        paginateSession_(pages, session, project, diagnostics, canvas, opener);
      });

      pages.push(createPage_('back-cover', '', '', project, pages.length + 1));
      pages.forEach(function (page) { canvas.appendChild(page); });
      numberPages_(pages);
      pages.filter(function (page) { return page.dataset.role === 'opener'; }).forEach(function (page) {
        anchors[page.dataset.session] = Number(page.querySelector('.a4-page-number').textContent);
      });
      var tocPages = fillToc_(pages, tocPlan, anchors);
      return { pages: pages, pageCount: pages.length, anchors: anchors, tocPages: tocPages, project: project };
    }

    function paginateSession_(pages, session, project, diagnostics, canvas, opener) {
      var blocks = mergeFlowContinuations_(deepFlattenFlow_(buildSessionBlocks_(session, project)));
      var page = opener || null;
      blocks.forEach(function (block) {
        if (!page || block.dataset.manualBreak === 'true') {
          page = createContentPage_(pages, session, project, canvas);
          if (block.dataset.manualBreak === 'true') { return; }
        }
        var body = page.querySelector('.a4-opener-flow, .a4-page-body');
        body.appendChild(block);
        if (bodyOverflows_(body)) {
          if (block.querySelectorAll && block.querySelectorAll(':scope > p').length > 1) {
            body.removeChild(block);
            page = splitParagraphSection_(pages, page, block, session, project, diagnostics, canvas);
            return;
          }
          body.removeChild(block);
          page = createContentPage_(pages, session, project, canvas);
          body = page.querySelector('.a4-page-body');
          block.dataset.continuation = 'true';
          body.appendChild(block);
          if (bodyOverflows_(body)) {
            var splitResult = splitStructuredBlock_(pages, page, block, session, project, diagnostics, canvas);
            if (splitResult) {
              page = splitResult;
            } else {
              diagnostics.push(blocking_('ATOMIC_BLOCK_OVERSIZE', 'Session ' + session.session + ' memiliki block yang melebihi satu halaman.'));
              block.classList.add('a4-block-oversize');
            }
          }
        }
      });
    }

    function deepFlattenFlow_(blocks) {
      var output = [];
      (blocks || []).forEach(function visit(block) {
        if (!block || block.nodeType !== 1) { return; }
        if (block.dataset.flowContainer === 'true') {
          Array.prototype.slice.call(block.children).forEach(visit);
        } else {
          output.push(block);
        }
      });
      return output;
    }

    function mergeFlowContinuations_(blocks) {
      var output = [];
      blocks.forEach(function (block) {
        var previous = output[output.length - 1];
        var mergeable = previous && block.dataset.mergeContinuation === 'true' &&
          previous.dataset.componentId && previous.dataset.componentId === block.dataset.componentId;
        if (!mergeable) { output.push(block); return; }
        var previousTarget = previous.querySelector('.bubble-content') || previous;
        var currentTarget = block.querySelector('.bubble-content') || block;
        Array.prototype.slice.call(currentTarget.children).forEach(function (child) { previousTarget.appendChild(child); });
      });
      return output;
    }

    function structuredBlockDescriptor_(block) {
      var content;
      var fixed = [];
      if (block.classList.contains('knowledge-bubble')) {
        content = block.querySelector(':scope > .bubble-content');
        fixed = Array.prototype.slice.call(block.children).filter(function (child) { return child !== content; });
      } else if (block.classList.contains('activity-card') || block.classList.contains('challenge-card')) {
        content = block;
        fixed = Array.prototype.slice.call(block.children).filter(function (child) {
          return child.classList.contains('activity-label') || child.classList.contains('challenge-label');
        });
      } else if (block.classList.contains('quiz-item')) {
        content = block;
        fixed = Array.prototype.slice.call(block.children).filter(function (child) { return child.classList.contains('quiz-header'); });
      } else if (block.classList.contains('step-container')) {
        content = block;
        fixed = Array.prototype.slice.call(block.children).filter(function (child) { return child.classList.contains('step-headpack'); });
      } else {
        return null;
      }
      var units = Array.prototype.slice.call(content.children).filter(function (child) {
        return fixed.indexOf(child) === -1;
      });
      return units.length > 1 ? { content: content, fixed: fixed, units: units } : null;
    }

    function createStructuredChunk_(source, descriptor, continuation) {
      var chunk = createSectionShell_(source, continuation, null);
      var target = chunk;
      descriptor.fixed.forEach(function (node) {
        var copy = node.cloneNode(true);
        if (continuation) {
          var label = copy.matches('.think-title, .activity-label, .challenge-label') ? copy : copy.querySelector('.step-badge');
          if (label) { label.textContent = label.textContent.replace(/\s+\(Lanjutan\)$/i, ''); }
        }
        chunk.appendChild(copy);
      });
      if (descriptor.content !== source) {
        target = descriptor.content.cloneNode(false);
        chunk.appendChild(target);
      }
      return { root: chunk, content: target };
    }

    function splitStructuredBlock_(pages, page, block, session, project, diagnostics, canvas) {
      var descriptor = structuredBlockDescriptor_(block);
      if (!descriptor) { return null; }
      var body = page.querySelector('.a4-page-body');
      body.removeChild(block);
      var chunkIndex = 0;
      var chunk = createStructuredChunk_(block, descriptor, false);
      body.appendChild(chunk.root);
      descriptor.units.forEach(function (unit) {
        chunk.content.appendChild(unit);
        if (!bodyOverflows_(body)) { return; }
        chunk.content.removeChild(unit);
        if (!chunk.content.children.length) {
          chunk.content.appendChild(unit);
          chunk.root.classList.add('a4-block-oversize');
          diagnostics.push(blocking_('STRUCTURED_UNIT_OVERSIZE', 'Session ' + session.session + ' memiliki satu unit semantic yang melebihi halaman.'));
          return;
        }
        page = createContentPage_(pages, session, project, canvas);
        body = page.querySelector('.a4-page-body');
        chunkIndex += 1;
        chunk = createStructuredChunk_(block, descriptor, true);
        chunk.root.dataset.continuationIndex = String(chunkIndex);
        body.appendChild(chunk.root);
        chunk.content.appendChild(unit);
        if (bodyOverflows_(body)) {
          chunk.root.classList.add('a4-block-oversize');
          diagnostics.push(blocking_('STRUCTURED_UNIT_OVERSIZE', 'Session ' + session.session + ' memiliki satu unit semantic yang melebihi halaman.'));
        }
      });
      return page;
    }

    function splitParagraphSection_(pages, page, block, session, project, diagnostics, canvas) {
      var paragraphs = Array.prototype.slice.call(block.querySelectorAll(':scope > p'));
      var heading = block.querySelector(':scope > h3');
      var section = createSectionShell_(block, false, heading);
      var body = page.querySelector('.a4-page-body');
      body.appendChild(section);
      paragraphs.forEach(function (paragraph) {
        var copy = paragraph.cloneNode(true);
        section.appendChild(copy);
        if (!bodyOverflows_(body)) { return; }
        section.removeChild(copy);
        if (!section.querySelector(':scope > p')) { body.removeChild(section); }
        page = createContentPage_(pages, session, project, canvas);
        body = page.querySelector('.a4-page-body');
        section = createSectionShell_(block, true, null);
        body.appendChild(section); section.appendChild(copy);
        if (bodyOverflows_(body)) {
          diagnostics.push(blocking_('PARAGRAPH_OVERSIZE', 'Session ' + session.session + ' memiliki paragraf yang melebihi satu halaman.'));
          section.classList.add('a4-block-oversize');
        }
      });
      return page;
    }

    function createSectionShell_(source, continuation, heading) {
      var section = document.createElement(source.tagName.toLowerCase());
      section.className = source.className;
      Array.prototype.forEach.call(source.attributes, function (attribute) {
        if (attribute.name !== 'class') { section.setAttribute(attribute.name, attribute.value); }
      });
      if (continuation) { section.dataset.continuation = 'true'; }
      if (heading) { section.appendChild(heading.cloneNode(true)); }
      return section;
    }

    function createContentPage_(pages, session, project, canvas) {
      var isSessionPreview = !pages.length || (pages[0].dataset.role === 'opener' && !pages.some(function (p) { return p.dataset.role === 'cover'; }));
      var side = isSessionPreview ? (pages.length % 2 === 1 ? 'right' : 'left') : nextSide_(pages.length + 1);
      var role = side === 'left' ? 'content-left' : 'content-right';
      var physicalPage = side === 'left' ? 2 : 1;
      var page = createPage_(role, 'Session ' + session.session, fullTopic_(session), project, physicalPage);
      page.dataset.session = String(session.session);
      pages.push(page);
      canvas.appendChild(page);
      return page;
    }

    function renderSessionPreview(project, session, options) {
      options = options || {};
      var renderToken = ++previewRenderToken;
      var canvas = options.canvas || document.getElementById('sessionA4Preview');
      var diagnosticsRoot = options.diagnostics || document.getElementById('sessionPreviewDiagnostics');
      var previousScrollTop = options.restoreScrollTop === undefined ? canvas.scrollTop : options.restoreScrollTop;
      var diagnostics = [];
      var pages = [];
      canvas.replaceChildren();
      assetInstance = 0;
      var opener = createPage_('opener', 'Session ' + session.session, fullTopic_(session), project, 2);
      decorateOpener_(opener, session, project);
      opener.dataset.session = String(session.session);
      pages.push(opener);
      canvas.appendChild(opener);
      fitOpenerTitle_(opener.querySelector('.a4-opener-topic'));
      if (fullTopic_(session).length > TOPIC_SOFT_LIMIT) {
        opener.querySelector('.a4-opener-topic').classList.add('long-topic');
        diagnostics.push(warning_('SESSION_TOPIC_TOO_LONG', 'Topic lebih dari 80 karakter; source tetap utuh.'));
      }
      paginateSession_(pages, session, project, diagnostics, canvas, opener);
      numberPages_(pages);
      scanOverflow_(canvas, diagnostics);
      var result = {
        pages: pages,
        pageCount: pages.length,
        diagnostics: dedupeDiagnostics_(diagnostics),
        stable: true,
        iterations: 1,
        blocking: diagnostics.some(function (item) { return item.blocking; }),
        project: project
      };
      renderDiagnostics_(diagnosticsRoot, result);
      canvas.dataset.pageCount = String(result.pageCount);
      canvas.dataset.paginationStable = 'true';
      canvas.scrollTop = Math.min(previousScrollTop, Math.max(0, canvas.scrollHeight - canvas.clientHeight));
      var fontsReadyPromise = options.fontsReadyPromise || (document.fonts && document.fonts.ready);
      if (!options.fontsReady && fontsReadyPromise) {
        Promise.resolve(fontsReadyPromise).then(function () {
          if (renderToken !== previewRenderToken) { return; }
          renderSessionPreview(project, session, Object.assign({}, options, {
            fontsReady: true,
            restoreScrollTop: canvas.scrollTop
          }));
        });
      }
      if (!options.imagesReady) {
        var pendingImages = Array.prototype.slice.call(canvas.querySelectorAll('.a4-image-block img'));
        if (pendingImages.length) {
          Promise.all(pendingImages.map(function (image) {
            return waitForImage_(image, DEFAULT_IMAGE_TIMEOUT_MS).catch(function () { return false; });
          })).then(function () {
            if (renderToken !== previewRenderToken) { return; }
            renderSessionPreview(project, session, Object.assign({}, options, {
              imagesReady: true,
              restoreScrollTop: canvas.scrollTop
            }));
          });
        }
      }
      return result;
    }

    function buildSessionBlocks_(session, project) {
      if (window.SclLegacyAdapter) {
        var adaptedSession = Object.assign({}, session, {
          courseKey: project && project.course ? project.course.key : session.courseKey
        });
        return window.SclLegacyAdapter.adaptSession(adaptedSession).components.filter(function (component) {
          return component.type !== 'objectives';
        }).map(function (component) {
          return buildLegacyComponent_(component);
        }).filter(Boolean);
      }
      var fields = session.fields || {};
      var blocks = [];
      FIELD_ORDER.forEach(function (definition) {
        if (definition[0] === 'materials' && (session.liveDraft || Array.isArray(session.materialBlocks))) {
          appendMaterialBlocks_(blocks, session.liveDraft ? buildLiveMaterialBlocks_(fields) : session.materialBlocks, definition);
          return;
        }
        var value = fields[definition[0]];
        var text = typeof value === 'string' ? value : (value && value.text || '');
        if (!text.trim()) { return; }
        var section = null;
        text.split('\n').forEach(function (line) {
          if (line === '[[SCL_PAGE_BREAK]]') {
            var pageBreak = document.createElement('div'); pageBreak.dataset.manualBreak = 'true'; blocks.push(pageBreak);
            section = null;
          } else if (line.trim()) {
            if (!section) {
              section = document.createElement('section');
              section.className = 'a4-content-block a4-' + definition[2];
              section.dataset.field = definition[0];
              var heading = document.createElement('h3'); heading.textContent = definition[1]; section.appendChild(heading);
              blocks.push(section);
            }
            renderLineWithImages_(section, line);
          }
        });
      });
      (session.tables || []).forEach(function (entry) {
        var rows = entry.table && entry.table.rows || [];
        var chunks = []; for (var index = 0; index < rows.length; index += 5) { chunks.push(rows.slice(index, index + 5)); }
        (chunks.length ? chunks : [[]]).forEach(function (chunk, chunkIndex) {
          var copy = { tableId: entry.tableId, table: Object.assign({}, entry.table, { rows: chunk }) };
          var table = buildTable_(copy); if (chunkIndex) { table.dataset.continuation = 'true'; } blocks.push(table);
        });
      });
      return blocks;
    }

    function buildLegacyComponent_(component) {
      var root;
      if (component.type === 'page-break') {
        root = document.createElement('div');
        root.dataset.manualBreak = 'true';
        return root;
      }
      if (component.type === 'image') {
        var widthPercent = clampInteger_(component.displayWidthPercent, 25, 100, DEFAULT_IMAGE_WIDTH_PERCENT);
        root = createImageBlock_({
          text: component.url,
          alt: component.alt,
          displayWidthPercent: widthPercent,
          preflightWidth: component.preflightWidth,
          preflightHeight: component.preflightHeight
        });
        root.classList.add('shot-card');
        root.dataset.field = component.field;
        root.dataset.componentId = component.id;
        return root;
      }
      if (component.type === 'objectives') {
        root = document.createElement('section');
        root.className = 'a4-content-block legacy-objectives';
        var objectives = document.createElement('ul');
        objectives.className = 'list-objective';
        component.items.forEach(function (item) {
          var li = document.createElement('li');
          renderRichTextContent_(li, item);
          objectives.appendChild(li);
        });
        root.appendChild(objectives);
      } else if (component.type === 'paragraph') {
        root = document.createElement('section');
        root.className = 'a4-content-block lesson-flow';
        var textStyle = String(component.textStyle || 'normal');
        var paragraph;
        var contentRoot;
        if (textStyle === 'heading1' || textStyle === 'heading2' || textStyle === 'heading3') {
          var fullText = String(component.model && component.model.text || component.text || '').trim();
          var colonIndex = fullText.indexOf(':');
          var badgeText = '';
          var titleText = fullText;
          if (colonIndex > 0 && colonIndex < 35) {
            badgeText = fullText.slice(0, colonIndex).trim();
            titleText = fullText.slice(colonIndex + 1).trim();
          } else if (/^(?:Tahap|Bagian|Langkah|Misi|Sesi|Level)\s+[A-Za-z0-9.]+/i.test(fullText)) {
            var m = fullText.match(/^((?:Tahap|Bagian|Langkah|Misi|Sesi|Level)\s+[A-Za-z0-9.]+)\s*[-—:]?\s*(.*)$/i);
            if (m && m[2]) {
              badgeText = m[1].trim();
              titleText = m[2].trim();
            }
          }

          if (badgeText) {
            var card = document.createElement('div');
            card.className = 'step-card ' + (textStyle === 'heading1' ? 'step-card-h1' : (textStyle === 'heading2' ? 'step-card-h2' : 'step-card-h3'));
            var badge = document.createElement('span');
            badge.className = 'step-badge';
            badge.textContent = badgeText;
            var headingEl = document.createElement(textStyle === 'heading1' ? 'h2' : (textStyle === 'heading2' ? 'h3' : 'h4'));
            headingEl.className = textStyle === 'heading1' ? 'text-heading-1' : (textStyle === 'heading2' ? 'text-heading-2' : 'text-heading-3');
            var titleOffset = fullText.indexOf(titleText);
            var titleModel = sliceLineModel_(component.model || { text: fullText, runs: [] }, titleOffset >= 0 ? titleOffset : 0, fullText.length);
            renderRichTextContent_(headingEl, titleModel);
            card.append(badge, headingEl);
            root.appendChild(card);
            return root;
          }

          paragraph = document.createElement(textStyle === 'heading1' ? 'h2' : (textStyle === 'heading2' ? 'h3' : 'h4'));
          paragraph.className = textStyle === 'heading1' ? 'text-heading-1' : (textStyle === 'heading2' ? 'text-heading-2' : 'text-heading-3');
          contentRoot = paragraph;
        } else if (textStyle === 'bullet' || textStyle === 'numbered') {
          paragraph = document.createElement(textStyle === 'bullet' ? 'ul' : 'ol');
          paragraph.className = 'text-list text-list-' + textStyle;
          if (textStyle === 'numbered') {
            paragraph.start = Math.max(1, Number(component.listOrdinal) || 1);
            paragraph.style.setProperty('--scl-list-offset', String(paragraph.start - 1));
          }
          contentRoot = document.createElement('li');
          paragraph.appendChild(contentRoot);
        } else {
          paragraph = document.createElement('p');
          paragraph.className = 'text-reading';
          contentRoot = paragraph;
        }
        renderRichTextContent_(contentRoot, component.model);
        root.appendChild(paragraph);
      } else if (component.type === 'code') {
        root = document.createElement('section');
        root.className = 'a4-content-block code-ide keep-together';
        var ideChrome = document.createElement('div');
        ideChrome.className = 'code-ide-chrome';
        var ideDots = document.createElement('span');
        ideDots.className = 'code-ide-dots';
        ideDots.setAttribute('aria-hidden', 'true');
        var ideLabel = document.createElement('span');
        ideLabel.className = 'code-ide-label';
        var rawLang = String(component.language || 'code').trim().toLowerCase();
        if (rawLang === 'lua' || rawLang === 'roblox') {
          ideLabel.textContent = 'ROBLOX LUA IDE';
        } else if (rawLang === 'python' || rawLang === 'py') {
          ideLabel.textContent = 'PYTHON IDE';
        } else {
          ideLabel.textContent = rawLang.toUpperCase() + ' IDE';
        }
        ideChrome.append(ideDots, ideLabel);
        var pre = document.createElement('pre');
        var code = document.createElement('code');
        code.textContent = String(component.code || '');
        pre.appendChild(code);
        root.append(ideChrome, pre);
      } else if (component.type === 'bubble') {
        root = document.createElement('section');
        root.className = 'a4-content-block think-bubble knowledge-bubble' +
          (component.treatment === 'did-you-know' ? ' warm' : '');
        var bubbleTitle = document.createElement('span');
        bubbleTitle.className = 'think-title';
        bubbleTitle.textContent = component.label;
        var bubbleContent = document.createElement('div');
        bubbleContent.className = 'bubble-content';
        var lines = Array.isArray(component.lines) && component.lines.length
          ? component.lines
          : splitRichTextLines_(component.model);
        var currentList = null;
        var currentListType = '';
