<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Planet – Kalananti</title>
    <script>
        if (!localStorage.getItem('studentName')) {
            window.location.href = 'index.html';
        } else if (!localStorage.getItem('classCode') && localStorage.getItem('className')) {
            localStorage.setItem('classCode', localStorage.getItem('className'));
        } else if (!localStorage.getItem('classCode')) {
            window.location.href = 'index.html';
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config={darkMode:['class', '[data-theme="dark"]'], theme:{extend:{fontFamily:{sans:['Space Grotesk','sans-serif'],display:['Orbitron','sans-serif']},colors:{'k-blue':'#265E9B','k-blue-d':'#1A4576','k-yellow':'#F9C013','k-green':'#339D9D'}}}}
    </script>
    <script>
        (()=>{ const s=localStorage.getItem('kalanantiTheme'); document.documentElement.setAttribute('data-theme',(s==='light'||s==='dark')?s:'light'); })();
    </script>
    <style>
        :root {
            --bg: #e0eeff; --bg2: #d4e8ff; --sky: #c6dfff;
            --neb1: rgba(38,94,155,0.09); --neb2: rgba(249,192,19,0.08);
            --text: #1a4576; --muted: #4d7daf;
            --nav: rgba(255,255,255,0.94); --nav-b: rgba(180,215,255,0.92);
            --chip: #ffffff; --chip-b: #cde0f8; --chip-t: #265E9B;
            --stars: 0.0;
            --path-fill: #f2c14e; --path-edge: #c89500; --path-glow: rgba(255,210,80,0.50); --path-dash: rgba(255,255,255,0.75);
            --node-done-bg: linear-gradient(135deg,#26c484,#13a070); --node-done-ring: #0d8455; --node-done-glow: rgba(26,196,132,0.55);
            --node-active-bg: linear-gradient(135deg,#ffcf2a,#f09c00); --node-active-ring: #c88000; --node-active-glow: rgba(255,195,30,0.80);
            --node-locked-bg: linear-gradient(135deg,#c8dff5,#aacbe8); --node-locked-ring: #90b8d8; --node-locked-glow: rgba(150,195,235,0.35);
            --label-bg: rgba(255,255,255,0.97); --label-b: rgba(180,215,255,0.92); --label-title: #1a4576; --label-muted: #5a7fa8;
            --card: rgba(255,255,255,0.94); --card-b: rgba(180,215,255,0.88);
        }
        html[data-theme="dark"] {
            --bg: #06101f; --bg2: #0d1e3e; --sky: #0a1830;
            --neb1: rgba(82,188,255,0.18); --neb2: rgba(249,192,19,0.14);
            --text: #ddeeff; --muted: #8aadd8;
            --nav: rgba(6,14,30,0.92); --nav-b: rgba(120,170,255,0.24);
            --chip: rgba(255,255,255,0.09); --chip-b: rgba(140,190,255,0.28); --chip-t: #cce0ff;
            --stars: 0.50;
            --path-fill: #4a9fd4; --path-edge: #2a6fa0; --path-glow: rgba(100,200,255,0.35); --path-dash: rgba(200,240,255,0.55);
            --node-done-bg: linear-gradient(135deg,#1dbf88,#13a070); --node-done-ring: #0f7a54; --node-done-glow: rgba(29,191,136,0.55);
            --node-active-bg: linear-gradient(135deg,#f9c013,#f08a00); --node-active-ring: #c88900; --node-active-glow: rgba(249,192,19,0.80);
            --node-locked-bg: linear-gradient(135deg,#2a4570,#1c3155); --node-locked-ring: #1a3060; --node-locked-glow: rgba(40,80,140,0.35);
            --label-bg: rgba(8,18,40,0.94); --label-b: rgba(100,160,255,0.30); --label-title: #eaf3ff; --label-muted: #7aacd8;
            --card: rgba(14,30,60,0.84); --card-b: rgba(140,190,255,0.22);
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{
            font-family:'Space Grotesk',sans-serif;
            background: radial-gradient(circle at 12% 8%,var(--neb1),transparent 34%),
                        radial-gradient(circle at 88% 14%,var(--neb2),transparent 30%),
                        linear-gradient(165deg,var(--bg) 0%,var(--bg2) 52%,var(--sky) 100%);
            color:var(--text); height:100dvh; min-height:100vh;
            overflow:hidden; display:flex; flex-direction:column;
            position:relative; isolation:isolate;
        }
        body::before{
            content:""; position:fixed; inset:0; pointer-events:none; z-index:-2; opacity:var(--stars);
            background-image:
                radial-gradient(circle at 10% 20%,rgba(255,255,255,0.9) 0 1px,transparent 1.8px),
                radial-gradient(circle at 76% 58%,rgba(255,255,255,0.75) 0 1px,transparent 1.6px),
                radial-gradient(circle at 48% 38%,rgba(255,255,255,0.6) 0 1px,transparent 1.4px),
                radial-gradient(circle at 22% 72%,rgba(255,255,255,0.5) 0 1px,transparent 1.2px),
                radial-gradient(circle at 88% 88%,rgba(255,255,255,0.45) 0 1px,transparent 1.2px),
                radial-gradient(circle at 62% 14%,rgba(255,255,255,0.55) 0 1px,transparent 1.4px);
            background-size:220px 220px,300px 300px,260px 260px,340px 340px,200px 200px,280px 280px;
        }
        /* Edge layer */
        .edge-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
        .edge-planet{position:absolute;margin:0;pointer-events:none;display:block;opacity:0.58;}
        .edge-left{left:0;transform-origin:left center;}
        .edge-right{right:0;transform-origin:right center;}
        .edge-float{position:absolute;margin:0;pointer-events:none;opacity:0.50;filter:drop-shadow(0 10px 18px rgba(0,0,0,0.18));}
        @keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-16px);}}
        /* Nav */
        .theme-nav{background:var(--nav);border-bottom:1px solid var(--nav-b);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:relative;z-index:30;}
        .theme-chip{background:var(--chip);border:1.5px solid var(--chip-b);color:var(--chip-t);}
        .nav-title{color:var(--text);} .nav-sub{color:var(--muted);}
        /* Map shell */
        .map-shell{flex:1;min-height:0;position:relative;z-index:10;overflow-y:auto;overflow-x:hidden;padding:0;margin:0;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(100,160,255,0.3) transparent;}
        .map-shell::-webkit-scrollbar{width:5px;} .map-shell::-webkit-scrollbar-thumb{background:rgba(100,160,255,0.3);border-radius:10px;}
        .map-stage{position:relative;width:100%;background:transparent;}
        /* SVG path */
        .path-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}
        /* Node */
        .path-node{position:absolute;transform:translate(-50%,-50%);z-index:5;cursor:pointer;width:100px;height:100px;display:block;}
        .node-btn{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:transform 0.18s cubic-bezier(0.175,0.885,0.32,1.275);}
        .node-btn::before{content:"";position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,0.42),rgba(255,255,255,0) 58%),radial-gradient(circle at 70% 72%,rgba(0,0,0,0.20),rgba(0,0,0,0) 45%);pointer-events:none;}
        .path-node:hover .node-btn{transform:translateY(-5px) scale(1.05);}
        /* States */
        .node-done .node-btn{background:var(--node-done-bg);box-shadow:0 0 0 5px var(--node-done-ring),0 14px 32px -8px var(--node-done-glow),0 7px 0 var(--node-done-ring);}
        .node-active .node-btn{background:var(--node-active-bg);box-shadow:0 0 0 5px var(--node-active-ring),0 14px 36px -8px var(--node-active-glow),0 7px 0 var(--node-active-ring);animation:pulseActive 2.5s ease-in-out infinite;}
        @keyframes pulseActive{0%,100%{box-shadow:0 0 0 5px var(--node-active-ring),0 14px 36px -8px var(--node-active-glow),0 7px 0 var(--node-active-ring);}50%{box-shadow:0 0 0 12px rgba(249,192,19,0.22),0 18px 44px -8px rgba(249,192,19,0.90),0 7px 0 var(--node-active-ring);}}
        .node-locked .node-btn{background:var(--node-locked-bg);box-shadow:0 0 0 4px var(--node-locked-ring),0 8px 20px -8px var(--node-locked-glow),0 4px 0 var(--node-locked-ring);cursor:default;}
        .path-node.node-locked:hover .node-btn{transform:none;}
        .node-icon{font-size:2.2rem;line-height:1;filter:drop-shadow(0 2px 5px rgba(0,0,0,0.32));}
        .node-locked .node-icon{opacity:0.45;}
        .node-num{position:absolute;top:-7px;right:-7px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,0.50);backdrop-filter:blur(4px);border:2px solid rgba(255,255,255,0.38);font-size:0.68rem;font-weight:900;color:white;display:grid;place-items:center;}
        .node-done .node-num{background:rgba(0,80,40,0.60);}
        .node-active .node-num{background:rgba(0,0,0,0.36);}
        /* Label */
        .node-label{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);background:var(--label-bg);border:1.5px solid var(--label-b);border-radius:1.2rem;padding:0.6rem 0.9rem;text-align:center;min-width:148px;max-width:178px;box-shadow:0 8px 24px -10px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none;}
        .node-label-title{font-family:'Orbitron',sans-serif;font-size:0.64rem;font-weight:700;letter-spacing:0.06em;color:var(--label-title);margin-bottom:3px;}
        .node-label-sub{font-size:0.62rem;line-height:1.35;color:var(--label-muted);}
        .node-active .node-label{border-color:rgba(249,192,19,0.72);box-shadow:0 12px 28px -12px rgba(249,192,19,0.50),inset 0 1px 0 rgba(255,255,255,0.55);}
        .node-done .node-label{border-color:rgba(29,191,136,0.55);}
        .node-locked .node-label{opacity:0.80;}
        /* Active ripple */
        .active-ripple::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid rgba(249,192,19,0.32);animation:rippleOut 2.2s ease-out infinite;}
        .active-ripple::after{content:"";position:absolute;inset:-26px;border-radius:50%;border:2px solid rgba(249,192,19,0.16);animation:rippleOut 2.2s ease-out infinite 0.5s;}
        @keyframes rippleOut{0%{opacity:0.9;transform:scale(0.82);}100%{opacity:0;transform:scale(1.4);}}
        /* Loading */
        #loading-state,#error-state{min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;}
        .loader-ring{width:80px;height:80px;border-radius:50%;border:6px solid rgba(100,180,255,0.15);border-top-color:rgba(100,180,255,0.85);animation:spin 1s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        /* Progress bar at top */
        .top-progress-bar{position:relative;z-index:40;}
        @media(max-width:860px){.path-node{width:84px;height:84px;}.node-icon{font-size:1.9rem;}.node-label{min-width:126px;}.node-label-title{font-size:0.58rem;}.node-label-sub{font-size:0.57rem;}}
        @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

        /* Mission Control Loader */
        #mission-loader {
            position: fixed; inset: 0;
            background: #020617;
            z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }
        #mission-loader.loaded {
            opacity: 0; visibility: hidden;
            pointer-events: none;
        }
        .loader-rocket {
            width: 140px; height: auto;
            max-height: 140px;
            object-fit: contain;
            animation: loaderFloat 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(249,192,19,0.5));
        }
        @keyframes loaderFloat { 
            0%, 100% { transform: translateY(0) rotate(-8deg); } 
            50% { transform: translateY(-30px) rotate(8deg); } 
        }
        .loader-bar { width: 280px; height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; margin-top: 40px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1); }
        .loader-progress { position: absolute; inset: 0; background: linear-gradient(90deg, #F9C013, #FFD700); width: 0%; animation: loaderFill 2s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
        @keyframes loaderFill { 0% { width: 0%; } 100% { width: 100%; } }
        /* Status Modal Redesign */
        .status-modal { position: fixed; inset: 0; background: rgba(2, 6, 12, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .status-modal.active { opacity: 1; pointer-events: auto; }
        .status-box { background: linear-gradient(165deg, #1e3a6a 0%, #0c1428 100%); border-radius: 3.5rem; padding: 4rem 3rem; width: 92%; max-width: 460px; text-align: center; transform: translateY(40px) scale(0.9); transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 40px 120px -20px rgba(0,0,0,0.85), inset 0 0 40px rgba(255,255,255,0.08); position: relative; overflow: hidden; }
        .status-modal.active .status-box { transform: translateY(0) scale(1); }
        
        .status-box::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.18), transparent 70%); pointer-events: none; }

        .status-icon { width: 100px; height: 100px; border-radius: 2.5rem; display: flex; items: center; justify-content: center; font-size: 3.5rem; margin: 0 auto 2rem; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); filter: drop-shadow(0 0 20px currentColor); animation: bounce 3s ease-in-out infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(5deg); } }
        
        .status-success { color: #4ADE80; border: 3px solid rgba(74, 222, 128, 0.4); box-shadow: 0 0 30px rgba(74, 222, 128, 0.2); }
        .status-error { color: #F87171; border: 3px solid rgba(248, 113, 113, 0.4); box-shadow: 0 0 30px rgba(248, 113, 113, 0.2); }
        .status-warning { color: #F9C013; border: 3px solid rgba(249, 192, 19, 0.4); box-shadow: 0 0 30px rgba(249, 192, 19, 0.2); }

        .status-btn { 
            position: relative; width: 100%; padding: 1.25rem; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.15em; color: #5A3F00;
            background: linear-gradient(180deg, #F9C013 0%, #E5AB00 100%); border-radius: 1.5rem; transition: all 0.2s;
            box-shadow: 0 6px 0 #B28400, 0 15px 30px -5px rgba(249, 192, 19, 0.4); border: none; cursor: pointer;
        }
        .status-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #B28400, 0 20px 40px -10px rgba(249, 192, 19, 0.5); }
        .status-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #B28400, 0 5px 10px -2px rgba(249, 192, 19, 0.3); }
    </style>
</head>
<body>
    <!-- Mission Control Loader -->
    <div id="mission-loader">
        <div class="relative">
            <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/828072b7-9198-4367-bce2-134b9fc8b486.png" class="loader-rocket" alt="Rocket">
            <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 w-20 h-4 bg-[#F9C013]/20 blur-xl rounded-full animate-pulse"></div>
        </div>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
        <div class="mt-8 text-center">
            <p class="font-display font-black text-sm uppercase tracking-[0.4em] text-[#F9C013] animate-pulse">Menyiapkan Misi...</p>
            <p class="mt-2 text-muted text-[10px] font-bold uppercase tracking-widest opacity-60">Initializing Mission Control System v2.0</p>
        </div>
    </div>
    <!-- Edge layer assets -->
    <div class="edge-layer">
        <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/e77f536b-e591-4ba8-b5b8-f5b2a3d3b33b.png" class="edge-planet edge-left" style="top:7%;width:min(28vw,210px);" alt="">
        <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/c08a7aed-567f-4e37-988c-1423a5b92643.png" class="edge-planet edge-left" style="top:64%;width:min(34vw,255px);transform:translateX(-32%);" alt="">
        <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/5f93f855-0466-47b3-ba85-bbaabbad7a2e.png" class="edge-planet edge-right" style="top:22%;width:min(30vw,240px);transform:translateX(32%);" alt="">
        <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/434fc5cb-e490-4e40-a921-d4519aa8a8a4.png" class="edge-planet edge-right" style="bottom:5%;width:min(34vw,275px);" alt="">
        <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/61f06160-989d-402e-be1b-eb1891afa86b.png" class="edge-float" style="left:10%;top:18%;width:100px;animation:floatY 7s ease-in-out infinite;" alt="">
        <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/904cb9e9-ecd1-4731-a1ef-fa6a0bd50527.png" class="edge-float" style="right:12%;top:56%;width:115px;animation:floatY 8s ease-in-out infinite 1.5s;" alt="">
        <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/9b916b05-86ed-4509-aef6-e640606f3542.png" class="edge-float" style="left:16%;bottom:12%;width:106px;animation:floatY 6s ease-in-out infinite 0.9s;" alt="">
    </div>

    <!-- ── Nav ── -->
    <nav class="theme-nav w-full px-4 md:px-6 py-3.5 flex justify-between items-center shadow-sm z-50 sticky top-0">
        <div class="flex items-center gap-3 md:gap-4">
            <button onclick="window.location.href='dashboard.html'" class="theme-chip w-11 h-11 rounded-full flex items-center justify-center transition-all hover:-translate-x-0.5">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div>
                <p id="nav-course-title" class="nav-title font-black text-base md:text-lg">🎮 Roblox Studio</p>
                <p class="nav-sub text-[10px] md:text-xs font-black uppercase tracking-[0.18em]">Peta Planet Belajar</p>
            </div>
        </div>
        <div class="flex items-center gap-2 md:gap-3">
            <button id="theme-toggle" onclick="toggleTheme()" class="theme-chip px-3.5 py-2 rounded-2xl font-black text-xs sm:text-sm uppercase tracking-wider flex items-center gap-2 transition-all hover:-translate-y-0.5">
                <span id="theme-toggle-icon">🌙</span>
                <span id="theme-toggle-text" class="hidden sm:inline">Dark</span>
            </button>
            <div class="theme-chip hidden sm:flex items-center gap-3 p-1 pr-4 rounded-[2rem] shadow-sm">
                <div class="w-9 h-9 rounded-full overflow-hidden bg-blue-50"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User"></div>
                <span id="nav-user-name" class="nav-title font-bold text-sm">Memuat...</span>
            </div>
        </div>
    </nav>

    <!-- ── Progress strip ── -->
    <div class="top-progress-bar px-4 md:px-8 py-3 flex items-center gap-5" style="background:var(--card);border-bottom:1px solid var(--card-b);">
        <p class="text-xs font-black uppercase tracking-widest shrink-0" style="color:var(--muted)">Progress:</p>
        <div class="flex-1 h-3 rounded-full overflow-hidden" style="background:rgba(255,255,255,0.08);border:1px solid var(--card-b)">
            <div id="top-prog-bar" class="h-full rounded-full bg-gradient-to-r from-k-green to-teal-400 transition-all duration-1000" style="width:8%"></div>
        </div>
        <p id="top-prog-text" class="text-xs font-black shrink-0" style="color:var(--muted)">Orbit 1/8</p>
    </div>

    <!-- ── Map ── -->
    <main class="map-shell">
        <div id="loading-state">
            <div class="loader-ring"></div>
            <p class="font-black tracking-widest text-sm uppercase" style="color:var(--muted)">Menyusun Peta Orbit...</p>
        </div>
        <div id="error-state" style="display:none">
            <span style="font-size:3rem">😵</span>
            <h3 class="text-2xl font-black" style="color:var(--text)">Gagal Memuat</h3>
            <p style="color:var(--muted);font-weight:700">Cek koneksi dan coba lagi.</p>
            <button onclick="loadSessions()" class="mt-4 bg-k-blue text-white font-black px-8 py-4 rounded-2xl shadow-[0_6px_0_0_#1A4576] active:translate-y-1 active:shadow-none transition-all">Coba Lagi</button>
        </div>
        <section id="map-section" style="display:none">
            <div id="path-container" class="map-stage"></div>
        </section>
    </main>

    <!-- Status Modal -->
    <div id="status-modal" class="status-modal">
        <div class="status-box">
            <div id="status-icon" class="status-icon">🚀</div>
            <h3 id="status-title" class="font-display font-black text-3xl mb-4 tracking-tight uppercase" style="background: linear-gradient(90deg, #F9C013, #FF9D00); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Status Misi</h3>
            <p id="status-message" class="text-lg leading-relaxed mb-10 font-bold" style="color:#ddeeff">Pesan status di sini...</p>
    <button onclick="document.getElementById('status-modal').classList.remove('active')" class="status-btn px-10 py-5">SIAP, KAPTEN! 🛰️</button>
        </div>
    </div>

    <script>
    const STUDENT_API_URL = 'https://script.google.com/macros/s/AKfycby7AP62UmvDpvCnEsIOqcj6FDAtFG_5_A_NzgcQ3IDnrdWM80ikZPdyrk9lJNWUCCwKfg/exec';
    const WEB_APP_BASE = STUDENT_API_URL;
    let MAX_LESSONS=12;
    const COURSES={
        roblox:{sheet:'B2C_RobloxStudio_INS',label:'Roblox Studio',emoji:'🎮',desc:['Mengenal Roblox Studio dan membuat jalur Obby sederhana.','Menggunakan Plugin F3X, 3D Text, dan GapFill.','Membuat pemandangan terra menggunakan Terrain Tools.','Menciptakan efek pencahayaan dengan Lighting Tools.','Membuat sistem Teams dan Checkpoint tanpa coding!','Merancang rintangan seru & publish game ke Roblox.','Membuat pintu otomatis berengsel dengan Hinge Constraint.','Pintu otomatis dan Kincir Angin berputar terus!']},
        scratch:{sheet:'B2C_Scratch_INS',label:'Scratch',emoji:'🐱',desc:['Mengenal Scratch dan antarmuka editor yang seru.','Membuat Sprite, Kostum dan Gerakan dasar.','Belajar Variabel dan Kondisi if-then.','Membuat Loop, Animasi dan Efek keren.','Menambahkan Suara dan Efek visual.','Membuat Proyek Game Sederhanamu sendiri.','Interaksi dan Event handling antar karakter.','Publikasi dan Berbagi Proyekmu ke dunia!']}
    };
    const PLANET_NAMES=['Aurora','Ignis','Aqua','Terra','Nimbus','Voltis','Nova','Zenith'];
    const PLANET_ICONS=['🌌','🔥','🌊','🌍','☁️','⚡','🌟','🚀'];
    const THEME_KEY='kalanantiTheme';

    function updateThemeToggle(t){
        const i=document.getElementById('theme-toggle-icon'), tx=document.getElementById('theme-toggle-text');
        if(i) i.textContent=t==='dark'?'🌙':'☀️';
        if(tx) tx.textContent=t==='dark'?'Dark':'Light';
    }
    function applyTheme(t,persist=true){
        const v=t==='light'?'light':'dark';
        document.documentElement.setAttribute('data-theme',v);
        updateThemeToggle(v);
        if(persist) try{localStorage.setItem(THEME_KEY,v);}catch(e){}
    }
    function toggleTheme(){
        const cur=document.documentElement.getAttribute('data-theme')||'dark';
        applyTheme(cur==='dark'?'light':'dark');
        if(Array.isArray(lessonCache)) renderPath(lessonCache);
        else loadSessions();
    }

    const selectedCourse=localStorage.getItem('selectedCourse')||'roblox';
    const courseData=COURSES[selectedCourse]||COURSES.roblox;
    applyTheme(document.documentElement.getAttribute('data-theme')||'light',false);

    const navTitle=document.getElementById('nav-course-title');
    if(navTitle) navTitle.textContent=`${courseData.emoji} ${courseData.label}`;

    // Update profile name
    const studentNameLoc = localStorage.getItem('studentName') || 'Kapten';
    const userNameSpan = document.getElementById('nav-user-name');
    if (userNameSpan) userNameSpan.textContent = studentNameLoc;

    // Progress strip
    const currentSession=parseInt(localStorage.getItem('currentSession')||'1',10);
    function updateProgressUI(totalLessons) {
        const progPct = Math.max(8, Math.round((currentSession - 1) / totalLessons * 100));
        const bar = document.getElementById('top-prog-bar');
        const text = document.getElementById('top-prog-text');
        if (bar) bar.style.width = progPct + '%';
        if (text) text.textContent = `Orbit ${currentSession}/${totalLessons}`;
    }
    updateProgressUI(MAX_LESSONS);

    let lessonCache=null;

    function syncShellHeight(){
        const shell=document.querySelector('.map-shell');
        const nav=document.querySelector('.theme-nav');
        const strip=document.querySelector('.top-progress-bar');
        if(!shell) return;
        const navH=nav?nav.offsetHeight:0;
        const stripH=strip?strip.offsetHeight:0;
        const viewH=window.visualViewport?window.visualViewport.height:window.innerHeight;
        shell.style.height=`${Math.max(320,Math.floor(viewH-navH-stripH))}px`;
    }
    syncShellHeight();
    if(window.visualViewport) window.visualViewport.addEventListener('resize',syncShellHeight);

    async function loadSessions(refetch=false){
        const loadEl=document.getElementById('loading-state');
        const mapEl=document.getElementById('map-section');
        const errEl=document.getElementById('error-state');
        if(!refetch&&Array.isArray(lessonCache)){renderPath(lessonCache);loadEl.style.display='none';mapEl.style.display='block';errEl.style.display='none';return;}
        loadEl.style.display='flex';mapEl.style.display='none';errEl.style.display='none';
        try{
            const res=await fetch(WEB_APP_BASE+'?sheet='+courseData.sheet);
            const raw=await res.json();
            
            const getSession = (r, idx) => {
                let s = parseInt(r['Session'] || r['session'] || r['Sesi'] || r.col_2 || r.col_1, 10);
                if (isNaN(s)) s = idx + 1;
                return s;
            };

            const uniqueMap = new Map();
            raw.forEach((r, idx) => {
                const s = getSession(r, idx);
                if (!isNaN(s) && s >= 1) {
                    if (!uniqueMap.has(s)) {
                        r._sessNum = s;
                        uniqueMap.set(s, r);
                    }
                }
            });
            const lessons = Array.from(uniqueMap.values()).sort((a,b)=>a._sessNum - b._sessNum);
            
            MAX_LESSONS = lessons.length > 0 ? lessons.length : 12;
            updateProgressUI(MAX_LESSONS);

            lessonCache=lessons;
            renderPath(lessons);
            loadEl.style.display='none';mapEl.style.display='block';
        }catch(err){
            console.error('[Sessions] Error:', err);
            document.getElementById('error-state').style.display='flex';
            document.getElementById('loading-state').style.display='none';
        } finally {
            setTimeout(() => {
                document.getElementById('mission-loader').classList.add('loaded');
            }, 800);
        }
    }

    function buildPath(pts,W,H){
        let d=`M ${pts[0].x} ${pts[0].y}`;
        for(let i=1;i<pts.length;i++){
            const p0=pts[i-1],p1=pts[i];
            const distY=Math.abs(p1.y-p0.y);
            const c1x=p0.x,c1y=p0.y+distY*0.48;
            const c2x=p1.x,c2y=p1.y-distY*0.48;
            d+=` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p1.x} ${p1.y}`;
        }
        const defId=`pg-${Date.now()}`;
        return `
        <svg class="path-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" style="width:100%;height:100%;">
            <defs>
                <linearGradient id="${defId}" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="var(--path-fill)" stop-opacity="0.7"/>
                    <stop offset="50%" stop-color="var(--path-fill)" stop-opacity="1"/>
                    <stop offset="100%" stop-color="var(--path-fill)" stop-opacity="0.7"/>
                </linearGradient>
            </defs>
            <path d="${d}" stroke="var(--path-glow)" stroke-width="88" fill="none" stroke-linecap="round" opacity="0.38"/>
            <path d="${d}" stroke="var(--path-edge)" stroke-width="54" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="${d}" stroke="url(#${defId})" stroke-width="42" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="${d}" stroke="var(--path-dash)" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="16 22"/>
        </svg>`;
    }

    function renderPath(lessons){
        const container=document.getElementById('path-container');
        if(!Array.isArray(lessons)||lessons.length===0){
            container.innerHTML='<div style="height:500px;display:flex;align-items:center;justify-content:center"><div style="background:var(--label-bg);border:1px solid var(--label-b);border-radius:1.5rem;padding:1.5rem 2rem;font-weight:900;font-size:0.9rem;text-transform:uppercase;letter-spacing:0.15em;color:var(--label-muted)">Belum ada sesi tersedia</div></div>';
            return;
        }
        const W=Math.max(container.clientWidth||800,680);
        const isNarrow=W<860;
        const topPad=isNarrow?180:200;
        const rowGap=isNarrow?228:248;
        const bottomPad=isNarrow?340:380;
        const H=Math.max(isNarrow?1200:1380,topPad+(lessons.length-1)*rowGap+bottomPad);
        container.style.height=`${H}px`;

        const leftLane=isNarrow?22:16;
        const rightLane=isNarrow?78:84;
        const jitter=isNarrow?[0,0,0,0]:[2,-2,1,-1];
        const pts=lessons.map((lesson,idx)=>{
            const lane=idx%2===0?leftLane:rightLane;
            const xPct=Math.max(10,Math.min(90,lane+jitter[idx%jitter.length]));
            return{x:(xPct/100)*W, y:topPad+idx*rowGap, xPct, lesson};
        });

        const pathPts=pts.map(p=>({x:p.x,y:p.y}));
        let html=buildPath(pathPts,W,H);

        const attSessVal = parseInt(localStorage.getItem('attendanceSession'), 10);
        const curSess = !isNaN(attSessVal) && attSessVal > 0 ? attSessVal : parseInt(localStorage.getItem('currentSession')||'1',10);
        const isAdmin=localStorage.getItem('isAdmin')==='true';

        // Add star decorations along path
        pts.forEach((pt,idx)=>{
            if(idx<pts.length-1){
                const next=pts[idx+1];
                const mx=(pt.x+next.x)/2, my=(pt.y+next.y)/2;
                html+=`<div style="position:absolute;left:${mx}px;top:${my}px;transform:translate(-50%,-50%);font-size:0.85rem;opacity:0.55;pointer-events:none;z-index:3;">✦</div>`;
            }
        });

        pts.forEach((pt,idx)=>{
            const sNum = parseInt(pt.lesson['Session'] || pt.lesson['session'] || pt.lesson['Sesi'] || pt.lesson.col_2 || pt.lesson.col_1, 10) || (idx + 1);
            const desc=courseData.desc[sNum-1]||`Sesi ${sNum}`;
            const pName=PLANET_NAMES[(sNum-1)%PLANET_NAMES.length];
            const pIcon=PLANET_ICONS[(sNum-1)%PLANET_ICONS.length];
            const shortDesc=desc.length>42?desc.slice(0,39)+'…':desc;
            let state='locked', icon='🔒';
            if(sNum<curSess){state='done';icon='✅';}
            else if(sNum===curSess){state='active';icon=pIcon;}
            // Admin: unlock visually all sessions above current
            if(isAdmin && state==='locked'){state='active';icon=pIcon;}
            // All nodes clickable; lock message enforced inside goToLesson()
            const clickable=`onclick="goToLesson(${sNum})"`;
            const ripple=state==='active'?'active-ripple':'';
            html+=`
            <div class="path-node node-${state} ${ripple}" style="left:${pt.xPct}%;top:${pt.y}px" ${clickable} title="Planet ${pName} — Sesi ${sNum}">
                <div class="node-btn">
                    <div class="node-num">${sNum}</div>
                    <span class="node-icon">${icon}</span>
                </div>
                <div class="node-label">
                    <p class="node-label-title">SESI ${sNum} · ${pName}</p>
                    <p class="node-label-sub">${shortDesc}</p>
                </div>
            </div>`;
        });
        container.innerHTML=html;
    }

    function showStatusPopup(type, title, message) {
        const modal = document.getElementById('status-modal');
        const icon = document.getElementById('status-icon');
        const titleEl = document.getElementById('status-title');
        const msgEl = document.getElementById('status-message');
        
        icon.className = 'status-icon ' + (type === 'success' ? 'status-success' : (type === 'error' ? 'status-error' : 'status-warning'));
        icon.innerText = type === 'success' ? '✅' : (type === 'error' ? '❌' : '🛸');
        titleEl.innerText = title;
        msgEl.innerText = message;
        
        modal.classList.add('active');
    }

    function goToLesson(n){
        const attSessVal = parseInt(localStorage.getItem('attendanceSession'), 10);
        const curSess = !isNaN(attSessVal) && attSessVal > 0 ? attSessVal : parseInt(localStorage.getItem('currentSession')||'1',10);
        const isAdm=localStorage.getItem('isAdmin')==='true';
        
        let isAllowed = (n <= curSess) || isAdm;
        
        if(!isAllowed){
            showStatusPopup('warning', 'MASIH KE-GEMBOK! 🔒', 'Ayo selesaikan misi di sesi sebelumnya dulu bersama pengajar untuk membuka materi ini! Semangat ya! 🚀');
            return;
        }
        localStorage.setItem('activeLesson',n);
        window.location.href='materials.html';
    }

    let resizeTimer;
    window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{syncShellHeight();if(Array.isArray(lessonCache))renderPath(lessonCache);},200);});

    loadSessions();
    </script>
</body>
</html>
