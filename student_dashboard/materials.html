<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalananti Learning - Planet Suede</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Quicksand', 'sans-serif'] },
                    colors: {
                        'kalananti-blue': '#265E9B',
                        'kalananti-blue-dark': '#1A4576',
                        'kalananti-yellow': '#F9C013',
                        'ruangguru-green': '#339D9D',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F4F9FF;
            background-image: radial-gradient(at 0% 0%, rgba(38, 94, 155, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(51, 157, 157, 0.05) 0px, transparent 50%);
            color: #265E9B;
            overflow: hidden;
        }
        .card-shadow {
            box-shadow: 0 20px 40px -10px rgba(38, 94, 155, 0.1);
        }
        .btn-3d-yellow {
            box-shadow: 0 6px 0px 0px #D9A40A;
            transition: all 0.1s ease;
        }
        .btn-3d-yellow:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0px 0px #D9A40A;
        }
        .btn-3d-blue {
            box-shadow: 0 6px 0px 0px #1A4576;
            transition: all 0.1s ease;
        }
        .btn-3d-blue:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0px 0px #1A4576;
        }
        .slide-content-enter {
            animation: fadeInScale 0.4s ease-out forwards;
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .sidebar-item { transition: all 0.3s ease; }
        .sidebar-item.active {
            background-color: #265E9B;
            color: white;
            transform: translateX(10px);
        }

        /* Checkbox styling */
        .custom-checkbox {
            width: 32px;
            height: 32px;
            border: 3px solid #265E9B;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .custom-checkbox.checked {
            background-color: #339D9D;
            border-color: #339D9D;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }
    </style>
</head>
<body class="h-screen flex flex-col font-sans">

    <!-- Modal Konfirmasi Quiz -->
    <div id="quiz-modal" class="fixed inset-0 bg-kalananti-blue/40 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[3rem] p-10 max-w-md w-full card-shadow text-center slide-content-enter">
            <div class="w-24 h-24 bg-yellow-50 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#F9C013" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
            </div>
            <h3 class="text-2xl font-black text-kalananti-blue mb-2">Kamu Yakin?</h3>
            <p class="text-gray-500 font-medium mb-8">Apakah kamu ingin menyudahi materi dan langsung mengerjakan Quiz sekarang?</p>
            <div class="flex flex-col gap-3">
                <button onclick="goToQuiz()" class="w-full bg-kalananti-blue text-white font-black py-4 rounded-2xl hover:bg-kalananti-blue-dark transition-all shadow-lg">Ya, Kerjakan Quiz!</button>
                <button onclick="closeModal()" class="w-full bg-gray-100 text-gray-500 font-bold py-4 rounded-2xl hover:bg-gray-200 transition-all">Belum, Kembali Belajar</button>
            </div>
        </div>
    </div>

    <!-- Top Header Navigation -->
    <nav class="w-full bg-white/90 border-b border-blue-50 px-6 py-4 flex justify-between items-center shadow-sm z-50">
        <div class="flex items-center gap-6">
            <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/828072b7-9198-4367-bce2-134b9fc8b486.png" alt="Logo" class="h-8 md:h-10">
            <div class="h-8 w-[2px] bg-gray-100 hidden md:block"></div>
            <div class="hidden md:flex flex-col">
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Petualangan Kodemu</p>
                <h2 class="font-black text-kalananti-blue text-sm">Planet Suede <span class="text-gray-300 mx-2">/</span> Sesi 2</h2>
            </div>
        </div>
        
        <button onclick="window.location.href='dashboard.html'" class="bg-blue-50 hover:bg-blue-100 text-kalananti-blue px-6 py-2.5 rounded-2xl font-black text-sm flex items-center gap-2 transition-all border border-blue-100 group">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="group-hover:-translate-x-1 transition-transform"><path d="m15 18-6-6 6-6"/></svg>
            Kembali ke Dashboard
        </button>
    </nav>

    <div class="flex-1 flex overflow-hidden p-4 md:p-8 gap-6">
        
        <!-- Main Area -->
        <main class="flex-[2] flex flex-col gap-6 relative">
            <div id="content-card" class="flex-1 bg-white rounded-[3rem] card-shadow border border-white flex flex-col relative overflow-hidden">
                <!-- BG Pattern -->
                <div class="absolute inset-0 opacity-[0.03] pointer-events-none">
                    <svg width="100%" height="100%"><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#265E9B" stroke-width="1"/></pattern><rect width="100%" height="100%" fill="url(#grid)"/></svg>
                </div>

                <!-- Main Content Display -->
                <div id="main-display" class="flex-1 p-10 flex flex-col items-center justify-center text-center z-10 slide-content-enter overflow-y-auto">
                    <!-- Dinamis -->
                </div>

                <!-- Footer Nav (Only for Slides) -->
                <div id="slide-nav" class="px-10 py-8 border-t border-gray-50 flex justify-between items-center z-10 bg-white/50 backdrop-blur-sm">
                    <button id="prev-btn" onclick="changeSlide(-1)" class="w-14 h-14 rounded-2xl border-2 border-blue-100 text-kalananti-blue flex items-center justify-center hover:bg-blue-50 disabled:opacity-30 disabled:pointer-events-none transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    </button>
                    <div id="slide-dots" class="flex gap-3"></div>
                    <button id="next-btn" onclick="changeSlide(1)" class="w-14 h-14 rounded-2xl bg-kalananti-blue text-white flex items-center justify-center hover:bg-kalananti-blue-dark shadow-lg transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- Sidebar (Kanan) -->
        <aside class="flex-1 hidden lg:flex flex-col gap-6 max-w-md">
            <!-- Objectives Card -->
            <div class="bg-white rounded-[2.5rem] p-8 card-shadow border border-white flex flex-col h-full overflow-hidden">
                <div class="flex items-center gap-3 mb-6">
                    <div id="phase-icon" class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-kalananti-blue">
                        <!-- Icon dinamis -->
                    </div>
                    <div>
                        <p id="sidebar-subtitle" class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-0.5">Sekarang Lagi:</p>
                        <h3 id="sidebar-title" class="font-black text-2xl text-kalananti-blue-dark uppercase tracking-tight leading-none">Misi Hari Ini</h3>
                    </div>
                </div>

                <!-- Task List Section -->
                <div id="task-list" class="space-y-4 overflow-y-auto pr-2 flex-1">
                    <!-- Dinamis diisi JS -->
                </div>

                <!-- Footer Buttons (Dinamis berdasarkan Phase) -->
                <div id="sidebar-footer" class="mt-8 flex flex-col gap-4">
                    <!-- Dinamis -->
                </div>
            </div>
        </aside>
    </div>

    <script>
        // State Management
        let currentPhase = 'learning'; // 'learning', 'must-do', 'should-do', 'aspire-do'
        let currentSlide = 0;
        let checkedTasks = {
            'must-do': [],
            'should-do': [],
            'aspire-do': []
        };

        const slides = [
            { title: "Halo, Penjelajah Kode!", content: "Hari ini kita akan belajar cara membuat karakter atau <b>Sprite</b> bergerak. Siap?", image: "https://api.dicebear.com/7.x/bottts/svg?seed=Explorer" },
            { title: "Blok Biru Adalah Gerakan", content: "Di Scratch, semua yang berhubungan dengan gerak ada di dalam kategori warna <b>Biru</b>.", image: "https://api.dicebear.com/7.x/bottts/svg?seed=Move" },
            { title: "Ayo Coba 'Move 10 Steps'", content: "Seret blok ini ke area kode untuk melihat Sprite-mu maju ke depan!", image: "https://api.dicebear.com/7.x/bottts/svg?seed=Steps" }
        ];

        const taskContent = {
            'must-do': {
                title: 'Must Do',
                icon: '🚀',
                description: 'Tantangan Dasar: Wajib Selesai!',
                instruction: 'Buka Scratch, lalu pilih karakter ikan kesukaanmu. Jangan lupa buat dia bisa bergerak maju sedikit ya!',
                tasks: ["Buka Project Scratch baru", "Tambahkan Sprite Ikan", "Pasang blok 'When Flag Clicked'", "Tambahkan blok 'Move 10 Steps'"]
            },
            'should-do': {
                title: 'Should Do',
                icon: '⭐',
                description: 'Tantangan Tambahan: Biar Makin Keren!',
                instruction: 'Ganti suasana lautnya jadi lebih cantik. Tambahkan suara juga biar ikannya terasa hidup di dalam air!',
                tasks: ["Ganti warna background Laut", "Ganti kostum ikan setiap bergerak", "Tambahkan suara gelembung (bubbles)"]
            },
            'aspire-do': {
                title: 'Aspire to Do',
                icon: '👑',
                description: 'Tantangan Master: Untuk Sang Ahli!',
                instruction: 'Wah, kamu hebat! Sekarang buat sistem skor. Setiap kali ikan bergerak atau menyentuh sesuatu, skor bertambah!',
                tasks: ["Buat ikan bisa berbalik arah", "Tambahkan variabel Skor", "Buat ikan bisa dikejar Hiu"]
            }
        };

        function render() {
            const display = document.getElementById('main-display');
            const nav = document.getElementById('slide-nav');
            const sidebarTitle = document.getElementById('sidebar-title');
            const sidebarSubtitle = document.getElementById('sidebar-subtitle');
            const taskList = document.getElementById('task-list');
            const footer = document.getElementById('sidebar-footer');
            const phaseIcon = document.getElementById('phase-icon');

            // Reset animations
            display.classList.remove('slide-content-enter');
            void display.offsetWidth;
            display.classList.add('slide-content-enter');

            if (currentPhase === 'learning') {
                nav.style.display = 'flex';
                sidebarTitle.innerText = "Misi Hari Ini";
                sidebarSubtitle.innerText = "Sekarang Lagi:";
                phaseIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
                phaseIcon.className = "w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-kalananti-blue";
                
                const slide = slides[currentSlide];
                display.innerHTML = `
                    <div class="w-48 h-48 md:w-64 md:h-64 mb-8 bg-blue-50 rounded-full flex items-center justify-center border-4 border-dashed border-blue-100">
                        <img src="${slide.image}" class="w-40 md:w-52 h-auto drop-shadow-xl">
                    </div>
                    <h2 class="text-4xl md:text-5xl font-black mb-4 text-kalananti-blue-dark">${slide.title}</h2>
                    <p class="text-xl md:text-2xl text-gray-500 max-w-2xl leading-relaxed">${slide.content}</p>
                `;

                // Dots
                document.getElementById('slide-dots').innerHTML = slides.map((_, i) => `
                    <div class="h-3 rounded-full transition-all duration-300 ${i === currentSlide ? 'w-10 bg-kalananti-blue' : 'w-3 bg-blue-100'}"></div>
                `).join('');
                document.getElementById('prev-btn').disabled = currentSlide === 0;

                // Sidebar Items (Misi)
                taskList.innerHTML = slides.map((s, i) => `
                    <div class="sidebar-item p-4 rounded-2xl flex items-start gap-3 ${i === currentSlide ? 'active' : 'bg-gray-50 text-gray-400'}">
                        <div class="mt-1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg></div>
                        <p class="font-bold text-sm leading-relaxed">${s.title}</p>
                    </div>
                `).join('');

                footer.innerHTML = `
                    <button onclick="setPhase('must-do')" class="w-full btn-3d-yellow bg-kalananti-yellow text-kalananti-blue-dark font-black py-5 px-6 rounded-3xl text-lg flex items-center justify-between group">
                        <span>Lanjut ke Must Do</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="group-hover:translate-x-1 transition-transform"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                    <button class="w-full bg-white text-kalananti-blue border-2 border-blue-100 font-bold py-5 px-6 rounded-3xl text-lg flex items-center justify-between hover:bg-blue-50 transition-all card-shadow">
                        <span>Materi Lain</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                `;
            } else {
                // Phases: Must, Should, Aspire
                nav.style.display = 'none';
                const data = taskContent[currentPhase];
                sidebarTitle.innerText = data.title;
                sidebarSubtitle.innerText = "Ayo Selesaikan:";
                
                // Set Phase Icon
                if(currentPhase === 'must-do') {
                    phaseIcon.className = "w-12 h-12 bg-red-50 rounded-2xl flex items-center justify-center text-red-500 text-2xl";
                    phaseIcon.innerText = "🚀";
                } else if(currentPhase === 'should-do') {
                    phaseIcon.className = "w-12 h-12 bg-yellow-50 rounded-2xl flex items-center justify-center text-yellow-500 text-2xl";
                    phaseIcon.innerText = "⭐";
                } else {
                    phaseIcon.className = "w-12 h-12 bg-green-50 rounded-2xl flex items-center justify-center text-green-500 text-2xl";
                    phaseIcon.innerText = "👑";
                }

                display.innerHTML = `
                    <div class="w-40 h-40 mb-6 bg-blue-50 rounded-full flex items-center justify-center border-4 border-dashed border-blue-100">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${currentPhase}" class="w-32 h-auto drop-shadow-xl">
                    </div>
                    <h2 class="text-4xl font-black mb-2 text-kalananti-blue-dark">${data.title} Challenge</h2>
                    <p class="text-lg text-gray-500 max-w-xl font-medium mb-8">${data.description}</p>
                    
                    <!-- Instruction Box (From Wireframe) -->
                    <div class="mt-4 p-8 bg-blue-50/80 rounded-[2.5rem] border-4 border-white shadow-inner max-w-2xl w-full text-left relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-4 opacity-10">
                            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#265E9B" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                        </div>
                        <h4 class="text-kalananti-blue uppercase font-black text-xs tracking-widest mb-3 flex items-center gap-2">
                             Instruksi :
                        </h4>
                        <p class="text-xl font-bold text-kalananti-blue-dark leading-relaxed">
                            "${data.instruction}"
                        </p>
                    </div>
                `;

                taskList.innerHTML = data.tasks.map((t, i) => `
                    <div onclick="toggleTask(${i})" class="p-5 rounded-[2.5rem] border-2 transition-all flex items-center gap-5 cursor-pointer ${checkedTasks[currentPhase].includes(i) ? 'bg-green-50 border-ruangguru-green' : 'bg-white border-blue-50 hover:border-blue-200'}">
                        <div class="custom-checkbox ${checkedTasks[currentPhase].includes(i) ? 'checked' : ''}">
                            ${checkedTasks[currentPhase].includes(i) ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="5"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
                        </div>
                        <p class="font-bold text-base leading-tight ${checkedTasks[currentPhase].includes(i) ? 'text-ruangguru-green' : 'text-kalananti-blue-dark'}">${t}</p>
                    </div>
                `).join('');

                const isAllChecked = checkedTasks[currentPhase].length === data.tasks.length;
                let nextPhaseAction = "";
                
                if (currentPhase === 'must-do') {
                    nextPhaseAction = "setPhase('should-do')";
                } else if (currentPhase === 'should-do') {
                    nextPhaseAction = "setPhase('aspire-do')";
                } else {
                    nextPhaseAction = "openModal()";
                }

                footer.innerHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="openModal()" class="btn-3d-blue bg-kalananti-blue text-white font-black py-4 px-4 rounded-2xl text-lg">Done</button>
                        <button onclick="${isAllChecked ? nextPhaseAction : "showWarning()"}" 
                                class="btn-3d-yellow bg-kalananti-yellow text-kalananti-blue-dark font-black py-4 px-4 rounded-2xl text-lg ${!isAllChecked ? 'opacity-50 grayscale cursor-not-allowed' : ''}">
                            Lanjut
                        </button>
                    </div>
                    ${!isAllChecked ? `<p class="text-[11px] text-center font-bold text-red-500 animate-bounce mt-2">Selesaikan dulu semua tugas di atas ya! ✨</p>` : ''}
                `;
            }
        }

        function changeSlide(dir) {
            currentSlide += dir;
            render();
        }

        function setPhase(phase) {
            currentPhase = phase;
            render();
        }

        function toggleTask(index) {
            const list = checkedTasks[currentPhase];
            if (list.includes(index)) {
                checkedTasks[currentPhase] = list.filter(i => i !== index);
            } else {
                checkedTasks[currentPhase].push(index);
            }
            render();
        }

        function openModal() {
            document.getElementById('quiz-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('quiz-modal').style.display = 'none';
        }

        function goToQuiz() {
            window.location.href = "quiz.html";
            return;
            const modal = document.querySelector('#quiz-modal .bg-white');
            modal.innerHTML = `
                <div class="animate-bounce mb-6"><svg width="60" height="60" viewBox="0 0 24 24" fill="#339D9D"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg></div>
                <h3 class="text-2xl font-black text-ruangguru-green">Meluncur ke Quiz!</h3>
                <p class="text-gray-500 mt-2">Menyiapkan tantangan terakhir...</p>
            `;
            setTimeout(() => {
                closeModal();
                alert("Redirecting to Quiz...");
            }, 1500);
        }

        function showWarning() {
            const card = document.getElementById('content-card');
            card.classList.add('animate-shake');
            setTimeout(() => card.classList.remove('animate-shake'), 500);
        }

        // Init
        render();
    </script>
</body>
</html>
