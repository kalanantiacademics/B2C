<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalananti Learning - Materi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Quicksand', 'sans-serif'] },
                    colors: {
                        'kalananti-blue': '#265E9B',
                        'kalananti-blue-dark': '#1A4576',
                        'kalananti-yellow': '#F9C013',
                        'ruangguru-green': '#339D9D',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F4F9FF; background-image: radial-gradient(at 0% 0%, rgba(38, 94, 155, 0.05) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(51, 157, 157, 0.05) 0px, transparent 50%); color: #265E9B; overflow: hidden; }
        .card-shadow { box-shadow: 0 20px 40px -10px rgba(38, 94, 155, 0.1); }
        .btn-3d-yellow { box-shadow: 0 6px 0px 0px #D9A40A; transition: all 0.1s ease; }
        .btn-3d-yellow:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0px 0px #D9A40A; }
        .btn-3d-blue { box-shadow: 0 6px 0px 0px #1A4576; transition: all 0.1s ease; }
        .btn-3d-blue:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0px 0px #1A4576; }
        .slide-content-enter { animation: fadeInScale 0.4s ease-out forwards; }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .sidebar-item { transition: all 0.3s ease; }
        .sidebar-item.active { background-color: #265E9B; color: white; transform: translateX(10px); }
        .custom-checkbox { width: 32px; height: 32px; border: 3px solid #265E9B; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
        .custom-checkbox.checked { background-color: #339D9D; border-color: #339D9D; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }
        /* Materials text formatting */
        .material-content { line-height: 1.8; }
        .material-content img { max-width: 100%; border-radius: 1rem; margin: 1rem 0; border: 2px solid #e8f0fe; }
        .material-content p { margin-bottom: 0.75rem; }
        .kc-box { background: linear-gradient(135deg, #EEF4FF, #E8F4F8); border: 2px solid #C7DCF9; border-radius: 1.5rem; padding: 1.25rem; margin: 1rem 0; }
        .fyk-box { background: linear-gradient(135deg, #FFF9E6, #FFF3CC); border: 2px solid #F9C013; border-radius: 1.5rem; padding: 1.25rem; margin: 1rem 0; }
        .kc-box-title { font-weight: 900; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #265E9B; margin-bottom: 0.5rem; }
        .fyk-box-title { font-weight: 900; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #D9A40A; margin-bottom: 0.5rem; }
        .skeleton { animation: skelPulse 1.5s ease-in-out infinite; background: linear-gradient(90deg, #e8f0fe 25%, #d0e1ff 50%, #e8f0fe 75%); background-size: 200% 100%; border-radius: 1rem; }
        @keyframes skelPulse { 0%, 100% { background-position: 200% 0; } 50% { background-position: 0% 0; } }
    </style>
</head>
<body class="h-screen flex flex-col font-sans">

    <!-- Quiz Confirm Modal -->
    <div id="quiz-modal" class="fixed inset-0 bg-kalananti-blue/40 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[3rem] p-10 max-w-md w-full card-shadow text-center slide-content-enter">
            <div class="w-24 h-24 bg-yellow-50 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#F9C013" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
            </div>
            <h3 class="text-2xl font-black text-kalananti-blue mb-2">Kamu Yakin?</h3>
            <p class="text-gray-500 font-medium mb-8">Apakah kamu ingin menyudahi materi dan langsung mengerjakan Quiz sekarang?</p>
            <div class="flex flex-col gap-3">
                <button onclick="goToQuiz()" class="w-full bg-kalananti-blue text-white font-black py-4 rounded-2xl hover:bg-kalananti-blue-dark transition-all shadow-lg">Ya, Kerjakan Quiz!</button>
                <button onclick="closeModal()" class="w-full bg-gray-100 text-gray-500 font-bold py-4 rounded-2xl hover:bg-gray-200 transition-all">Belum, Kembali Belajar</button>
            </div>
        </div>
    </div>

    <!-- Top Header Navigation -->
    <nav class="w-full bg-white/90 border-b border-blue-50 px-6 py-4 flex justify-between items-center shadow-sm z-50">
        <div class="flex items-center gap-6">
            <img src="https://cdn-web-2.ruangguru.com/landing-pages/assets/828072b7-9198-4367-bce2-134b9fc8b486.png" alt="Logo" onclick="window.location.href='dashboard.html'" class="h-8 md:h-10 cursor-pointer hover:scale-105 transition-transform">
            <div class="h-8 w-[2px] bg-gray-100 hidden md:block"></div>
            <div class="hidden md:flex flex-col">
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Petualangan Kodemu</p>
                <h2 id="nav-title" class="font-black text-kalananti-blue text-sm">Roblox <span class="text-gray-300 mx-2">/</span> Sesi 1</h2>
            </div>
        </div>
        <button onclick="window.location.href='sessions.html'" class="bg-blue-50 hover:bg-blue-100 text-kalananti-blue px-6 py-2.5 rounded-2xl font-black text-sm flex items-center gap-2 transition-all border border-blue-100 group">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="group-hover:-translate-x-1 transition-transform"><path d="m15 18-6-6 6-6"/></svg>
            Kembali ke Daftar
        </button>
    </nav>

    <div class="flex-1 flex overflow-hidden p-4 md:p-8 gap-6">
        
        <!-- Main Area -->
        <main class="flex-[2] flex flex-col gap-6 relative">
            <div id="content-card" class="flex-1 bg-white rounded-[3rem] card-shadow border border-white flex flex-col relative overflow-hidden">
                <!-- BG Pattern -->
                <div class="absolute inset-0 opacity-[0.03] pointer-events-none">
                    <svg width="100%" height="100%"><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#265E9B" stroke-width="1"/></pattern><rect width="100%" height="100%" fill="url(#grid)"/></svg>
                </div>
                <!-- Loading -->
                <div id="content-loading" class="flex-1 p-10 flex flex-col gap-4 z-10">
                    <div class="skeleton h-8 w-1/3 mb-4"></div>
                    <div class="skeleton h-6 w-full"></div>
                    <div class="skeleton h-6 w-5/6"></div>
                    <div class="skeleton h-6 w-4/5"></div>
                    <div class="skeleton h-40 w-full mt-4"></div>
                    <div class="skeleton h-6 w-full"></div>
                    <div class="skeleton h-6 w-3/4"></div>
                </div>
                <!-- Content -->
                <div id="main-display" class="flex-1 p-10 flex flex-col items-center justify-center text-center z-10 slide-content-enter overflow-y-auto hidden"></div>
                <!-- Footer Nav (Only for Slides) -->
                <div id="slide-nav" class="px-10 py-8 border-t border-gray-50 flex justify-between items-center z-10 bg-white/50 backdrop-blur-sm hidden">
                    <button id="prev-btn" onclick="changeSlide(-1)" title="Slide sebelumnya" class="w-14 h-14 rounded-2xl border-2 border-blue-100 text-kalananti-blue flex items-center justify-center hover:bg-blue-50 disabled:opacity-30 disabled:pointer-events-none transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    </button>
                    <div id="slide-dots" class="flex gap-3"></div>
                    <button id="next-btn" onclick="changeSlide(1)" title="Slide selanjutnya" class="w-14 h-14 rounded-2xl bg-kalananti-blue text-white flex items-center justify-center hover:bg-kalananti-blue-dark shadow-lg transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- Sidebar -->
        <aside class="flex-1 hidden lg:flex flex-col gap-6 max-w-md">
            <div class="bg-white rounded-[2.5rem] p-8 card-shadow border border-white flex flex-col h-full overflow-hidden">
                <div class="flex items-center gap-3 mb-6">
                    <div id="phase-icon" class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-kalananti-blue">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    </div>
                    <div>
                        <p id="sidebar-subtitle" class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-0.5">Sekarang Lagi:</p>
                        <h3 id="sidebar-title" class="font-black text-2xl text-kalananti-blue-dark uppercase tracking-tight leading-none">Misi Hari Ini</h3>
                    </div>
                </div>
                <div id="task-list" class="space-y-4 overflow-y-auto pr-2 flex-1">
                    <div class="skeleton h-16 rounded-2xl"></div>
                    <div class="skeleton h-16 rounded-2xl"></div>
                    <div class="skeleton h-16 rounded-2xl"></div>
                </div>
                <div id="sidebar-footer" class="mt-8 flex flex-col gap-4"></div>
            </div>
        </aside>
    </div>

    <script>
        // Course-aware API URL
        const _COURSE_SHEETS = { roblox: 'B2C_RobloxStudio_Modul', scratch: 'B2C_Scratch_Modul' };
        const _selectedCourse = localStorage.getItem('selectedCourse') || 'roblox';
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwvNSa3hUMNqhNOINDeG3cPUdlQM-dGfl-dDX5WejhESjHRALipqhwJ_-3HXOJehtWbWw/exec?sheet=' + (_COURSE_SHEETS[_selectedCourse] || 'B2C_RobloxStudio_Modul');

        // ── State ──────────────────────────────────────────────────────────────
        let currentPhase = 'learning';
        let currentSlide = 0;
        let checkedTasks = { 'must-do': [], 'should-do': [], 'aspire-do': [] };
        let slides = [];
        let taskContent = {};
        let lessonData = null;
        const activeLesson = parseInt(localStorage.getItem('activeLesson') || '1');

        // ── Data Loading ───────────────────────────────────────────────────────
        async function init() {
            try {
                const res = await fetch(WEB_APP_URL);
                const rawData = await res.json();
                const lessons = rawData.filter(r => r.col_1 && typeof r.col_1 === 'number');
                lessonData = lessons.find(r => r.col_1 === activeLesson);
                if (!lessonData) throw new Error('Lesson not found');

                document.getElementById('nav-title').innerHTML = `Roblox <span class="text-gray-300 mx-2">/</span> Sesi ${activeLesson}`;

                processLessonData(lessonData);
                document.getElementById('content-loading').classList.add('hidden');
                document.getElementById('main-display').classList.remove('hidden');
                document.getElementById('slide-nav').classList.remove('hidden');
                render();
            } catch (e) {
                console.error(e);
                document.getElementById('content-loading').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full gap-4">
                        <span class="text-5xl">😵</span>
                        <h3 class="text-2xl font-black text-kalananti-blue-dark">Gagal Memuat Materi</h3>
                        <p class="text-gray-400 font-bold">Cek koneksi internet kamu.</p>
                        <button onclick="init()" class="mt-4 bg-kalananti-blue text-white font-black px-8 py-4 rounded-2xl">Coba Lagi</button>
                    </div>`;
            }
        }

        // ── Parser kc* / fyk* ─────────────────────────────────────────────────
        function parseKamusCoder(kcRaw) {
            // "kc1:\n• term - def\n\nkc2:\n• ..."
            const result = {};
            const blocks = kcRaw.split(/\nkc(\d+):/);
            // blocks: ['', '1', 'content1', '2', 'content2', ...]
            for (let i = 1; i < blocks.length; i += 2) {
                result[`kc${blocks[i]}`] = blocks[i + 1]?.trim() || '';
            }
            return result;
        }

        function parseFyk(fykRaw) {
            // "fyk1:\n• content\n\nfyk2:\n..."
            const result = {};
            const blocks = fykRaw.split(/\nfyk(\d+):/);
            for (let i = 1; i < blocks.length; i += 2) {
                result[`fyk${blocks[i]}`] = blocks[i + 1]?.trim() || '';
            }
            return result;
        }

        function injectPlaceholders(text, kcMap, fykMap) {
            // Replace fyk1*, fyk2*, ..., kc1*, kc2*, ... with formatted boxes
            let result = text;

            // Fix: parse kamus_coder that has kc1: on first line (no newline before it)
            // The format is: "kc1:\n• term..."
            const kcRaw = lessonData.col_8 || '';
            const fykRaw = lessonData.col_9 || '';

            // Re-parse with flexible regex
            const kcBlocks = {};
            kcRaw.replace(/kc(\d+):\n?([\s\S]*?)(?=\nkc\d+:|$)/g, (_, n, content) => {
                kcBlocks[`kc${n}`] = content.trim();
            });

            const fykBlocks = {};
            fykRaw.replace(/fyk(\d+):\n?([\s\S]*?)(?=\nfyk\d+:|$)/g, (_, n, content) => {
                fykBlocks[`fyk${n}`] = content.trim();
            });

            // Replace kc1* etc
            result = result.replace(/kc(\d+)\*/g, (_, n) => {
                const key = `kc${n}`;
                const content = kcBlocks[key] || '';
                if (!content) return '';
                return `<div class="kc-box"><div class="kc-box-title">📚 Kamus Coder</div><div class="text-sm font-semibold text-kalananti-blue-dark whitespace-pre-line">${content}</div></div>`;
            });

            // Replace fyk1* etc
            result = result.replace(/fyk(\d+)\*/g, (_, n) => {
                const key = `fyk${n}`;
                const content = fykBlocks[key] || '';
                if (!content) return '';
                return `<div class="fyk-box"><div class="fyk-box-title">💡 For Your Knowledge</div><div class="text-sm font-semibold text-yellow-900 whitespace-pre-line">${content}</div></div>`;
            });

            return result;
        }

        function formatMaterialContent(raw) {
            if (!raw) return '';
            // Convert URLs that are image links to <img> tags
            let text = raw.replace(/(https?:\/\/\S+\.(png|jpg|jpeg|gif|webp|svg))\s*/gi, '<img src="$1" alt="materi" loading="lazy">');
            // Convert plain URLs (non-image) to links: skip if already in img tag
            text = text.replace(/(?<!src=")(https?:\/\/[^\s<"]+)(?<!\.(png|jpg|jpeg|gif|webp|svg))/gi, '<a href="$1" target="_blank" class="text-kalananti-blue underline font-bold">🔗 Buka Link</a>');
            // Wrap in paragraphs by double newlines
            return text;
        }

        function processLessonData(lesson) {
            const rawMaterial = lesson.col_3 || '';
            const processed = injectPlaceholders(rawMaterial);

            // Split materials into slides by "Tahap N:" headings
            const tahapRegex = /\n?(Tahap \d+:[^\n]*)\n/g;
            let lastIndex = 0;
            let match;
            const parts = [];

            // First part: intro before first Tahap
            const firstTahap = rawMaterial.search(/Tahap \d+:/);
            if (firstTahap > 0) {
                parts.push({ title: 'Intro', content: rawMaterial.substring(0, firstTahap) });
            }

            const processedMaterial = injectPlaceholders(rawMaterial);
            const tahapPartsRaw = rawMaterial.split(/\n(?=Tahap \d+:)/);

            // If there are Tahap headings, split into slides
            if (tahapPartsRaw.length > 1) {
                tahapPartsRaw.forEach((part, idx) => {
                    const titleMatch = part.match(/^(Tahap \d+:[^\n]*)\n/);
                    const title = titleMatch ? titleMatch[1] : `Bagian ${idx + 1}`;
                    const content = injectPlaceholders(part);
                    const formatted = formatMaterialContent(content);
                    parts.push({ title, content: formatted });
                });
                slides = parts.slice(0, 1); // Intro slide
                // Actually use all parts
                slides = tahapPartsRaw.map((part, idx) => {
                    const titleMatch = part.match(/^(Tahap \d+:[^\n]*)\n/);
                    const title = titleMatch ? titleMatch[1] : (idx === 0 ? 'Pengantar' : `Bagian ${idx + 1}`);
                    const content = formatMaterialContent(injectPlaceholders(part));
                    return { title, content };
                });
            } else {
                // Single slide
                slides = [{ title: `Sesi ${activeLesson}`, content: formatMaterialContent(injectPlaceholders(rawMaterial)) }];
            }

            // Add intro as first slide (the content before first Tahap)
            // Parse tasks
            function parseTasks(raw) {
                if (!raw) return [];
                return raw.split('\n')
                    .map(l => l.replace(/^•\s*\[\s*\]\s*/, '').trim())
                    .filter(l => l.length > 0 && !l.startsWith('•') && !l.startsWith('-'));
            }

            function parseTasksFromLines(raw) {
                if (!raw) return [];
                return raw.split('\n')
                    .map(l => l.replace(/^•\s*\[\s*\]\s*/, '').replace(/^•\s*/, '').trim())
                    .filter(l => l.length > 0 && !l.match(/^\s*$/));
            }

            taskContent = {
                'must-do': {
                    title: 'Must Do',
                    icon: '🚀',
                    description: 'Tantangan Wajib: Harus Selesai!',
                    instruction: 'Selesaikan semua tugas berikut sebelum melanjutkan ke bagian berikutnya!',
                    tasks: parseTasksFromLines(lesson.col_4)
                },
                'should-do': {
                    title: 'Should Do',
                    icon: '⭐',
                    description: 'Tantangan Tambahan: Biar Makin Keren!',
                    instruction: 'Tantangan ekstra untuk yang ingin belajar lebih jauh!',
                    tasks: parseTasksFromLines(lesson.col_5)
                },
                'aspire-do': {
                    title: 'Aspire to Do',
                    icon: '👑',
                    description: 'Tantangan Master: Untuk Sang Ahli!',
                    instruction: 'Tantangan paling menantang. Buktikan kemampuan terbaikmu!',
                    tasks: parseTasksFromLines(lesson.col_6)
                }
            };
        }

        // ── Render ─────────────────────────────────────────────────────────────
        function render() {
            const display = document.getElementById('main-display');
            const nav = document.getElementById('slide-nav');
            const sidebarTitle = document.getElementById('sidebar-title');
            const sidebarSubtitle = document.getElementById('sidebar-subtitle');
            const taskList = document.getElementById('task-list');
            const footer = document.getElementById('sidebar-footer');
            const phaseIcon = document.getElementById('phase-icon');

            display.classList.remove('slide-content-enter');
            void display.offsetWidth;
            display.classList.add('slide-content-enter');

            if (currentPhase === 'learning') {
                nav.style.display = 'flex';
                sidebarTitle.innerText = 'Misi Hari Ini';
                sidebarSubtitle.innerText = 'Sekarang Lagi:';
                phaseIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
                phaseIcon.className = 'w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-kalananti-blue';

                const slide = slides[currentSlide];
                display.innerHTML = `
                    <div class="w-full h-full text-left material-content overflow-y-auto">
                        <div class="inline-flex items-center gap-2 bg-blue-50 text-kalananti-blue px-4 py-1.5 rounded-xl text-xs font-black mb-4 uppercase tracking-widest">
                            ${slide.title}
                        </div>
                        <div class="text-base font-semibold text-gray-700 leading-relaxed whitespace-pre-line">${slide.content}</div>
                    </div>`;

                document.getElementById('slide-dots').innerHTML = slides.map((_, i) =>
                    `<div class="h-3 rounded-full transition-all duration-300 ${i === currentSlide ? 'w-10 bg-kalananti-blue' : 'w-3 bg-blue-100'}"></div>`
                ).join('');
                document.getElementById('prev-btn').disabled = currentSlide === 0;
                document.getElementById('next-btn').disabled = currentSlide >= slides.length - 1;

                taskList.innerHTML = slides.map((s, i) => `
                    <div onclick="jumpToSlide(${i})" class="sidebar-item cursor-pointer p-4 rounded-2xl flex items-start gap-3 ${i === currentSlide ? 'active' : 'bg-gray-50 text-gray-400'}">
                        <div class="mt-1 shrink-0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg></div>
                        <p class="font-bold text-sm leading-relaxed">${s.title}</p>
                    </div>`
                ).join('');

                footer.innerHTML = `
                    <button onclick="setPhase('must-do')" class="w-full btn-3d-yellow bg-kalananti-yellow text-kalananti-blue-dark font-black py-5 px-6 rounded-3xl text-lg flex items-center justify-between group">
                        <span>Lanjut ke Must Do 🚀</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="group-hover:translate-x-1 transition-transform"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                    <button onclick="window.location.href='sessions.html'" class="w-full bg-white text-kalananti-blue border-2 border-blue-100 font-bold py-5 px-6 rounded-3xl text-lg flex items-center justify-between hover:bg-blue-50 transition-all card-shadow">
                        <span>Daftar Sesi</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                    </button>`;
            } else {
                nav.style.display = 'none';
                const data = taskContent[currentPhase];
                sidebarTitle.innerText = data.title;
                sidebarSubtitle.innerText = 'Ayo Selesaikan:';

                if (currentPhase === 'must-do') {
                    phaseIcon.className = 'w-12 h-12 bg-red-50 rounded-2xl flex items-center justify-center text-red-500 text-2xl';
                    phaseIcon.innerText = '🚀';
                } else if (currentPhase === 'should-do') {
                    phaseIcon.className = 'w-12 h-12 bg-yellow-50 rounded-2xl flex items-center justify-center text-yellow-500 text-2xl';
                    phaseIcon.innerText = '⭐';
                } else {
                    phaseIcon.className = 'w-12 h-12 bg-green-50 rounded-2xl flex items-center justify-center text-green-500 text-2xl';
                    phaseIcon.innerText = '👑';
                }

                const phaseColor = currentPhase === 'must-do' ? 'rose' : currentPhase === 'should-do' ? 'yellow' : 'emerald';

                display.innerHTML = `
                    <div class="w-40 h-40 mb-6 bg-blue-50 rounded-full flex items-center justify-center border-4 border-dashed border-blue-100">
                        <span class="text-7xl">${data.icon}</span>
                    </div>
                    <h2 class="text-4xl font-black mb-2 text-kalananti-blue-dark">${data.title} Challenge</h2>
                    <p class="text-lg text-gray-500 max-w-xl font-medium mb-8">${data.description}</p>
                    <div class="mt-4 p-8 bg-blue-50/80 rounded-[2.5rem] border-4 border-white shadow-inner max-w-2xl w-full text-left relative overflow-hidden">
                        <h4 class="text-kalananti-blue uppercase font-black text-xs tracking-widest mb-3">Instruksi :</h4>
                        <p class="text-xl font-bold text-kalananti-blue-dark leading-relaxed">"${data.instruction}"</p>
                    </div>`;

                taskList.innerHTML = data.tasks.length > 0
                    ? data.tasks.map((t, i) => `
                        <div onclick="toggleTask(${i})" class="p-5 rounded-[2.5rem] border-2 transition-all flex items-center gap-5 cursor-pointer ${checkedTasks[currentPhase].includes(i) ? 'bg-green-50 border-ruangguru-green' : 'bg-white border-blue-50 hover:border-blue-200'}">
                            <div class="custom-checkbox ${checkedTasks[currentPhase].includes(i) ? 'checked' : ''}">
                                ${checkedTasks[currentPhase].includes(i) ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="5"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
                            </div>
                            <p class="font-bold text-base leading-tight ${checkedTasks[currentPhase].includes(i) ? 'text-ruangguru-green' : 'text-kalananti-blue-dark'}">${t}</p>
                        </div>`
                    ).join('')
                    : '<p class="text-center text-gray-300 font-bold py-8">Tidak ada tugas tersedia.</p>';

                const isAllChecked = data.tasks.length === 0 || checkedTasks[currentPhase].length === data.tasks.length;
                let nextPhaseAction = currentPhase === 'must-do' ? "setPhase('should-do')" : currentPhase === 'should-do' ? "setPhase('aspire-do')" : "openModal()";

                footer.innerHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="setPhase('learning')" class="btn-3d-blue bg-kalananti-blue text-white font-black py-4 px-4 rounded-2xl text-base">← Materi</button>
                        <button onclick="${isAllChecked ? nextPhaseAction : "showWarning()"}"
                                class="btn-3d-yellow bg-kalananti-yellow text-kalananti-blue-dark font-black py-4 px-4 rounded-2xl text-base ${!isAllChecked ? 'opacity-50 grayscale cursor-not-allowed' : ''}">
                            Lanjut →
                        </button>
                    </div>
                    <button onclick="openModal()" class="w-full bg-white border-2 border-blue-100 text-kalananti-blue font-black py-4 rounded-2xl hover:bg-blue-50 transition-all">
                        🧩 Ke Quiz
                    </button>
                    ${!isAllChecked ? `<p class="text-[11px] text-center font-bold text-red-500 animate-bounce">Selesaikan dulu semua tugas di atas ya! ✨</p>` : ''}`;
            }
        }

        function changeSlide(dir) {
            currentSlide = Math.max(0, Math.min(slides.length - 1, currentSlide + dir));
            render();
        }
        function jumpToSlide(i) { currentSlide = i; render(); }
        function setPhase(phase) { currentPhase = phase; render(); }
        function toggleTask(index) {
            const list = checkedTasks[currentPhase];
            if (list.includes(index)) { checkedTasks[currentPhase] = list.filter(i => i !== index); }
            else { checkedTasks[currentPhase].push(index); }
            render();
        }
        function openModal() { document.getElementById('quiz-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('quiz-modal').style.display = 'none'; }
        function goToQuiz() { window.location.href = 'quiz.html'; }
        function showWarning() {
            const card = document.getElementById('content-card');
            card.classList.add('animate-shake');
            setTimeout(() => card.classList.remove('animate-shake'), 500);
        }

        init();
    </script>
</body>
</html>
